[project]
name = "finance-valuation"
version = "0.1.0"
description = "Free-cash-flow-to-the-firm valuation engine for the company research library (AGENTS.md section 18)"
readme = "tools/valuation/README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.scripts]
value = "valuation.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/valuation"]

[tool.hatch.build.targets.sdist]
include = ["tools/valuation", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tools/valuation/tests"]

[tool.uv]
package = true

      values: [0.26, 0.23, 0.21, 0.19, 0.17]
      reason: "Growth runs about two points above the June quarter for a year, because the order book grew by more than 50 billion USD in a quarter, customers are using half again more than they committed to, chip-system revenue arrives with no year-earlier base, and rented capacity relieves the supply shortage that has held revenue back; then it fades far more slowly than in the base case, on the view that assistant answers create more questions and richer ads while Cloud and the chip-system business compound (outlook.md sections 2 and 3). Even year five is below what the company grew in 2025 and 2026, but the case only works if Search keeps growing in the mid-teens and Cloud is twice today's Search by year five. By year ten revenue is about four times today's, which would make Alphabet far larger than any company Damodaran has counted."
      source: "[10-Q Q2 2026, Note 2] [10-Q Q2 2026, Item 2] [Q2 2026 call, p.3] [Q2 2026 call, p.4] [Q2 2026 call, p.12] [Q2 2026 call, p.13] [Q2 2026 call, p.15] [Q2 2026 call, p.24] [Q2 2026 release, p.1] [10-K FY2025, Item 7]"
      detail: |
        End state first. In year 10 (the twelve months to June 2036) this case has Alphabet at about 1,842,000 of revenue, 4.1 times the base year of 445,866; in year 5 it is about 1,164,000 (2.6 times), with Cloud at about 489,000 (42% of the company and twice today's Search business of 243,310) and Search at about 468,000. The economy at 4.78% nominal growth is 1.6 times today's in year ten, so Alphabet's share of it rises about two and a half times; Damodaran's January 2023 count found only five companies above 400 billion USD of revenue and called a trillion unprecedented, and this case passes a trillion in year five [Damodaran notes, story-to-numbers playbook, section 2] [Damodaran notes, story-to-numbers playbook, section 6]. No cached source gives a market size or a competitor's revenue (see the market-size diagnostic). The path below is backed out from that end state, and it is the possible-test's weak point for this case.

        Segment build. Trailing revenue is the twelve months to June 30, 2026; latest growth is the June 2026 quarter against the same quarter of 2025 [10-K FY2025, Item 7] [10-Q Q2 2026, Note 2] [Q2 2026 release, p.1].

        | Line | Trailing revenue | Latest growth | Year 1 | Year 2 | Year 3 | Year 4 | Year 5 | Year 5 revenue |
        |---|---|---|---|---|---|---|---|---|
        | Google Search and other | 243,310 | 17% | 16% | 15% | 14% | 13% | 12% | 468,292 |
        | YouTube ads | 42,582 | 13% | 14% | 13% | 12% | 11% | 10% | 75,014 |
        | Google Network | 29,456 | -1% | 0% | -1% | -1% | -1% | -1% | 28,295 |
        | Google subscriptions, platforms and devices | 51,743 | 15% | 18% | 17% | 16% | 15% | 14% | 108,638 |
        | Google Cloud | 77,617 | 82% | 78% | 52% | 40% | 32% | 26% | 488,982 |
        | Other Bets | 1,507 | 2% | 25% | 25% | 25% | 25% | 25% | 4,599 |
        | Currency-protection gains and losses | -349 | n/a | held flat | held flat | held flat | held flat | held flat | -349 |
        | Whole company | 445,866 | 24% | 25.8% | 23.4% | 21.3% | 19.3% | 17.2% | 1,173,472 |

        The build gives 25.8, 23.4, 21.3, 19.3 and 17.2 per cent; the path is written as 26, 23, 21, 19 and 17, each the nearest whole point. Revenue on the written path: 561,791 in year one, then 691,003, 836,114, 994,975 and 1,164,121; the years 6 to 10 fade gives 1,333,571, 1,495,093, 1,639,638, 1,758,086 and 1,842,122.

        Year one against the run-rate: reported growth was 24.2% in the June quarter and 23.1% in the first half, so this case runs about two points above the reported rate. The deviation is sourced: the order book grew by more than 50,000 in a single quarter to 513,900, customers are 'exceeding their commitments by more than 50%', the chip-system sales whose 'vast majority' falls in 2027 are new revenue with no year-earlier base, third-party capacity is rented from the third quarter to keep growing the customer base, and the company says it is still supply constrained, so the revenue foregone this year arrives when capacity does [10-Q Q2 2026, Note 2] [Q2 2026 call, p.4] [Q2 2026 call, p.13] [Q2 2026 call, p.15]. Against that stand the currency headwind and the Search comparison, which take Search from 17% to 16% rather than further because AI Max is unlocking 'billions of net new searches that weren't really monetizable before' [Q2 2026 call, p.13] [Q2 2026 call, p.24]; that is why the case does not go higher.

        What each line leans on: AI Mode past one billion monthly users and the Gemini app at 950 million with daily users tripling in a year; model interfaces handling about 22 billion tokens a minute against 16 billion a quarter earlier; nearly 90 per cent of the largest 100 United States companies using Gemini Enterprise; YouTube's subscription business growing faster than its ads [Q2 2026 call, p.2] [Q2 2026 call, p.3] [Q2 2026 call, p.4] [Q2 2026 call, p.5] [Q2 2026 call, p.9]. Network is held flat rather than growing, because it has shrunk every year since 2022 and the advertising-technology remedy is still to come. Search in the mid-teens is above the 9.2% expected five-year growth of Damodaran's Advertising row and at the top of Search's own last five years (8% to 18%), which is what 'AI answers create more questions and richer ads' has to mean in numbers [Damodaran histgr.xls, Advertising and Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/histgr.csv] [10-K FY2025, Item 7].

        Order book check on years one and two: Cloud revenue of 138,158 then 210,001, or 348,159 together, against about 257,000 of order book due within 24 months plus revenue from contracts signed after June 2026 and usage above commitments; the 91,000 excess is less than two quarters of new signings at the latest pace of more than 50,000 a quarter [10-Q Q2 2026, Note 2] [Q2 2026 call, p.12].

        Steps down of more than three points, and what drives each: Cloud 78% to 52%, because the 24-month order-book conversion and the first ramp of chip-system sales both sit in years one and two; Cloud 52% to 40%, because the comparison base more than doubles; Cloud 40% to 32%, because capacity catches up with demand; Cloud 32% to 26%, because Cloud is by then more than 40 per cent of the company and hands off toward the growth of the largest software firms; and the whole-company step from 21.3% to 19.3% (two points, named for completeness), which is those Cloud steps diluted by a Search business still growing in the teens.

        Growth against margin: this case pairs the fastest growth with the highest margin, which is only consistent because the growth comes from usage on capacity already bought and from auction-priced ads, not from price cuts; Cloud's margin rose fifteen points in a year while it grew 82% [Q2 2026 call, p.12].

        Where this sits against management's words: it takes 'very early innings', 'more bullish on the opportunities ahead' and 'demand still outpaces that investment' at face value and adds nothing management has not said, except the arithmetic of what those words imply [Q2 2026 call, p.14] [Q2 2026 call, p.15].

        The owner left this cell as drafted at the last save (26, 23, 21, 19, 17) and the rebuilt segment paths round to the same five numbers.
    operating_margin:
      values: [0.34, 0.34, 0.34, 0.35, 0.36]
      reason: "The margin edges up about three points over five years rather than falling: faster growth spreads the research and selling bills over more revenue, Cloud keeps closing the gap on the older businesses, and the money paid for search distribution shrinks fast as advertising becomes the smaller half of the company. The 36% target is reached in year five and is the company's own best quarter, three points above Damodaran's software industry average and level with the target he set Apple; it never goes higher because the depreciation from a bigger build-out is bigger too (business.md sections 3 and 4; outlook.md section 1)."
      source: "[10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2] [10-Q Q1 2026, Item 1] [Q2 2026 call, p.11] [Q2 2026 call, p.12] [Q2 2026 slides, p.9] [10-K FY2025, Item 8] [10-K FY2025, Note 1] [10-K FY2025, Note 15] [Damodaran margin.xls, Software (System & Application) and Advertising, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/margin.csv] [Damodaran notes, horizon and terminal, section 3d]"
      detail: |
        Where 36% sits. Inside the distribution tabled in the base margin detail: three points above the Software (System & Application) row of 33.0% and a little above the Semiconductor row of 35.3% [Damodaran margin.xls, Software (System & Application) and Advertising, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/margin.csv]; level with the 36.1% Alphabet earned in the March 2026 quarter, its best, and a point above its best half-year of 35.0% [10-Q Q1 2026, Item 1] [10-Q Q2 2026, Item 1]; level with the 36% Damodaran set as Apple's target and well below the 40% and 45% he gave Meta and Microsoft, whose businesses carry no traffic-acquisition bill [Damodaran notes, horizon and terminal, section 3d]. Google Services already earns 41.8% and Cloud 35.6%, so a 36% company margin is what the mix gives once the shared frontier-model research (4.8% of revenue) and Other Bets (2.0%) are charged, both of which this case keeps [Q2 2026 call, p.12] [10-Q Q2 2026, Note 15].

        Starting point: the twelve-month margin is 33.1%, the first half of 2026 ran at 35.0% and the March quarter at 36.1% before the depreciation wave [10-Q Q2 2026, Item 1] [10-Q Q1 2026, Item 1].

        The bridge, in points of revenue.

        | Share of revenue | Trailing | Year 1 | Year 2 | Year 3 | Year 4 | Year 5 |
        |---|---|---|---|---|---|---|
        | Payments for traffic (distribution deals and partner sites) | 14.1 | 12.8 | 11.7 | 10.8 | 10.1 | 9.5 |
        | Depreciation of property and equipment | 5.7 | 7.1 | 9.6 | 11.4 | 11.8 | 12.2 |
        | Everything else | 47.1 | 46.0 | 44.9 | 43.8 | 42.8 | 41.8 |
        | Operating margin | 33.1 | 34.1 | 33.9 | 34.0 | 35.4 | 36.5 |

        The drag is bigger than in the base case in money and smaller as a share of revenue, because revenue is bigger: depreciation reaches 141,818 by year five, 12.2% of revenue, against 5.7% today, on the same 11 cents per dollar schedule and asset lives [10-K FY2025, Item 8] [10-K FY2025, Note 1] [Q2 2026 call, p.11]. The distribution-payment rate drifts from 19.9% of advertising revenue to 19.5%, as the filings say it has been doing while Network shrinks, and advertising falls to 49 per cent of the company, so the payments fall to 9.5% of revenue [10-K FY2025, Item 7] [10-Q Q2 2026, Item 2]. Every other cost grows three points a year slower than revenue, easing to two and a half by year five: the first half of 2026 recorded 3.0 points on that same aggregate and 2024 recorded 6.8 once one-off charges are removed, while the June quarter recorded 1.6, so this case assumes the first-half pace holds as Cloud scales, which is what the segment numbers have been doing (Cloud margin 35.6% against 20.7% a year earlier, Google Services 41.8%) [10-Q Q2 2026, Item 1] [10-K FY2025, Item 8] [Q2 2026 call, p.12] [10-K FY2025, Note 15].

        The bridge gives 34.1, 33.9, 34.0, 35.4 and 36.5 per cent, written as 34, 34, 34, 35 and 36, with year five rounded down from an exact half because 37% would be above anything Alphabet has reported. Why the path does not go higher: the March 2026 quarter earned 36.1% with depreciation at 5.9% of revenue, before the wave; getting back there with depreciation at 12% means the offsets have to do all of that work first [10-Q Q1 2026, Item 1]. Growth spending inside operating expense, research at 15.5% of revenue including the 4.8% of shared frontier-model research, is kept in full [10-Q Q2 2026, Note 15].

        The owner left this cell as drafted at the last save (34, 34, 34, 35, 36) and the rebuilt bridge rounds to the same five numbers.
    sales_to_capital:
      value: 1.55
      value_late: 1.4
      reason: "Years one and two are set in money below, so this ratio drives years three to five: at 1.55 each dollar of net new investment brings in 1.55 dollars of new revenue, which is the software industry's average and sits near the top of Alphabet's own record, below only 2023 once acquisitions and working capital are counted and the one-year lag is allowed for. This is the case where the capacity bought early really does carry the later years, which is exactly when Damodaran says to set the early ratio high, and even so the five years together reinvest at 1.08, below the middle of Alphabet's record, because the two build-out years are charged in full. From year six it eases to 1.4, midway between the middle of Alphabet's record and the software industry, because in this case the company keeps growing on capacity it owns and chips it designs, and the year-ten return on capital the engine implies, about 31%, is level with today's return on operating capital."
      source: "[10-K FY2023, Item 8] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2] [Damodaran capex.xls, Total Market and Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/capex.csv] [Damodaran notes, story-to-numbers playbook, section 4] [Damodaran notes, horizon and terminal, section 3c] [Damodaran notes, horizon and terminal, section 3d]"
      detail: |
        Same three candidates and the same lagged history as the base case, with acquisitions and working capital counted: ratios of 1.36, 0.90, 1.73, 1.09 and about 1.21 for money spent in 2021 through 2025, median 1.21 and average 1.26 (on capital spending alone 1.75, 1.36, 2.10, 1.42 and about 1.22, median 1.42 and average 1.57); last year's marginal about 1.21; the Software (System & Application) row 1.54, Advertising 3.85, Total Market 0.82; Damodaran's Alphabet 1.20 and Meta 1.50 [10-K FY2023, Item 8] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [Damodaran capex.xls, Total Market and Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/capex.csv] [Damodaran notes, horizon and terminal, section 3d]. Where this case lands: 1.55 is the software industry's average and sits near the top of Alphabet's own record, below only 2023's 1.73 and above the other four years; it is the top of the plausible band, not beyond it, and it follows his instruction for a company that has invested ahead ('this number can be set to a high value for the first five years') [Damodaran notes, horizon and terminal, section 3c]. Even so, years one to five together charge 716,000 of net investment for the 772,000 of revenue added in years two to six, a ratio of 1.08, below the middle of the record, because the two build-out years are charged in full. The late ratio of 1.4 sits midway between the middle of the record (1.21) and the software industry's 1.54, the placement of his worked table ('approximately midway through their marginal sales to capital ratio from last year and the industry average'), above four of the record's five years and between the 1.20 and 1.50 he gave Alphabet and Meta in 2024 [Damodaran notes, story-to-numbers playbook, section 4]: this is the case where the company keeps growing on capacity it owns and chips it designs, so it stays somewhat more efficient than its own pre-AI history without reaching the software industry's figure, and the year-ten return on capital of about 31% below is the check that it is not set higher.

        What 1.55 and the money set for the first two years imply for spending:

        | Model year | Net investment | Depreciation it carries | Gross capital spending | Share of revenue |
        |---|---|---|---|---|
        | 1 | 197,452 | 39,801 | 238,652 | 42% |
        | 2 | 197,724 | 66,053 | 265,000 | 38% |
        | 3 | 102,491 | 95,203 | 197,694 | 24% |
        | 4 | 109,126 | 116,949 | 226,076 | 23% |
        | 5 | 109,322 | 141,818 | 251,140 | 22% |

        Years six to ten continue at 285,000 to 368,000, or 19% to 21% of revenue. Spending eases once from the 2027 peak, by a quarter in year three, and is back near it by year five, at 22 to 24 per cent of revenue against 10 to 15 per cent before 2025 (business.md section 3). Years three to five add to about 675,000 against 610,300 of purchase commitments falling due beyond the next twelve months, so this case needs commitments beyond those already signed, which is consistent with an order book that grew by more than 50,000 in one quarter [10-Q Q2 2026, Item 2] [Q2 2026 call, p.12].

        The implied return on capital check, from the engine's dry run: about 26% in year three, 31% in year five and 31% in year ten, level with today's return on operating capital (33%), inside the software sector's roughly 48% (after-tax margin 31.2% times sales to capital 1.54), and about three and a half times the 8.78% cost of capital [Damodaran margin.xls, Software (System & Application) and Advertising, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/margin.csv]. That is the top of what the record supports and the reason the ratio is not set higher; the terminal return then steps to 18.78%.

        The owner left this cell as drafted at the last save (1.40 and 1.25); this draft lands at 1.55 and 1.4 because the bull is the case where the pre-built capacity carries the later years, and the previous choice of 1.40, described then as the record's average 'less a little' on the capital-spending-only measure, was a safety margin the method rejects; on the full measure 1.40 is the base case's early ratio, which would give the strongest story no more credit for its pre-built capacity than the expected case gets.
    reinvestment_override:
      values: [197452, 197724, null, null, null]
      reason: "The first two years are set in money rather than by ratio, because management has guided this year's capital spending and said next year's will increase significantly. This case spends more in 2027 than the base case does, because demand is stronger, and each year is still net of the depreciation and amortisation that the same year will carry."
      source: "[Q2 2026 call, p.13] [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 9] [10-K FY2025, Item 8]"
      detail: |
        Built the same way as the base case, with calendar 2027 at 265,000 instead of 245,000 and 2028 held at that level.

        | Piece | Amount |
        |---|---|
        | Second half of 2026 | 119,402 |
        | First half of 2027 | 119,250 |
        | Model year 1 gross spending | 238,652 |
        | Second half of 2027 | 145,750 |
        | First half of 2028 | 119,250 |
        | Model year 2 gross spending | 265,000 |

        The 265,000 for 2027 is our inference, about 8 per cent above the base case and a third above 2026, from the same 'increase significantly' guidance plus this case's stronger demand [Q2 2026 call, p.13]. Depreciation carried: 39,801 in year one, and 66,053 in year two, which is higher than the base case because year one spent more. Acquired-intangible amortisation is 1,399 and 1,223 from the disclosed schedule [10-Q Q2 2026, Note 9]. So 238,652 minus 39,801 minus 1,399 gives 197,452, and 265,000 minus 66,053 minus 1,223 gives 197,724. Acquisitions and working capital are left out of these two years for the reason given in the base case's reinvestment row: nothing in the sources gives a figure for either, and at their 2021 to 2025 average of about 6,000 a year they would add roughly 3% to each year's net investment [10-K FY2025, Item 8]. Gross spending in the two guided years is 42% and 38% of revenue, inside the 195,000 to 205,000 range for calendar 2026 and a strong reading of 'increase significantly' for 2027.
    tax_rate:
      start: 0.168
      terminal: 0.25
      reason: "Starts at the 16.8% rate the company actually paid on 2025 profits and rises to the 25% long-run rate by the end. Two forces push it up: the international agreement setting a 15% floor on the tax a large company pays in each country, and the shrinking United States deduction for income earned from serving customers abroad. The same path is used in every case, because tax law does not depend on which story comes true."
      source: "[10-K FY2025, Item 7]"
      detail: |
        FY2025 effective rate 16.8%, up from 16.4% in 2024 'primarily due to a decrease in the US Federal Foreign Derived Intangible Income tax deduction, a non-deductible EC fine and legal settlement in the US' [10-K FY2025, Item 7]. The OECD minimum tax of 15% is being adopted country by country and 'as more countries enact these global minimum tax rules, our effective tax rate and cash tax payments could increase' [10-K FY2025, Item 7]. Where the start sits: Damodaran's Software (System & Application) row carries an aggregate rate of 18.5% and the Total Market 20.0% [Damodaran taxrate.xls, Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/taxrate.csv]; his own Alphabet workbook of February 2024 ran 13.9% to 25% [Damodaran notes, horizon and terminal, section 3d]. The engine holds 16.8% for years one to five and moves it to 25% in equal steps over years six to ten.
    cost_of_capital_override: null
    terminal:
      growth:
        value: riskfree
        allow_above_riskfree: false
        reason: "Equal to the ten-year government bond rate the run fetches, which is the ceiling the method sets: no company can outgrow the economy it sits in forever."
      roic_premium:
        value: 0.10
        allow_large_premium: false
        reason: "Ten points above the cost of capital, so the long-run return is about twice what investors require and about two fifths below what Alphabet earns today on its operating capital. This is the case where owning the chips, the models and the products people already use turns out to be a position nobody can assemble twice, so the advantage narrows without closing; it sits between the seven points Damodaran gave Alphabet and the 11.5 he gave Nvidia."
        detail: |
          Terminal return on capital = 4.78% + 4.00% + 10.00% = 18.78%. The base year earns 23.8 cents of after-tax operating profit per dollar of capital, and about 33 cents once the stakes in other companies are taken out of the capital figure; the engine's dry run implies about 31% in year ten of this case, so 18.78% is below today's return and about 0.6 of the year-ten return, well above the half that would mark a cliff, and the terminal-year cash flow is about 11% below year ten's, the normal notch. Damodaran's largest published premium for a wide-moat business was 11.5 points for Nvidia in 2023 to 2025, and he used seven points for Alphabet itself, so ten sits inside his own practice for the strongest cases without needing the override the method asks for above twelve [Damodaran notes, horizon and terminal, section 2].
  management:
    computable: false
    reason: "Management gives no revenue, margin or profit target for any period, so this case cannot be computed; the Q2 2026 call and 10-Q were re-read for one and hold none. The one number it has given is the range for this year's capital spending, which is recorded as year-one reinvestment below; everything else is words and is marked as not numeric in the table. Quotes are verbatim except that the dollar sign in the original is written here as USD."
    story: |
      Management gives no revenue, margin or profit target. It has committed to a range for this
      year's capital spending, says next year's will be significantly higher, expects free cash flow
      to stay under pressure, and has warned that Search growth will be measured against a strong
      set of quarters from here. Everything else it said is qualitative, so this case records what
      was said and computes nothing.
    guidance:
      - item: "Capital spending 2026"
        quote: "we are updating our full year 2026 CapEx guidance range to USD 195-205 billion, up from our previous estimate of USD 180-190 billion."
        source: "[Q2 2026 call, p.13]"
        used_as: "reinvestment year 1 (the 200,000 midpoint mapped to model year 1, less the 39,801 of depreciation and 1,399 of acquired-intangible amortisation that year carries, giving 158,800)"
      - item: "Capital spending 2027"
        quote: "we continue to expect our CapEx to increase significantly in 2027, and we'll provide more details at a later date."
        source: "[Q2 2026 call, p.13]"
        used_as: "not numeric"
      - item: "Order book"
        quote: "we expect to recognize just over 50% of the total backlog as revenue over the next 24 months."
        source: "[Q2 2026 call, p.12]"
        used_as: "not numeric (informs the analyst revenue growth in years 1 and 2)"
      - item: "Chip-system revenue timing"
        quote: "We continue to expect to recognize a relatively small portion of the revenues ... this year, ramping as we exit 2026. We anticipate the vast majority of the revenues from these agreements will be realized in 2027."
        source: "[Q2 2026 call, p.13]"
        used_as: "not numeric"
      - item: "Rented capacity and Cloud margin"
        quote: "we plan to expand the use of third-party capacity in Q3 as a bridging strategy while we build out more internal capacity. ... it will create modest margin pressure in the near-term as we utilize this capacity."
        source: "[Q2 2026 call, p.13]"
        used_as: "not numeric"
      - item: "Search comparison"
        quote: "in Q3, we will begin lapping an acceleration in Search performance that began in the third quarter last year."
        source: "[Q2 2026 call, p.13]"
        used_as: "not numeric (informs the analyst year-1 growth)"
      - item: "Currency"
        quote: "we would expect a slight FX headwind to our consolidated revenue in Q3, compared to a one percentage point FX tailwind in Q2."
        source: "[Q2 2026 call, p.13]"
        used_as: "not numeric (informs the analyst year-1 growth)"
      - item: "Free cash flow"
        quote: "we expect the free cash flow will remain under pressure driven by our investments in technical infrastructure"
        source: "[Q2 2026 call, p.14]"
        used_as: "not numeric"
      - item: "Equity markets and the at-the-market programme"
        quote: "At this point, we're not planning to go back to the equity markets, with the exception of ... the ATM, or at-the-market, offering that we will do to address ... the tax on SBC, which we'll do for some period of time."
        source: "[Q2 2026 call, p.18]"
        used_as: "the dilution note in the bridge"
      - item: "Depreciation, hiring and marketing"
        quote: "will continue to put pressure on the P&L in the form of higher depreciation expense and related data center operations costs, such as energy. We also expect to continue hiring in key investment areas such as AI and cloud, and we are investing in marketing to support our AI products."
        source: "[Q2 2026 call, p.13-14]"
        used_as: "not numeric (informs the analyst margin paths)"
      - item: "Investment discipline"
        quote: "our goal is to invest as long as we see an attractive return on that investment"
        source: "[Q2 2026 call, p.15]"
        used_as: "not numeric (informs the analyst sales-to-capital choices)"
    revenue_growth:
      values: [null, null, null, null, null]
      reason: "No revenue guidance for any period."
      source: "[Q2 2026 call, p.13]"
    operating_margin:
      values: [null, null, null, null, null]
      reason: "No margin guidance; only the words about depreciation, energy, hiring, marketing and rented capacity recorded above."
      source: "[Q2 2026 call, p.13]"
    sales_to_capital:
      value: null
      value_late: null
      reason: "Not derivable from anything management has said."
    reinvestment_override:
      values: [158800, null, null, null, null]
      reason: "The one number management has given is this year's capital spending range, so year one is its midpoint less the depreciation and amortisation that year will carry, and the later years are left empty. The remark about spending increasing significantly next year is not turned into a number here; the bear, base and bull each carry a labelled inference for it instead."
      detail: |
        Calendar 2026 is mapped to model year one, which actually runs from July 2026 to June 2027; that is the nearest model year and the approximation is the point of this cell. The midpoint of the guided 195,000 to 205,000 range is 200,000; the depreciation model year one carries is 39,801 and the acquired-intangible amortisation 1,399; 200,000 minus 41,200 gives 158,800 [Q2 2026 call, p.13] [10-Q Q2 2026, Note 9] [10-K FY2025, Item 8]. The analyst cases instead build the July-to-June window from the same guidance and reach 229,652 of gross spending, about 30,000 more, because the second half of this year alone implies 119,402 and next year is guided higher.
    tax_rate:
      start: null
      terminal: 0.25
      reason: "No tax guidance."
    cost_of_capital_override: null
    terminal:
      growth:
        value: null
        allow_above_riskfree: false
        reason: "Not guided."
      roic_premium:
        value: null

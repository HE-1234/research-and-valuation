  base:
    weight: 0.50
    story: |
      AI makes Search bigger rather than smaller: the assistant answers more questions than a list
      of links did, the ads beside those answers still sell, and Search keeps growing in double
      digits for most of the forecast, with YouTube and subscriptions growing alongside it. Google
      Cloud is the engine: it works through an order book worth more than a year of the whole
      company's revenue, sells Alphabet's own AI chips as finished systems, and within five years
      becomes a business about one and a half times the size of today's Search. The price is a
      wave of depreciation from the data centres bought in 2026 and 2027, and the AI era's energy,
      hardware and hiring bills eat most of the operating leverage the old business enjoyed, so
      the margin holds near today's level instead of rising. The capacity bought in those two
      years carries the growth of the years after, so each later dollar of investment buys more
      revenue than the build-out years do, though less than before once the company has to pay
      for its own growth again. In the long run the habit, the distribution deals and the data
      still earn Alphabet well more than its cost of capital, but clearly less than it earns
      today, while it grows with the economy and pays the full tax rate.

    revenue_growth:
      values: [0.23, 0.20, 0.17, 0.15, 0.13]
      reason: "Year one is the 23% the company grew in the first half of 2026: the currency swing and tougher Search comparison management flagged take about three points off Search, and Cloud's acceleration, chip-system deliveries with no year-earlier base and the extra rented capacity give most of it back (outlook.md sections 2 to 4). Growth then eases as the order book is worked through and Search settles toward the pace expected for the advertising industry, with Cloud the fastest-growing part in every year and roughly one and a half times today's Search business by year five. By year ten revenue is about three and a third times today's, which is the honest weak point of this case and the input most worth the owner's attention."
      source: "[10-Q Q2 2026, Note 2] [10-Q Q2 2026, Item 2] [Q2 2026 call, p.3] [Q2 2026 call, p.4] [Q2 2026 call, p.12] [Q2 2026 call, p.13] [Q2 2026 release, p.1] [10-K FY2025, Item 7] [Damodaran histgr.xls, Advertising and Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/histgr.csv]"
      detail: |
        End state first. In year 10 (the twelve months to June 2036) this case has Alphabet at about 1,473,000 of revenue, 3.3 times the base year of 445,866; in year 5 it passes one trillion USD, with Cloud at about 393,000 (39% of the company and 1.6 times today's Search business of 243,310) and Search at about 417,000. The economy, at the 4.78% nominal growth the risk-free rate proxies, is about 1.6 times today's in year ten, so Alphabet's share of it roughly doubles [Damodaran notes, story-to-numbers playbook, section 6]. Against the largest firms: Damodaran counted only five companies above 400 billion USD of revenue in January 2023 and called a trillion 'revenues that no company in history has ever generated'; Alphabet is already above the first mark and this case takes it past the second in year five [Damodaran notes, story-to-numbers playbook, section 2]. No cached source gives a market size or a competitor's revenue (see the market-size diagnostic). Why the case still claims it: the company grew 24% in the latest quarter, holds a Cloud order book of 513,900, more than a year of company revenue, has 811,000 of purchase commitments, and is spending about 45% of revenue on capital equipment, all of which are the actions of a management building for a business several times today's size [10-Q Q2 2026, Note 2] [10-Q Q2 2026, Item 2] [Q2 2026 call, p.13]. The path below is backed out from that end state.

        Segment build. Trailing revenue is the twelve months to June 30, 2026; latest growth is the June 2026 quarter against the same quarter of 2025 [10-K FY2025, Item 7] [10-Q Q2 2026, Note 2] [Q2 2026 release, p.1].

        | Line | Trailing revenue | Latest growth | Year 1 | Year 2 | Year 3 | Year 4 | Year 5 | Year 5 revenue | Share of revenue in year 5 |
        |---|---|---|---|---|---|---|---|---|---|
        | Google Search and other | 243,310 | 17% | 14% | 13% | 11% | 10% | 9% | 417,143 | 42% |
        | YouTube ads | 42,582 | 13% | 12% | 11% | 10% | 9% | 9% | 69,185 | 7% |
        | Google Network | 29,456 | -1% | -3% | -3% | -3% | -3% | -3% | 25,295 | 3% |
        | Google subscriptions, platforms and devices | 51,743 | 15% | 15% | 14% | 13% | 12% | 11% | 95,296 | 10% |
        | Google Cloud | 77,617 | 82% | 72% | 45% | 33% | 26% | 21% | 392,519 | 39% |
        | Other Bets | 1,507 | 2% | 15% | 20% | 20% | 20% | 20% | 3,594 | 0% |
        | Currency-protection gains and losses | -349 | n/a | held flat | held flat | held flat | held flat | held flat | -349 | 0% |
        | Whole company | 445,866 | 24% | 22.9% | 19.9% | 17.1% | 15.1% | 13.3% | 1,002,683 | 100% |

        The build gives 22.9, 19.9, 17.1, 15.1 and 13.3 per cent; the path is written as 23, 20, 17, 15 and 13, each the nearest whole point. Revenue on the written path: 548,415 in year one, then 658,098, 769,975, 885,471 and 1,000,582; the years 6 to 10 fade (growth easing from 13% to 4.78% in equal steps) gives 1,114,209, 1,222,420, 1,321,045, 1,405,909 and 1,473,112.

        Year one against the run-rate. Reported growth was 23.1% in the first half of 2026 and 24.2% in the June quarter, and year one is set at the reported half-year rate [10-Q Q2 2026, Item 1] [Q2 2026 release, p.1]. Every move inside the build is a named item. Down: a one point currency tailwind in the June quarter becomes 'a slight FX headwind' in the third quarter, felt 'primarily in Search and YouTube Ads', and from the third quarter the company begins 'lapping an acceleration in Search performance that began in the third quarter last year' [Q2 2026 call, p.13]; Search grew 13.4% for calendar 2025 as a whole, so the second half of 2025 grew faster than the first and the comparison from the third quarter of 2026 is several points tougher [10-K FY2025, Item 7]. Those take Search from 17% to 14%, and YouTube from 13% to 12% as the World Cup advertising management named does not repeat [Q2 2026 call, p.11]. Up: Cloud's June quarter was 24,768, already 99,000 a year, and the year-one figure of 133,501 needs the quarterly run-rate to rise about half again over four quarters, against a rise of 24% in the single quarter from March to June 2026; chip-system deliveries began in the June quarter with 'the vast majority' of that revenue due in 2027 and no year-earlier base; third-party capacity is being rented from the third quarter 'to keep growing our customer base'; and management says it is still supply constrained, so revenue foregone now arrives when capacity does [10-Q Q1 2026, Item 2] [10-Q Q2 2026, Item 2] [Q2 2026 call, p.13] [Q2 2026 call, p.15]. Cloud is therefore taken from 82% to 72%, not lower.

        What each line leans on. Search and other: paid clicks rose 13% and the price per click 3% in the quarter, AI Mode has passed one billion monthly users and is 'driving an incremental increase in Search queries overall', and AI Max 'continues to unlock billions of net new searches that weren't really monetizable before' [10-Q Q2 2026, Item 2] [Q2 2026 call, p.3] [Q2 2026 call, p.24]; the line eases to 9% by year five, which is the 9.2% expected five-year revenue growth of Damodaran's Advertising row, so the case assumes the AI lift fades to the industry's pace rather than above or below it [Damodaran histgr.xls, Advertising and Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/histgr.csv]. YouTube: 13% growth driven by direct response and brand with the World Cup named as a boost [Q2 2026 call, p.11] [Q2 2026 call, p.12]. Network: down in every year since 2022 and down again this quarter, with the advertising-technology remedy still to be decided (business.md section 6, risk 3). Subscriptions, platforms and devices: 15% growth led by YouTube Music and Premium and by Google One AI plans, with YouTube's subscription business 'growing faster than Ads' [Q2 2026 call, p.9] [Q2 2026 call, p.12]. Cloud: an order book of 513,900 of which just over half is expected as revenue within 24 months, customers 'exceeding their commitments by more than 50%', the order book up 'by more than 50 billion sequentially', nearly 90% of the Fortune 100 using Gemini Enterprise, and the chip-system sales whose 'vast majority' lands in 2027 [10-Q Q2 2026, Note 2] [Q2 2026 call, p.4] [Q2 2026 call, p.5] [Q2 2026 call, p.12] [Q2 2026 call, p.13]. Cloud's years four and five at 26% and 21% hand off toward the growth of the largest software and cloud firms, between the 12.3% expected five-year growth of Damodaran's Software (System & Application) row and the 19.5% of his Computer Services row, and below the 26% to 36% Google Cloud itself grew in 2023 to 2025 before the AI wave [10-K FY2025, Note 15] [Damodaran histgr.xls, Advertising and Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/histgr.csv]. Other Bets: 1,507 of revenue is too small to matter either way.

        Order book check on years one and two: Cloud revenue of 133,501 then 193,577, or 327,078 together, against about 257,000 of order book due within 24 months. The 70,000 difference is revenue not in that order book, which is consistent with customers exceeding their commitments by more than half, with contracts that can be cancelled being excluded from the figure, and with new signings running above 50,000 a quarter [10-Q Q2 2026, Note 2] [Q2 2026 call, p.4] [Q2 2026 call, p.12].

        Steps down of more than three points, and what drives each: Cloud 72% to 45%, because the 24-month conversion of the order book and the one-off arrival of chip-system revenue both sit inside years one and two, so from year three growth has to come from contracts not yet signed; Cloud 45% to 33%, because the first wave of customer AI build-outs is complete and the comparison base has more than doubled; Cloud 33% to 26%, because by then capacity has caught up with demand and the supply shortage that holds revenue back today no longer flatters growth; Cloud 26% to 21%, the hand-off toward the growth of the largest software firms described above; and the whole-company step from 22.9% to 19.9%, which is the first of those Cloud steps working through a business where Cloud is a quarter of revenue.

        Growth against margin: the ad business sets prices by auction and Cloud's margin has risen from 20.7% to 35.6% in a year while it grew 82%, so this growth is not bought with price cuts and the flat margin path beside it is consistent [Q2 2026 call, p.12].

        Context, not an anchor: the company's own five-year growth was 11.8% a year, but with advertising at 81% of revenue in 2021 against 71% in the base year and 51% in year five, so that record is not the yardstick for this mix [10-K FY2023, Item 8] [10-K FY2025, Item 7]. Damodaran's own Alphabet valuation of February 2024 used 8% growth for five years, before Cloud grew from 33,088 in 2023 to a 99,000 run-rate and the order book from 74,100 at the end of 2023 to 513,900 [Damodaran notes, horizon and terminal, section 3d] [10-K FY2023, Note 2] [10-Q Q2 2026, Note 2].

        Where this sits against management's words: in sync with 'AI continues to drive an expansionary moment' for Search and 'very early innings' for enterprise AI, and it takes management's own cautions (currency, the Search comparison, modest Cloud margin pressure) at face value [Q2 2026 call, p.3] [Q2 2026 call, p.13] [Q2 2026 call, p.14]. Management gives no revenue number to test against.

        The owner's saved values were 0.16 and 0.14 for years four and five; this draft lands at 0.15 and 0.13 because the segment build gives 15.1% and 13.3%, with Search at 10% and 9% (the advertising industry's expected pace plus the tail of the AI lift) and Cloud at 26% and 21% (handing off toward the growth of the largest software firms). One point higher in each year would need Cloud at about 29% and 24%, or Search at 11% and 10%; both are defensible and the bull case carries them, but they sit above the expected value the evidence supports.
    operating_margin:
      values: [0.33, 0.33, 0.32, 0.33, 0.33]
      reason: "The margin holds within a point of today's 33% rather than rising: the depreciation of the data centres bought in 2026 and 2027 costs about seven and a half points of revenue by year five, and the two offsets, traffic payments shrinking as advertising becomes half the company and every other cost growing about two points a year slower than revenue, give almost exactly that back (outlook.md section 4; business.md section 3). The dip to 32% in year three is the steepest part of the depreciation wave, and the target of 33% is back by year four. It sits on Damodaran's software industry average, at the level the company earned in 2024 and 2025, two points below the first half of 2026 and three above Damodaran's own 2024 target for Alphabet."
      source: "[10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2] [Q2 2026 call, p.11] [Q2 2026 call, p.12] [Q2 2026 call, p.13] [Q2 2026 slides, p.9] [10-K FY2025, Item 7] [10-K FY2025, Item 8] [10-K FY2025, Note 1] [10-K FY2025, Note 15] [10-K FY2023, Item 8] [Damodaran margin.xls, Software (System & Application) and Advertising, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/margin.csv] [Damodaran notes, horizon and terminal, section 3d]"
      detail: |
        Where 33% sits. The distribution, with the company placed inside it:

        | Anchor | Operating margin | Where it comes from |
        |---|---|---|
        | Software (System & Application), 309 US firms: the true competitor set for a business selling cloud, AI models and software-like advertising | 33.0% | [Damodaran margin.xls, Software (System & Application) and Advertising, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/margin.csv] |
        | Semiconductor, 66 firms (the chip business Alphabet now also runs) | 35.3% | same file |
        | Software (Entertainment), 77 firms | 33.8% | same file |
        | Advertising, 52 firms: agencies and networks that sell other people's media; the engine's diagnostics row, a weak comparator | 10.1% | same file |
        | Total Market, 5,994 firms | 12.8% | same file |
        | Alphabet, twelve months to June 2026 | 33.1% | [10-Q Q2 2026, Item 1] [10-K FY2025, Item 8] |
        | Alphabet, first half of 2026 (best half) and March quarter (best quarter) | 35.0% and 36.1% | [10-Q Q2 2026, Item 1] [10-Q Q1 2026, Item 1] |
        | Alphabet FY2024 and FY2025 | 32% and 32% | business.md section 3 |
        | Alphabet FY2022 and FY2023 (worst years) | 26% and 27% | business.md section 3 [10-K FY2023, Item 8] |
        | Google Services segment, twelve months; Google Cloud segment, twelve months and June quarter | 41.9%; 31.3% and 35.6% | [10-K FY2025, Note 15] [10-Q Q2 2026, Note 15] [Q2 2026 slides, p.9] |
        | Damodaran's own February 2024 targets: Alphabet 30% (start 32.2% with research capitalised), Microsoft 45%, Meta 40%, Apple 36%, Amazon 14%, Nvidia 40% | as listed | [Damodaran notes, horizon and terminal, section 3d] |

        So the base target of 33% is the software industry average, the company's own 2024 to 2025 level, two points below its best half-year, above the 30% Damodaran used when Cloud was a fifth of today's size, and well below the 40% to 45% he gave Microsoft and Meta. The business-model argument for that position: the ad business prices by auction and serves extra queries on machines already bought, which is why margins held 31% to 32% while revenue grew 56% over 2021 to 2025 (business.md section 3); against that, an AI answer costs more compute than a list of links, the chip hardware sells at hardware margins, and management says depreciation, energy, hiring and marketing will 'continue to put pressure on the P&L' [Q2 2026 call, p.13] [10-K FY2025, Item 7].

        Growth spending inside operating expense, named before the path is set. Research and development was 68,974 in the base year, 15.5% of revenue; inside it the shared frontier-model research reported as Alphabet-level activities lost about 21,500 (FY2025 16,760 plus 11,180 in the first half of 2026 less 6,399 in the first half of 2025), 4.8% of revenue, and Other Bets lost about 8,900, 2.0% [10-K FY2025, Note 15] [10-Q Q2 2026, Note 15]. Sales and marketing was 7.0% and includes the marketing 'to support our AI products' [Q2 2026 call, p.13]. Damodaran capitalises research; his February 2024 Alphabet workbook lifted the starting margin from 28.7% reported to 32.2% by doing so [Damodaran notes, horizon and terminal, section 3d]. The switches here stay off by rule, so about seven points of revenue that buys future revenue is charged against today's margin, and the path below does not assume any of it is cut.

        Starting point: the twelve-month margin is 33.1%, the first half of 2026 ran at 35.0% and the June quarter at 34.0% after a legal charge worth about 1.3 points [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2]. The twelve-month figure carries about 1.1 points of legal charges in all, and the path leaves them in, because charges like them arrive most years.

        The bridge, in points of revenue, drag and offsets side by side.

        | Share of revenue | Trailing | Year 1 | Year 2 | Year 3 | Year 4 | Year 5 |
        |---|---|---|---|---|---|---|
        | Payments for traffic (distribution deals and partner sites) | 14.1 | 12.8 | 11.9 | 11.2 | 10.6 | 10.2 |
        | Depreciation of property and equipment | 5.7 | 7.3 | 9.9 | 12.0 | 12.6 | 13.2 |
        | Everything else | 47.1 | 46.4 | 45.6 | 44.8 | 44.1 | 43.5 |
        | Operating margin | 33.1 | 33.5 | 32.6 | 32.0 | 32.7 | 33.1 |

        The drag. Depreciation of property and equipment was 25,237 in the base year, 5.7% of revenue. On this case's spending plan (see the sales-to-capital detail) it reaches 39,801 in year one and 132,487 in year five, 13.2% of revenue: a drag of seven and a half points. The schedule adds about 11 cents of yearly depreciation for each dollar spent the year before, which is what the company's own numbers show (depreciation rose 5,825 in 2025 on 52,535 of 2024 spending, 11.1%) and what its asset lives imply (about 60 per cent of technical-infrastructure spending in servers written off over six years, the rest in data centres and networking equipment written off over much longer periods) [10-K FY2025, Item 8] [10-K FY2025, Note 1] [Q2 2026 call, p.11]. The schedule adds without retiring, which overstates depreciation slightly inside five years (servers bought before the surge were small) and more after year six, when the 2026 servers reach the end of their six-year lives.

        The offsets. First, the payments for traffic, which cover both the money paid for search defaults and the money passed to partner sites, were 62,880 in the base year, 14.1% of revenue and 19.9% of advertising revenue; the rate is held there, but advertising falls from 70.7% to 51% of the company as Cloud grows, so the payments fall to 10.2% of revenue, worth 3.9 points [10-Q Q2 2026, Item 2]. Holding the blended rate flat is slightly conservative, because the filings say it has been falling as Network, which pays most of its revenue out, shrinks relative to Search [10-K FY2025, Item 7] [10-Q Q2 2026, Item 2]. Second, every other cost, meaning everything except those payments and depreciation, was 47.1% of revenue and is assumed to grow two points a year slower than revenue in years one to three, easing to one and three quarters and then one and a half, worth 3.6 points by year five. Where two points sits in the company's own record of that gap, computed from the income statements: 6.8 points in 2024 and 4.2 in 2025 once the severance, office and legal charges of each year are removed (9.4 and 0.0 with them in), 3.0 in the first half of 2026, and 1.6 in the June quarter (1.1 with the legal charges of both years removed) [10-K FY2023, Item 7] [10-K FY2023, Item 8] [10-K FY2025, Item 7] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2]. The gap has narrowed as the AI costs arrived, and two points sits between the latest quarter and the two-year record, which is the expected value rather than either end.

        Why the offsets are believable rather than hopeful: Cloud earned a 35.6% margin in the June quarter against 20.7% a year earlier, Google Services earned 41.8% against 40.7% for 2025 as a whole, and both did that while depreciation was already surging [Q2 2026 call, p.12] [10-K FY2025, Note 15]. Against that, management expects 'higher depreciation expense and related data center operations costs, such as energy', continued hiring in AI and cloud, marketing for AI products and 'modest margin pressure' from renting other companies' computers in the third quarter, and a Wiz integration headwind in 2026; the chip-system hardware also sells at hardware margins and its inventory costs are already a named driver of cost of revenues [Q2 2026 call, p.13] [Q2 2026 call, p.22] [10-Q Q2 2026, Item 2].

        The bridge gives 33.5, 32.6, 32.0, 32.7 and 33.1 per cent on the revenue the written growth path produces. The path is written as 33, 33, 32, 33 and 33: year one rounded down from 33.5 because of the third-quarter warnings above, the others to the nearest whole point. The target is reached in year four; the margin is held at 33% in years six to ten by rule, which assumes the two offsets keep pace with depreciation that, on this spending plan, would pass 18% of revenue by year ten before retirements. Acquired-intangible amortisation peaks at 1,304 in 2027, about 0.2% of revenue, and does not move the path [10-Q Q2 2026, Note 9].

        The owner left this cell as drafted at the last save (33, 33, 32, 32, 32); this draft writes 33 for years four and five because the higher sales-to-capital ratio in years three to five means a little less depreciation and the bridge comes back to 32.7% and 33.1%.
    sales_to_capital:
      value: 1.4
      value_late: 1.2
      reason: "Years one and two are set in money below, so this ratio drives years three to five: at 1.4 each dollar of net new investment brings in 1.40 dollars of new revenue, midway between what Alphabet's 2025 spending earned (1.21) and the software industry's 1.54, and above the middle of Alphabet's own record, which is 1.21 once acquisitions and working capital are counted and the one-year lag is allowed for. That is deliberate: the capacity paid for in 2026 and 2027 is what serves the revenue of those later years, so they need not pay for their growth twice, and even so the five years together reinvest more per dollar of new revenue than Alphabet did in any year but 2022. From year six it eases to 1.2, where the middle of Alphabet's own record, last year's figure and Damodaran's own number for Alphabet in 2024 all sit within a hundredth of each other, because by then the company has to pay for its own growth again; the year-ten return on capital the engine implies is about 25%, level with today's reported return."
      source: "[10-K FY2023, Item 8] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2] [Damodaran capex.xls, Total Market and Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/capex.csv] [Damodaran notes, story-to-numbers playbook, section 4] [Damodaran notes, horizon and terminal, section 3c] [Damodaran notes, horizon and terminal, section 3d]"
      detail: |
        The three candidates, measured the way the model spends (money spent in one year buys the revenue added the next; reinvestment is capital spending less depreciation of property and equipment, plus acquisitions, plus the working capital the year tied up, because from year three the ratio produces every kind of reinvestment at once):

        | Candidate | Figure | Where it comes from |
        |---|---|---|
        | The company's own lagged record, money spent 2021 to 2025 | 1.36, 0.90, 1.73, 1.09, about 1.21 (median 1.21, average 1.26); on capital spending alone 1.75, 1.36, 2.10, 1.42, about 1.22 (median 1.42, average 1.57) | cash-flow statements [10-K FY2023, Item 8] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] |
        | Last year's marginal ratio (2025 spending against the revenue added in the first half of 2026, annualised) | about 1.21 (about 1.22 on capital spending alone) | same |
        | Same-year ratios during the surge, not the comparison | 0.74 in 2025, 0.38 in the first half of 2026 (0.75 and 0.64 on capital spending alone) | same; depressed by construction because the revenue the spending buys has not arrived, and the first half of 2026 carries 33,697 of acquisitions (mainly Wiz and Intersect) and 7,739 of chip-system inventory |
        | Industry average, Software (System & Application), the true competitor set for Cloud and the AI business | 1.54 | [Damodaran capex.xls, Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/capex.csv] |
        | Industry average, Advertising (agencies and networks; the engine's diagnostics row) | 3.85 | same file, Advertising row |
        | All US companies (Total Market) | 0.82 | same file, Total Market row |
        | Damodaran's own input for Alphabet, February 2024; his other choices that month | 1.20; Meta 1.50, Amazon 2.00, Microsoft 3.00, Apple 5.00, Nvidia 1.15 | [Damodaran notes, horizon and terminal, section 3d] |

        The lagged record in full, with every part of reinvestment shown:

        | Money spent in | Capital spending less depreciation | Acquisitions | Working capital tied up | All reinvestment | Revenue added the next year | Ratio on all reinvestment | Ratio on capital spending alone |
        |---|---|---|---|---|---|---|---|
        | 2021 | 14,367 | 2,618 | 1,523 | 18,508 | 25,199 | 1.36 | 1.75 |
        | 2022 | 18,010 | 6,969 | 2,235 | 27,214 | 24,558 | 0.90 | 1.36 |
        | 2023 | 20,305 | 495 | 3,845 | 24,645 | 42,624 | 1.73 | 2.10 |
        | 2024 | 37,224 | 2,931 | 8,406 | 48,561 | 52,818 | 1.09 | 1.42 |
        | 2025 | 70,311 | 1,592 | -618 | 71,285 | about 86,060 | about 1.21 | about 1.22 |

        Working capital tied up is the sum of the cash-flow statement's 'changes in assets and liabilities' lines with the sign reversed, so cash paid out counts as money invested; 2025 released 618 because a 12,939 rise in accrued expenses and other liabilities outweighed the cash tied up in receivables, other assets and taxes. On all reinvestment the record's median is 1.21 and its average 1.26; on capital spending alone, the measure the previous draft used, 1.42 and 1.57 [10-K FY2023, Item 8] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]. The 2025 line annualises the 43,030 of revenue added in the first half of 2026. The first half of 2026 also spent 33,697 on acquisitions (mainly Wiz and Intersect) and tied up 7,739 in chip-system inventory for sale; the revenue that money buys has not arrived, so no lagged ratio exists for it yet, and both sit inside the base year's invested capital already [10-Q Q2 2026, Item 1]. The same-year ratios of 0.74 and 0.38 (0.75 and 0.64 on capital spending alone) are depressed by construction, because 2025 and 2026 spending is buying revenue that has not arrived yet, and they are not the comparison; Damodaran read Nvidia's 0.65 the same way and let the forward ratio move toward the industry median [Damodaran notes, story-to-numbers playbook, section 4].

        Where this case lands and why. 1.4 sits midway between last year's marginal 1.21 and the software industry's 1.54, the placement Damodaran used in his own worked table ('approximately midway through their marginal sales to capital ratio from last year and the industry average') [Damodaran notes, story-to-numbers playbook, section 4]. Against Alphabet's own record it is above four of the five years and above the middle of 1.21, and that is deliberate rather than a claim that the company has become more efficient: the two years set in money below imply ratios of 0.58 and 0.63, so the model already charges the build-out at less than half the record's efficiency, and the capacity those years buy is what serves the revenue of years three to six. Taken together, years one to five charge 613,000 of net investment for the 566,000 of revenue added in years two to six, a ratio of 0.92, below every year of the record except 2022; asking years three to five to pay at the record's middle as well, as the previous draft did at 1.25, would charge for the same machines twice. The story reason is his own instruction for a company that has spent ahead: 'If your company has already invested for the growth for the next few years, this number can be set to a high value for the first five years', and his 2026 principle that 'companies that have built capacity in advance of growth will be worth more than companies that will have to reinvest contemporaneously' [Damodaran notes, horizon and terminal, section 3c]. The late ratio of 1.2 is where three candidates meet within a hundredth: the middle of Alphabet's own record (1.21), last year's marginal ratio (1.21) and the 1.20 Damodaran used for Alphabet in 2024 [Damodaran notes, horizon and terminal, section 3d]; once the pre-built capacity is absorbed the company pays for its growth at the efficiency its own history shows and no better, because the AI business needs more capital per dollar of revenue than search did and the record already contains the first year of it.

        What 1.4 and 1.2 imply for spending, with depreciation from the same schedule as the margin bridge:

        | Model year | Net investment | Depreciation it carries | Gross capital spending | Share of revenue |
        |---|---|---|---|---|
        | 1 | 188,452 | 39,801 | 229,652 | 42% |
        | 2 | 178,714 | 65,063 | 245,000 | 37% |
        | 3 | 82,497 | 92,013 | 174,510 | 23% |
        | 4 | 82,222 | 111,209 | 193,431 | 22% |
        | 5 | 81,162 | 132,487 | 213,648 | 21% |

        Years six to ten continue at 246,000, 265,000, 283,000, 299,000 and 335,000, or 21% to 23% of revenue. So gross spending eases from the 2027 peak by about 29% in year three and climbs back to the peak by year seven, while falling from 42% to about 22% of revenue. Checks. Years three to five add to about 582,000, against the 610,300 of purchase commitments that fall due beyond the next twelve months (811,000 in total, 200,700 short-term), which run to 2054 and include energy and content as well as equipment, so this is an order-of-magnitude check only [10-Q Q2 2026, Item 2] [10-Q Q2 2026, Note 10]. 22% of revenue is still above every year before 2025, when the company spent 10 to 15 per cent (business.md section 3). Nothing in the sources speaks to spending beyond 2027, so the year-three step down is the shape most worth the owner's eye: a lower ratio would mean spending keeps climbing instead, a higher one that it falls further.

        The implied return on capital check, from the engine's dry run: about 23% in year three, 26% in year five and 25.5% in year ten, against today's 23.8% reported (33% on operating capital alone), a terminal cost of capital of 8.78%, and a software sector earning roughly 48% on capital (after-tax margin 31.2% times sales to capital 1.54) and an advertising sector roughly 37% (9.6% times 3.85) [Damodaran margin.xls, Software (System & Application) and Advertising, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/margin.csv] [Damodaran capex.xls, Total Market and Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/capex.csv]. A year-ten return level with today's, inside the sector's band and about three times the cost of capital, says the company is paying for its growth at roughly today's efficiency, neither getting it free nor being overcharged; the terminal return then steps down to 15.78%.

        The owner left this cell as drafted at the last save (1.25 and 1.10); this draft lands at 1.4 and 1.2 for the reasons above, and because 1.25 was chosen 'at the bottom of the record' for safety on the capital-spending-only measure, which the method rejects; on the full measure 1.25 sits at the record's middle, which would charge years three to five for their growth at the ordinary rate even though the machines that serve them were paid for in years one and two.
    reinvestment_override:
      values: [188452, 178714, null, null, null]
      reason: "The first two years are set in money rather than by ratio, because management has guided this year's capital spending to 195 to 205 billion USD and said next year's will increase significantly. Each year is that spending less the depreciation and the acquired-intangible amortisation that the same year will actually carry, so the model is not charged twice for the same machines."
      source: "[Q2 2026 call, p.13] [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 9] [10-K FY2025, Item 8]"
      detail: |
        Model year one is the twelve months to June 2027 and model year two the twelve months to June 2028, so each one straddles two calendar years. Spending is built that way rather than by pretending calendar 2026 is model year one.

        Gross capital spending.

        | Piece | Amount | Where it comes from |
        |---|---|---|
        | Second half of 2026 | 119,402 | the 200,000 midpoint of the guided 195,000 to 205,000 range, less the 80,598 already spent in the first half |
        | First half of 2027 | 110,250 | 245,000 assumed for calendar 2027, split 45 to 55 across the halves as spending rises through the year |
        | Model year 1 | 229,652 | the two above |
        | Second half of 2027 | 134,750 | the other side of the same 45 to 55 split |
        | First half of 2028 | 110,250 | 2028 assumed to hold at the 2027 level |
        | Model year 2 | 245,000 | the two above |

        The 245,000 for 2027 is our inference from 'we continue to expect our CapEx to increase significantly in 2027': holding the implied second-half-2026 rate of 119,402 per half-year would already give about 239,000, so 245,000 is a modest step above simply not slowing down, 22% above 2026; the bull case carries 265,000 for a stronger reading of the same words [Q2 2026 call, p.13]. The range of readings is about 240,000 to 270,000, and 10,000 either way moves year-two reinvestment by the same amount and nothing else.

        Depreciation each year will carry, not last year's. Depreciation of property and equipment was 25,237 in the base year. Adding about 11 cents for every dollar spent the year before gives 39,801 in model year one and 65,063 in model year two; the 11 cents is calibrated on the company's own record (depreciation rose 5,825 in 2025 on 52,535 of 2024 spending, 11.1 per cent) and is consistent with its asset lives [10-K FY2025, Item 8] [10-K FY2025, Note 1]. Acquired-intangible amortisation is taken from the disclosed schedule: 747 for the rest of 2026, 1,304 in 2027 and 1,142 in 2028, so 1,399 in model year one and 1,223 in model year two [10-Q Q2 2026, Note 9].

        The arithmetic: 229,652 minus 39,801 minus 1,399 gives 188,452 for year one; 245,000 minus 65,063 minus 1,223 gives 178,714 for year two. Acquisitions and working capital are left out of these two years because nothing in the sources gives a figure for either: management guides capital spending only, and over 2021 to 2025 the two together averaged about 6,000 a year, which would add roughly 3% to each year's net investment; the 33,697 spent on acquisitions, mainly Wiz and Intersect, and the 7,739 tied up in chip-system inventory in the first half of 2026 are already inside the base year's invested capital [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]. From year three the ratio produces every kind of reinvestment at once, which is why its record in the sales-to-capital row is measured with acquisitions and working capital included. The alternative of treating calendar 2026 as model year one would give 200,000 of spending and about 158,800 of net investment, roughly 30,000 less, and would understate a year in which the company is plainly spending more than 200,000; it is recorded in the management case instead. Years three to five fall back to the ratio above, and the gross spending every explicit year implies is tabled in the sales-to-capital detail and checked there against the guidance.
    tax_rate:
      start: 0.168
      terminal: 0.25
      reason: "Starts at the 16.8% rate the company actually paid on 2025 profits and rises to the 25% long-run rate by the end. Two forces push it up: the international agreement setting a 15% floor on the tax a large company pays in each country, and the shrinking United States deduction for income earned from serving customers abroad. The same path is used in every case, because tax law does not depend on which story comes true."
      source: "[10-K FY2025, Item 7]"
      detail: |
        FY2025 effective rate 16.8%, up from 16.4% in 2024 'primarily due to a decrease in the US Federal Foreign Derived Intangible Income tax deduction, a non-deductible EC fine and legal settlement in the US' [10-K FY2025, Item 7]. The OECD minimum tax of 15% is being adopted country by country and 'as more countries enact these global minimum tax rules, our effective tax rate and cash tax payments could increase' [10-K FY2025, Item 7]. Where the start sits: Damodaran's Software (System & Application) row carries an aggregate rate of 18.5% and the Total Market 20.0% [Damodaran taxrate.xls, Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/taxrate.csv]; his own Alphabet workbook of February 2024 ran 13.9% to 25% [Damodaran notes, horizon and terminal, section 3d]. The engine holds 16.8% for years one to five and moves it to 25% in equal steps over years six to ten.
    cost_of_capital_override: null
    terminal:
      growth:
        value: riskfree
        allow_above_riskfree: false
        reason: "Equal to the ten-year government bond rate the run fetches, which is the ceiling the method sets: no company can outgrow the economy it sits in forever."
      roic_premium:
        value: 0.07
        allow_large_premium: false
        reason: "Seven points above the cost of capital, which puts the long-run return on capital a little over half way down from what Alphabet earns today toward the bare minimum its investors require, and is exactly the premium Damodaran gave Alphabet in his last published valuation. The advantages in business.md section 5 are real but none of them is a lock: users are one click away, the distribution has to be bought every year, and the court-ordered data sharing chips at the one asset regulators call hard to copy."
        detail: |
          Terminal return on capital = 4.78% + 4.00% + 7.00% = 15.78%. The base year earns 23.8 cents of after-tax operating profit for every dollar of capital in the business, and that understates it, because the capital figure still contains about 145,600 of stakes in other companies that earn no operating profit; on operating capital alone the return is about 33 per cent. The engine's dry run implies about 25.5% in year ten, so 15.78% is below today's return, below the year-ten return, and about 0.6 of it, comfortably above the half that would mark a cliff; the terminal-year cash flow is about 13% below year ten's, inside the 15% the method allows and close to the 10.7% notch in Damodaran's own Alphabet sheet. His published choices: seven points for Alphabet in February 2024 (15% against 8%), four points in 2018, 6.4 to 7 for Microsoft, Meta, Amazon and Apple, 11.5 for Nvidia, zero for Intel, Walgreens and Netflix; his rule of thumb is to move the stable return 'to or towards industry averages', and the software sector earns roughly 48% on capital today, so 15.78% is a long way toward the cost of capital [Damodaran notes, horizon and terminal, section 2].
  bull:
    weight: 0.25
    story: |
      Alphabet turns out to own the whole chain, its own chips, its own models and the products
      billions of people already open every day, and AI answers create more questions and richer
      ads, so Search keeps growing in the mid-teens with YouTube and subscriptions close behind.
      Cloud keeps compounding on an order book that grows faster than it is worked off, and
      selling AI machines becomes a real hardware business in its own right. Spending rises further
      in 2027 to meet the demand, and because the capacity is bought before the revenue arrives,
      the later years grow without spending at the same rate again. Revenue more than doubles in
      five years and the margin edges above today's, because the cost of buying search distribution
      shrinks as advertising becomes the smaller half of the company and every other cost grows
      well behind sales. The moat holds well enough to keep earning about twice its cost of capital
      long after the forecast ends, while the company grows with the economy and pays the full tax rate.

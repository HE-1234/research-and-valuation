  base:
    weight: 0.50
    story: |
      AI makes Search bigger rather than smaller, but growth slows from today's pace as it is measured against last year's strong growth and pays more for computing per answer. Cloud keeps converting its half-trillion-dollar backlog and the TPU hardware sales arrive in 2027, so revenue grows about 20% in the first year before easing toward single digits. Capital spending rises again in 2027 as management has promised and then eases back as depreciation catches up. Depreciation from the build-out eats a few points of margin, only partly offset by Cloud becoming as profitable as the older businesses. The habit, distribution and data advantages described in business.md §5 let Alphabet keep earning a modest premium over its cost of capital in the long run.
    revenue_growth:
      values: [0.20, 0.16, 0.13, 0.10, 0.08]
      reason: "Year 1 grows 20%: Cloud converts a backlog worth more than a year of company-wide revenue, the chip-system sales arrive in 2027, and Search keeps growing but slower than its recent burst (outlook.md §2–§4). Growth then fades year by year toward the single digits of 2022–2023 as the backlog is worked off and Search matures. The scorecard shows management delivering on its capex and Cloud claims, so the backlog is taken at face value."
      detail: |
        History (business.md §2 table; outlook.md §1): 9.8% (2022), 8.7% (2023), 13.9% (2024), 15.1% (2025) and 23.1% in the first half of 2026, the last with a one-point currency tailwind [10-K FY2023, Item 8] [10-K FY2025, Item 7]. Year 1 (July 2026–June 2027) at 20%: the Cloud backlog of 513,900 with just over half due within 24 months means Cloud alone should add over 50,000 a year against trailing-twelve-month Cloud revenue of 77,617; TPU system sales land mostly in 2027; Search & other slows from 17% as it laps a strong 2025 and faces a slight currency headwind [10-Q Q2 2026, Note 2] [Q2 2026 call, p.12–13]. Management met or beat its capex and Cloud claims last quarter (scorecard.md, Q2 2026).
      source: "[10-Q Q2 2026, Note 2] [Q2 2026 call, p.12–13] [10-K FY2025, Item 7] [10-K FY2023, Item 8]"
    operating_margin:
      values: [0.33, 0.32, 0.31, 0.30, 0.30]
      reason: "Margins slip about three points over five years and then hold: the depreciation management has guided for is the big headwind (outlook.md §4), and cost discipline, a falling traffic-acquisition rate and Cloud becoming as profitable as the older businesses roughly cover it (business.md §3; outlook.md §1). The three points of slippage are the room left for energy, rented capacity and the low-margin chip-system sales described in outlook.md §3."
      detail: |
        Starting point: trailing-twelve-month GAAP margin 33.1%, first half of 2026 35.0%, FY2021–2025 31%, 26%, 27%, 32%, 32% (business.md §3 table) [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2]. Management says the build-out 'will continue to put pressure on the P&L in the form of higher depreciation expense and related data center operations costs, such as energy' (outlook.md §4) [Q2 2026 call, p.13–14].
        Headwind: depreciation of property and equipment was 25,237 trailing, 5.7% of revenue; 200,000 of capex adds about 24–28B a year of depreciation once in service (60% servers over six years = 20B, 40% data centers and network over about 20 years = 4B, using management's 60/40 split). On this case's capex path (200,000 in 2026, about 239,000 in 2027, then falling back; see the reinvestment override row) depreciation is about 8% of revenue in year 2, 11% in year 3, 12% in year 4 and 13% in year 5, roughly 6–7 points of headwind by year 5 before energy and operations costs [Q2 2026 call, p.11].
        Offsets: operating expenses were 27.8% of trailing revenue (R&D 15.5%, S&M 7.0%, G&A 5.3%), and growing them about 10% a year against 13% revenue growth frees about 4 points; TAC at 19.8% of ad revenue drifting down a point is worth about 0.7; Cloud (35.6% margin in Q2 2026, up from 23.7% in FY2025) growing from 17% toward 30% of revenue adds 1–2 points; about 6–7 points in all [Q2 2026 slides, p.9] [10-K FY2025, Note 15].
        Net: about zero to −1 before energy, third-party capacity and low-margin TPU hardware sales, so the path takes -3 to leave room for those. Acquired-intangible amortization, about 1,300 a year at its 2027 peak, is 0.2% of revenue and does not move the path.
      source: "[10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2] [Q2 2026 call, p.11] [Q2 2026 call, p.13–14] [Q2 2026 slides, p.9] [10-K FY2025, Note 15]"
    sales_to_capital:
      value: 0.9
      value_late: 1.2
      reason: "0.9 rising to 1.2 sits between what Alphabet has managed in the last year and its longer record, reflecting that AI capacity costs more per dollar of revenue than the old search machines did (business.md §3). Years 1–2 are set in dollars in the reinvestment override row, so this ratio drives years 3–5 only."
      detail: |
        Historical sales-to-capital, revenue change / (capex − depreciation of property and equipment), same year: 2022 1.40 (25,199 / 18,010), 2023 1.21 (24,558 / 20,305), 2024 1.15 (42,624 / 37,224), 2025 0.75 (52,818 / 70,311), first half of 2026 0.64 (43,030 / 67,012) [10-K FY2023, Item 8] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]. 2021 cannot be computed: FY2020 revenue is not in the cached filings.
        With the engine's one-year lag, where this year's spending buys next year's growth: 2021→22 1.75, 2022→23 1.36, 2023→24 2.10, 2024→25 1.42, 2025→H1 2026 roughly 1.2 annualized.
        Base: 0.9 early, between the latest same-year figure and the lagged history, and 1.2 late as depreciation catches up with spending.
      source: "[10-K FY2023, Item 8] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]"
    reinvestment_override:
      values: [173970, 187000, null, null, null]
      reason: "Years 1 and 2 are set in dollars rather than by ratio, because management has guided 2026 capital spending and said 2027 will rise significantly (outlook.md §4). From year 3 the model falls back to the sales-to-capital ratio, letting spending ease as depreciation catches up; nothing in the sources speaks to capex beyond 2027, so that fall-back is the input most worth the owner's attention."
      detail: |
        Year 1: the 2026 capex guidance midpoint of $195–205 billion = 200,000, less trailing depreciation of property and equipment 25,237 and intangible amortization 793 (26,030 together) = 173,970 of net reinvestment; calendar 2026 is mapped to model year 1 (July 2026–June 2027), an approximation [Q2 2026 call, p.11] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 9]. Netting trailing depreciation against a year whose depreciation will run about 35–40B overstates net reinvestment by roughly 10B, while the model year will carry more than calendar 2026's 200B given the 80.6B spent in the first half and a rising 2027; the two roughly offset and the result is accepted as conservative.
        Year 2 (2027) is anchored on the only sourced figure behind 'increase significantly in 2027': the second-half 2026 run-rate implied by the guidance midpoint, 200,000 − 80,598 spent in the first half = 119,402 per half-year, about 239,000 a year, less about 52,000 of 2027 depreciation = about 187,000 net, our inference from guidance [Q2 2026 call, p.13]. The 2027 depreciation figure uses a schedule of 60% servers over six years and 40% data centers and network over 20 years, a one-year lag to in-service, applied to 2021–2026 capex; the 60/40 split is management's.
        Years 3–5 fall back to sales-to-capital, which implies gross capex of roughly 155–185B a year (net 70–78B plus depreciation of 78–110B), so spending falls back from the 2027 peak as depreciation catches up. Acquisitions and working capital are ignored.
      source: "[Q2 2026 call, p.11] [Q2 2026 call, p.13] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 9]"
    tax_rate:
      start: 0.168
      terminal: 0.25
      reason: "Starts at the FY2025 effective rate of 16.8% and moves to the 25% marginal rate by the terminal year, as the model requires. Two forces point the rate up over time: the OECD agreement that sets a 15% floor on the tax a big company pays in each country, and the shrinking US deduction for income earned from serving customers abroad [10-K FY2025, Item 7]."
    cost_of_capital_override: null
    terminal:
      growth:
        value: riskfree
        allow_above_riskfree: false
        reason: "Equal to the fetched 10-year Treasury rate, by rule (§18.4 rule 5)."
      roic_premium:
        value: 0.03
        allow_large_premium: false
        reason: "Three points over the terminal cost of capital, from business.md §5: the search habit; the distribution Alphabet buys with traffic acquisition costs, the money it pays phone and browser makers to be their default search engine; the search data that courts treat as the hard-to-copy asset; YouTube's two-sided creator-and-viewer network; and Cloud switching costs from multi-year contracts. Below Damodaran's own four points for Alphabet in 2018, because the owner prefers to err low."
  bull:
    weight: 0.25
    story: |
      Alphabet turns out to own the whole AI stack, from its own chips to its own models to the products billions of people already use, and that lets it take a large share of both AI advertising and AI cloud computing. Search grows faster than before because AI answers create more questions and richer ads, Cloud approaches the profitability of the older businesses, and TPU systems become a real hardware business. Capital spending rises further in 2027 to meet the demand, and revenue more than doubles in five years while margins hold near today's level despite the heavier machinery. The moat is strong enough to earn a five-point premium over its cost of capital indefinitely.
    revenue_growth:
      values: [0.24, 0.21, 0.17, 0.13, 0.10]
      reason: "Growth holds roughly the 23–24% pace of the first half of 2026 for a year and then fades more slowly than in the base case, on the view that AI answers create more questions and richer ads while Cloud and the chip-system business compound (outlook.md §2–§3). Even year 5 at 10% is below what Alphabet did in 2024 and 2025, but the case only works if Search keeps growing in the mid-teens."
      detail: |
        History as in the base case. What supports the faster path: the Cloud backlog grew by more than 50,000 in one quarter to 513,900 and customers use more than they commit (outlook.md §3); AI Mode passed one billion monthly users and the Gemini app 950 million (outlook.md §2); TPU sales become a new revenue line [10-Q Q2 2026, Note 2] [Q2 2026 call, p.3–4] [Q2 2026 call, p.12] [Q2 2026 release, p.1]. Search & other grew in the mid-teens in the first half of 2026, which is what the case leans on (outlook.md §1).
      source: "[10-Q Q2 2026, Note 2] [Q2 2026 call, p.3–4] [Q2 2026 call, p.12] [Q2 2026 release, p.1]"
    operating_margin:
      values: [0.34, 0.35, 0.35, 0.35, 0.35]
      reason: "Margins hold near the level Alphabet reached in the first half of 2026 rather than rising: faster growth spreads the research and sales bills further and Cloud approaches the profitability of the older businesses, but that only covers the extra depreciation from a bigger build-out (business.md §3–§4; outlook.md §1)."
      detail: |
        Starting point: Q2 2026 margin 34.0%, which carried a 1.3-point legal charge, and first-half-2026 35.0% [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2] [Q2 2026 slides, p.9]. On this case's capex path (200,000 in 2026, about 260,000 in 2027, then falling back; see the reinvestment override row) depreciation of property and equipment runs about 8% of revenue in year 2 and 10–12% by year 5 against 5.7% trailing, a headwind of 4–6 points plus energy and operations costs [Q2 2026 call, p.11–12].
        Offsets: operating expenses were 27.8% of trailing revenue (R&D 15.5%, S&M 7.0%, G&A 5.3%), and growing them 12–13% a year against 17% revenue growth frees 4–5 points; Cloud (35.6% margin in Q2 2026 against 20.7% a year earlier, approaching Google Services' 41–45%) growing toward 30% of revenue adds 1–2 points; TAC drifting down adds about 0.7; 6–8 points in all [10-K FY2025, Item 8] [10-K FY2025, Note 15].
        Why the path does not rise: Q1 2026's 36.1% was earned with depreciation at 5.9% of revenue, before the wave [10-Q Q1 2026, Item 1]. Acquired-intangible amortization is 0.2% of revenue and immaterial.
      source: "[10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2] [Q2 2026 slides, p.9] [Q2 2026 call, p.11–12] [10-Q Q1 2026, Item 1] [10-K FY2025, Item 8] [10-K FY2025, Note 15]"
    sales_to_capital:
      value: 1.3
      value_late: 1.6
      reason: "1.3 rising to 1.6 assumes the older pattern returns, in which a year's spending shows up as revenue the year after (business.md §3). Years 1–2 are set in dollars in the reinvestment override row, so this ratio drives years 3–5 only."
      detail: |
        History as in the base case. What differs: 1.3 assumes the payoff pattern of the lagged series resumes, and 1.6 late is still under that lagged series' average of 1.66.
      source: "[10-K FY2023, Item 8] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]"
    reinvestment_override:
      values: [173970, 208000, null, null, null]
      reason: "Year 1 is the guided 2026 capital spending and year 2 is a bigger 2027 than in the base case, because demand is stronger; both are set in dollars rather than by ratio (outlook.md §4). From year 3 the model falls back to the sales-to-capital ratio, and nothing in the sources speaks to capex that far out, so that fall-back is a scenario assumption."
      detail: |
        Working as in the base case. What differs: year 2 spends about 260,000 of gross capex rather than about 239,000, the same sourced second-half-2026 run-rate (200,000 − 80,598 = 119,402 per half-year) plus about 9% to match stronger demand, less about 52,000 of 2027 depreciation on the base case's schedule = about 208,000 net, our inference [Q2 2026 call, p.11] [Q2 2026 call, p.13] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 9]. Years 3–5 fall back to sales-to-capital, which implies gross capex of roughly 160–190B a year (net 68–78B plus depreciation of 81–113B). Acquisitions and working capital are ignored.
      source: "[Q2 2026 call, p.11] [Q2 2026 call, p.13] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 9]"
    tax_rate:
      start: 0.168
      terminal: 0.25
      reason: "Starts at the FY2025 effective rate of 16.8% and moves to the 25% marginal rate by the terminal year, as the model requires. Two forces point the rate up over time: the OECD agreement that sets a 15% floor on the tax a big company pays in each country, and the shrinking US deduction for income earned from serving customers abroad [10-K FY2025, Item 7]."
    cost_of_capital_override: null
    terminal:
      growth:
        value: riskfree
        allow_above_riskfree: false
        reason: "Equal to the fetched 10-year Treasury rate, by rule (§18.4 rule 5)."
      roic_premium:
        value: 0.05
        allow_large_premium: false
        reason: "Five points, the ceiling without an override: the full-stack position (own chips, own models, own distribution) that business.md §5 describes for Cloud, together with the Search moat, is assumed to persist. Damodaran used four points for Alphabet in 2018."
  management:
    computable: false
    reason: "Management gives no revenue, margin or earnings targets for 2026 or later; the only numeric guidance is the 2026 capital-spending range, which is used as year-1 reinvestment. Everything else is qualitative and is marked 'not numeric' in the guidance table's 'used as' column below."
    story: |
      Management gives no revenue, margin or profit targets. It has committed to a capital-spending range for 2026, says 2027 will be significantly higher, expects free cash flow to stay under pressure, and expects Search growth to slow when measured against last year's strong quarters. Everything else is qualitative, so this case records what was said and computes nothing.
    guidance:
      - item: "Capex 2026"
        quote: "we are updating our full year 2026 CapEx guidance range to $195‑205 billion, up from our previous estimate of $180‑190 billion."
        source: "[Q2 2026 call, p.13]"
        used_as: "reinvestment year 1 (midpoint 200,000 minus TTM depreciation and amortization of 26,030 = 173,970)"
      - item: "Capex 2027"
        quote: "we continue to expect our CapEx to increase significantly in 2027, and we'll provide more details at a later date."
        source: "[Q2 2026 call, p.13]"

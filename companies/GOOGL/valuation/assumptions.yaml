      - item: "Backlog"
        quote: "we expect to recognize just over 50% of the total backlog as revenue over the next 24 months."
        source: "[Q2 2026 call, p.12]"
        used_as: "not numeric (informs analyst revenue growth in years 1–2)"
      - item: "TPU revenue timing"
        quote: "We continue to expect to recognize a relatively small portion of the revenues ... this year, ramping as we exit 2026. We anticipate the vast majority of the revenues from these agreements will be realized in 2027."

schema: 1
ticker: GOOGL
company: Alphabet Inc.
as_of_quarter: 2026-Q2
as_of_date: 2026-07-23
drafted: 2026-09-09
currency: USD
units: millions
horizon: 10

base_year:
  period: "the twelve months ending June 30, 2026 (Q3 2025 to Q2 2026)"
  revenue:
    value: 445866
    source: "[10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]"
    reason: "The base year is the twelve months to June 30, 2026, so the model starts from what Alphabet has just earned rather than from a calendar year (business.md section 2). It is the 2025 annual figure with the newest half-year swapped in for the year-earlier half-year."
    detail: |
      Trailing twelve months = FY2025 revenue 402,836 + six months to June 30, 2026 of 229,692 minus six months to June 30, 2025 of 186,662 = 445,866. All three figures come from the consolidated statements of income [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1].
  operating_income_gaap:
    value: 147628
    source: "[10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]"
    reason: "Operating profit for the same twelve months, exactly as reported, which works out at 33.1% of revenue (business.md section 3). The legal charges in the one-time items list below are deliberately left inside it, because charges like them arrive most years."
    detail: |
      Income from operations, trailing twelve months = FY2025 129,039 + 6M 2026 80,466 minus 6M 2025 61,877 = 147,628 [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]. 147,628 / 445,866 = 33.1% (computed).
  one_time_items:
    - name: "EC advertising-technology fine, Q3 2025 (recorded, not added back)"
      value: 0
      source: "[10-K FY2025, Item 7] [10-Q Q2 2026, Note 10]"
      reason: "A 3.5 billion USD fine from the September 2025 European Commission ad-technology decision sits inside the base year's costs and is left there. Brussels has fined Alphabet at intervals since 2017, so the method treats these fines as a recurring cost of running this business rather than a one-off (business.md section 6)."
      detail: |
        The charge sits in trailing-twelve-month general and administrative expense [10-K FY2025, Item 7] [10-Q Q2 2026, Note 10]. The run of EC fines: Shopping 2017, Android 2018, AdSense 2019, ad-tech 2025. Set this cell's value to 3500 to add the charge back instead.
    - name: "PriceRunner damages award, Q2 2026 (recorded, not added back)"
      value: 0
      source: "[10-Q Q2 2026, Item 2] [10-Q Q2 2026, Note 10]"
      reason: "A Stockholm court ordered Alphabet to pay PriceRunner damages, and the 1.5 billion USD of principal was charged to Google Services costs in Q2 2026; it is left in the base year. Legal accruals like this recur at Alphabet and the award is under appeal, so it is not treated as one-off (business.md section 6)."
      detail: |
        Principal damages of 1.5 billion USD were accrued in G&A (Google Services) in Q2 2026 after the ruling; a further 581 million USD of interest and costs went to other income, outside operating income [10-Q Q2 2026, Item 2] [10-Q Q2 2026, Note 10]. The recent run of legal charges: a 1.4 billion USD accrual in Q2 2025, the EC fine in Q3 2025, this award in Q2 2026. Set this cell's value to 1500 to add it back.
    - name: "Waymo valuation-based compensation charge, Q4 2025 (recorded, not added back)"
      value: 0
      source: "[10-K FY2025, Item 7]"
      reason: "A 2.1 billion USD employee compensation charge for Waymo, based on estimated stock valuation and mostly in R&D, was recognized in Q4 2025. Not added back because it is stock-based pay, which always stays as a cost by rule."
    - name: "Office space impairment, Q1 2026 (recorded, not added back)"
      value: 0
      source: "[10-Q Q1 2026, Item 2]"
      reason: "300 million USD of office space impairment charges in Q1 2026 sales and marketing expense. Not added back: office-exit charges recurred in 2023 (1.8 billion USD, business.md section 3) and again here, and the amount is 0.07% of TTM revenue."
  amortization_of_acquired_intangibles:
    value: 793
    source: "[10-Q Q2 2026, Note 9]"
    reason: "This is the yearly write-down of technology and customer lists bought in acquisitions. It stays as a cost by rule and is recorded here only as a memo; at 0.2 to 0.3% of revenue it is far too small to bend the margin paths, whether it runs off or not."
    detail: |
      Trailing twelve months = 545 for the six months to June 30, 2026 (Wiz and Intersect closed in March 2026) + 248 for the second half of 2025 = 793 [10-Q Q2 2026, Note 9]. The second half of 2025 is not disclosed in the cached filings (the FY2025 10-K carries no intangible-assets table and the Q3 2025 10-Q is not cached), so it is taken at the Q2 2025 quarterly run-rate of 124 times 2 = 248; our inference. Disclosed expected amortization: 747 for the rest of 2026, 1,304 in 2027, then 1,142, 1,096 and 1,055, i.e. about 0.2 to 0.3% of revenue. Memo row; stays deducted.
  stock_based_compensation:
    value: 28147
    source: "[10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]"
    reason: "Pay handed out as shares, 6.3% of revenue in the base year. The method keeps it inside operating profit, because it is a real cost to existing owners; this cell is only a memo (business.md section 4)."
    detail: |
      Cash-flow statement SBC expense, trailing twelve months = FY2025 24,953 + 6M 2026 14,708 minus 6M 2025 11,514 = 28,147 [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]. 28,147 / 445,866 = 6.3% of revenue (computed). Memo row; never added back.
  rnd_expense:
    value: 68974
    source: "[10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]"
    reason: "What Alphabet spent on research and development in the base year, 15.5% of revenue. Memo row only: the switch that would treat research as an investment rather than a cost is off, as the method requires."
    detail: |
      Research and development, trailing twelve months = FY2025 61,087 + 6M 2026 35,251 minus 6M 2025 27,364 = 68,974 [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]. 68,974 / 445,866 = 15.5% of revenue (computed). Used only if the research-capitalisation switch is turned on.
  effective_tax_rate:
    value: 0.168
    source: "[10-K FY2025, Item 7] [10-Q Q2 2026, Note 14]"
    reason: "The model starts from Alphabet's FY2025 tax rate of 16.8%, the cleanest recent measure of tax on ordinary profits (business.md section 4). Rates computed from the newest quarters look higher only because enormous paper gains on investment stakes carry tax at the full statutory rate, and those gains have nothing to do with the operating business."
    detail: |
      FY2025: provision 26,656 on pre-tax income 158,826 = 16.8%, a rate that already includes a non-deductible EC fine [10-K FY2025, Item 7]. Alternatives considered: the trailing-twelve-month rate on the same basis is 18.4% (55,064 / 299,269), and the Q2 and six-month 2026 rates were 19.1%; all of them are pushed up by 99.0 billion USD of unrealized equity gains carrying deferred tax at the statutory rate [10-Q Q2 2026, Note 14].
  invested_capital:
    value: 516207
    source: "[10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 4] [10-Q Q2 2026, Note 6]"
    reason: "The capital the business has been handed: what shareholders and lenders put in, less the cash it is sitting on. It is used only for the return-on-capital check, and it understates that return, because it still contains large investment stakes that are not operating assets (business.md section 4)."
    detail: |
      At June 30, 2026: total stockholders' equity 640,480 + debt 100,164 (long-term 98,165 plus current portion 1,999) + operating lease liabilities 18,037 minus cash, cash equivalents and marketable securities 242,474 = 516,207 [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 4] [10-Q Q2 2026, Note 6]. Excluding the 131,461 of non-marketable securities and the 14,126 of restricted SpaceX shares held in other non-current assets gives 370,620 and a correspondingly higher ROIC.
switches:
  addback_acquired_amortization: false
  capitalize_rnd: false
  rnd_amortization_years: 5
  rnd_history: []
  reinvestment_lag: 1

bridge:
  cash_and_marketable_securities:
    value: 162474
    source: "[10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 3]"
    reason: "The cash and investments Alphabet could turn into money at short notice, which the model adds to the value of the business. The SpaceX shares inside the balance-sheet total are excluded here because they cannot be sold yet; they are listed separately below."
    detail: |
      Balance-sheet cash, cash equivalents and marketable securities of 242,474 less the 80,000 of SpaceX shares that carry short-term sale restrictions (Note 3, footnote 1) = 162,474 [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 3]. What remains is 55,911 of cash and equivalents plus 106,563 of other marketable securities: 99,500 of government bonds, corporate debt and mortgage-backed securities, and 7,063 of other marketable equity, all sellable at short notice.
  debt:
    value: 100164
    source: "[10-Q Q2 2026, Note 6] [10-Q Q2 2026, Item 1]"
    reason: "Every dollar of borrowing on the balance sheet, at the value the accounts carry it at, subtracted from the value of the business. No commercial paper is outstanding (business.md section 4)."
    detail: |
      Long-term debt 98,165 plus the 1,999 current portion of long-term notes held in accrued expenses = 100,164 [10-Q Q2 2026, Note 6] [10-Q Q2 2026, Item 1]. Face value is 101,085; the 921 difference is unamortized discount and issuance costs, and the notes' estimated fair value was 94,900. The total includes 1,686 of other long-term debt; the 10-Q does not say whether the 1,300 drawn on credit facilities is part of it.
  operating_lease_liabilities:
    value: 18037
    source: "[10-Q Q2 2026, Note 4]"
    reason: "Rent Alphabet has already committed to on buildings and data centers it leases, treated as debt-like and subtracted from value. Data-center leases that are signed but have not started are not liabilities yet and belong to the reinvestment story instead."
    detail: |
      Current 3,446 (in accrued expenses) + non-current 14,591 = 18,037 [10-Q Q2 2026, Note 4]. The excluded signed-but-not-commenced leases carry 85,200 of future payments.
  non_operating_assets:
    - name: "SpaceX shares under short-term sale restrictions (inside marketable securities)"
      value: 80000
      source: "[10-Q Q2 2026, Note 3]"
      reason: "Shares in SpaceX that Alphabet holds inside its marketable securities at fair value, meaning the price they would fetch if sold today. They are kept out of the cash line because they cannot be sold yet, so they are added to the value of the business separately."
      detail: |
        Note 3 footnote 1 reads 'Includes [USD] 80.0 billion of Space Exploration Technologies Corp. (SpaceX) shares subject to short-term restrictions on the ability to sell.' [10-Q Q2 2026, Note 3]; the dollar sign in the original is written here as USD. The carrying value comes from the 99.0 billion USD revaluation of the equity portfolio in Q2 2026.
    - name: "Marketable equity securities in other non-current assets (includes 14.1 billion USD of SpaceX shares restricted through Q3 2027)"
      value: 14126
      source: "[10-Q Q2 2026, Note 3]"
      reason: "A second block of SpaceX shares, held among other non-current assets, the accounting label for assets not expected to turn into cash within a year. It is carried at fair value, the price it would fetch today, and it sits outside the balance-sheet cash total, so it is added separately."
      detail: |
        Note 3 lists 14,126 of marketable equity securities within other non-current assets, footnoted as including 14.1 billion USD of SpaceX shares under long-term sale restrictions through the third quarter of 2027 [10-Q Q2 2026, Note 3]. This sits outside the 242,474 cash total.
    - name: "Non-marketable securities (private companies, including the unnamed private company; equity-method stakes)"
      value: 131461
      source: "[10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 3]"
      reason: "Stakes in private companies, added to value separately because they are not part of the advertising and cloud business (business.md section 7). The figure is what the last funding rounds implied rather than a market price, so the owner may want to mark it down."
      detail: |
        Balance-sheet carrying value 131,461 = 124,259 held under the measurement alternative (of which 87,900 was re-marked to fair value in Q2 2026, primarily the private company the 10-Q does not name) + 7,202 of equity-method and other investments [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 3]. Excluded: the remaining 20,000 milestone-based funding commitment to that private company, an equity derivative carried as a 457 fair-value liability, because money paid out would buy more shares and so is not a claim on today's value.
  minority_interests:
    value: 7100
    source: "[10-Q Q2 2026, Note 7]"
    reason: "The book value of the slices of subsidiaries such as Waymo that outside investors own, subtracted because that share of the profits is not Alphabet's. Accountants call them noncontrolling interests, meaning stakes too small to control the subsidiary; 824 of the total is redeemable, meaning those holders can require Alphabet to buy them out."
    detail: |
      Total noncontrolling interests in consolidated subsidiaries were 7.1 billion USD at June 30, 2026, including 824 redeemable [10-Q Q2 2026, Note 7]. The 10-Q states the total in billions, so 7,100 is rounded.
  other_claims:
    - name: "6.25% mandatory convertible preferred stock (liquidation preference)"
      value: 19250
      source: "[10-Q Q2 2026, Note 11] [8-K 2026-06-05 (preferred)]"
      reason: "In June 2026 Alphabet sold preferred shares that get paid before ordinary shareholders and turn into ordinary shares in May 2029. They are subtracted here at the amount their holders are owed first, which is simpler and slightly more conservative than adding the future shares to the share count."
      detail: |
        Count: 385 million depositary shares (167.5 million per series plus the 25 million over-allotment option per series, exercised in full), each a 1/20th interest in a preferred share, = 19.25 million preferred shares times 1,000 USD of liquidation preference = 19,250 [10-Q Q2 2026, Note 11] [8-K 2026-06-05 (preferred)]. The 10-Q rounds the count to 19 million and carries the shares at 18,023 in equity after issuance costs and a 1,000 capped-call premium. Holders receive 6.25% cumulative dividends, about 1,200 a year and roughly 3,000 of present value over the three years to conversion; that dividend stream is not separately valued here. Conversion on or about May 15, 2029 is at 2.2520 to 2.8160 (Series A) or 2.2740 to 2.8420 (Series B) common shares per preferred share. Alternative considered: add roughly 43 to 54 million shares to the count instead. The Q2 diluted count already includes 16 million shares from a partial-period if-converted treatment, a small overlap.
    - name: "Finance lease liabilities"
      value: 2590
      source: "[10-Q Q2 2026, Note 4]"
      reason: "Equipment and space Alphabet has effectively bought on credit through leases. Debt-like, and not counted in the debt or operating-lease lines above, so it is subtracted here."
      detail: |
        449 current + 2,141 non-current = 2,590 [10-Q Q2 2026, Note 4].
    - name: "Accrued legal and regulatory fines and settlements"
      value: 17356
      source: "[10-Q Q2 2026, Note 7] [10-Q Q2 2026, Item 2]"
      reason: "Fines already charged against past operating profit but not yet paid, 'primarily' EC fines; 5.2 billion USD of it (the Android fine plus interest) was paid in July 2026. Cash that will leave without buying anything, so it is treated like debt. Future fines are inside the forecast margins, because the one-time items listed in the base year are left inside operating profit."
    - name: "Data-center backstop credit derivatives, at fair value"
      value: 815
      source: "[10-Q Q2 2026, Note 3] [10-Q Q2 2026, Note 10]"
      reason: "Alphabet has promised to cover other companies' data-center payments if they default, and the liability it records for those promises is subtracted here. The worst case is far bigger than the recorded number, which is why the line is worth the owner's attention (business.md section 6)."
      detail: |
        Recorded fair value 815; the notional (maximum) exposure is 43,785 [10-Q Q2 2026, Note 3] [10-Q Q2 2026, Note 10]. Not included: 7,600 of energy-equipment guarantees, whose fair value the 10-Q calls not material, and an estimated 24,100 of backstops still being finalized, which are not yet obligations.
  probability_of_failure:
    value: 0.0
    reason: "Zero: Alphabet holds far more spendable cash and securities than debt, earns a large operating profit every quarter, and has just shown it can raise money at will. Failure inside the forecast window is not a realistic case (business.md section 4)."
    detail: |
      162,474 of unrestricted cash and securities against 100,164 of debt and 147,628 of trailing-twelve-month operating income; 56 billion USD of notes and 49.6 billion USD of equity were raised in the first half of 2026 alone [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2]. Damodaran's own rule keeps failure risk out of the discount rate and sets it to zero for a large profitable company [Damodaran notes, story-to-numbers playbook, section 7].
  distress_proceeds:
    value: 0
    reason: "Not needed with probability of failure at zero."
  diluted_shares:
    value: 12309
    source: "[10-Q Q2 2026, Note 12]"
    reason: "The share count the per-share value is divided by: the latest quarter's average share count as the accountants compute it, including shares owed on employee awards and the new preferred. Shares sold in June 2026 count only for the part of the quarter they existed, which is why the period-end count is a little higher."
    detail: |
      Q2 2026 diluted weighted-average shares, consolidated: 12,309 million = 12,151 basic + 142 RSUs and other contingently issuable shares + 16 from the preferred under the if-converted method [10-Q Q2 2026, Note 12]. Period-end common shares outstanding were 12,230 million. The June sales were roughly 87 million shares: the 10-Q rounds them to 29 + 29 + 14 + 14 million, and the 8-K's 25.46 million per class plus the fully exercised 3.82 million over-allotment option per class and 28.57 million private-placement shares total 87.1 million [8-K 2026-06-04].
  dilution_note: "A 40.0 billion USD at-the-market program was set up in June 2026 and was unused at June 30; the CFO said it will run 'for some period of time' to cover tax on stock-based pay [Q2 2026 call, p.18] [10-Q Q2 2026, Item 2]. The preferred converts into about 43 to 54 million common shares in May 2029, partly offset by capped calls [10-Q Q2 2026, Note 11]. Buybacks that used to absorb employee stock issuance were zero in the first half of 2026 [10-Q Q2 2026, Note 11]."

market:
  price: auto
  risk_free_rate: auto
  equity_risk_premium: auto
  mature_market_erp: 0.04
  marginal_tax_rate: 0.25

cost_of_capital:
  method: build
  pinned_value: null
  build:
    damodaran_industry:
      value: "Advertising"
      reason: "Advertising is the industry group used for the risk measure, because ads are just over 70% of revenue and their economics drive the profit (business.md section 2). Cloud is the fast-growing minority with different economics, so the owner may want the planner to test a software group as well."
      detail: |
        Advertising was 70.7% of trailing-twelve-month revenue: 315,348 of 445,866, being Search & other, YouTube ads and Network [10-K FY2025, Item 7] [10-Q Q2 2026, Note 2]. Google Cloud is 17.4% of revenue and growing about 80% a year, with economics closer to 'Software (System & Application)' or 'Computer Services'. 'Software (Internet)' is a reasonable whole-company alternative and the planner may compare both betas. Note for the diagnostics pages: the engine compares margins, growth and sales-to-capital with this same Advertising row, whose members are agencies and ad networks that sell other people's media, so those comparisons are weak; the scenario details below name the rows that are the true competitor set for each input, 'Software (System & Application)' for margin and reinvestment, and label them.
    unlevered_beta:
      value: 1.008
      source: "[Damodaran betas.xls, Advertising, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/betas.csv]"
      reason: "Damodaran's advertising-industry beta of about 1.0 means Alphabet's operating profits are assumed to swing roughly in line with the market's, which is what sets the cost of capital. Treating Alphabet as an internet-software company instead would raise that cost by about two and a half points, a test the owner can run."
      detail: |
        1.0080 is the cash-corrected unlevered beta of Damodaran's 52-company US advertising group [Damodaran betas.xls, Advertising, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/betas.csv]. The whole-company alternative 'Software (Internet)' is 1.591, worth about 2.4 points on the cost of capital, and the owner can test this in the app. The built cost of capital, about 8.8%, sits near the middle of Damodaran's US distribution (his stated median near 8%, tenth to ninetieth percentile about 6% to 12%) and between his Advertising row at 7.81% and his Software (System & Application) row at 9.34% [Damodaran wacc.xls, Advertising and Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/wacc.csv] [Damodaran notes, story-to-numbers playbook, section 5]. It carries no failure risk (that is a separate probability, set to zero) and no management quality (that is in the growth and margin stories), and it is shared by every case.

    debt_to_equity_market:
      value: 0.0284
      source: "[10-Q Q2 2026, Note 6] [10-Q Q2 2026, Note 4] [10-Q Q2 2026, Note 12] [Yahoo price 338.36 on 2026-09-08]"
      reason: "Borrowing is under 3% of what the market says Alphabet's shares are worth, even after the bond sales of 2025 and 2026, so debt barely moves the cost of capital (business.md section 4). This ratio is what levers the industry beta up."
      detail: |
        Debt 100,164 plus operating lease liabilities 18,037 = 118,201 (120,791 if finance leases are added), divided by market capitalisation of 4,164,873 (338.36 times 12,309 million diluted shares) = 0.0284 [10-Q Q2 2026, Note 6] [10-Q Q2 2026, Note 4] [10-Q Q2 2026, Note 12] [Yahoo price 338.36 on 2026-09-08].

    pretax_cost_of_debt:
      value: 0.048
      source: "[10-Q Q2 2026, Note 6] [10-K FY2025, Item 7]"
      reason: "4.8% is what long-dated dollar borrowing costs Alphabet today, taken from the coupon on its most recent large dollar bond sale. Dollar coupons are used because the model discounts dollar cash flows."
      detail: |
        The 20.0 billion USD of US-dollar notes issued in Q1 2026 carry a weighted-average coupon of 4.80% with a 15-year average maturity [10-Q Q2 2026, Note 6]. For comparison: the 2025 US-dollar notes were issued at 4.89% and 4.92%, and effective interest rates on the dollar notes of 2025 and 2026 run 3.93% to 5.84% [10-K FY2025, Item 7]. The euro, sterling, franc, Canadian-dollar and yen notes carry local-currency coupons of 1.06% to 5.31% and are not comparable.
  terminal:
    method: mature
    value: null
    reason: "Default: after the forecast Alphabet is priced like a mature company, so its long-run cost of capital becomes the ten-year government bond rate plus the 4 per cent mature-market premium the owner set."

diagnostics:
  final_year_market_size:
    value: null
    source: "[Q2 2026 call, p.22] [Q1 2026 call, p.6]"
    reason: "Left empty: the two reports (business.md and outlook.md), the six gatherer notes, every cached filing, release, slide deck and transcript for Q2 2026 and Q1 2026 including both 10-Ks and the DEF 14A, and the two Damodaran notes were searched for a money figure on world spending on advertising, digital advertising, cloud or IT, or on any addressable market, and none holds one; the hits are counts (nearly 90% of the Fortune 100, trillions of searches and tokens) and management's words that chip-system sales are 'an expansion of our total addressable market'. The method forbids inventing a figure, so the end-year test rests on the largest-company comparison in the revenue detail of each case: year-ten revenue against the base year, against the economy growing at the risk-free rate, and against Damodaran's count of five companies above 400 billion USD and his remark that a trillion is revenue no company has ever generated. The working and the sourced anchors that bound the near years are in the notes below."
    detail: |
      What was searched, file by file, with the phrases trillion, addressable, total market, market size, ad spend, advertising spend, IT spend, cloud market, market opportunity, TAM, global advertising, digital advertising, advertising market, advertising industry, cloud industry, spending on cloud, enterprise spend, largest companies and Fortune 500: the two reports (business.md and outlook.md), the Q2 2026 10-Q, press release, slides, transcript, three 8-Ks and three gatherer notes, the Q1 2026 10-K FY2025, 10-K FY2023, 10-Q, DEF 14A, release, slides, transcript and three gatherer notes, and the two Damodaran notes, whose only market figures are for Uber's taxi market, Nvidia's AI-chip market and his textbook examples. Hits were all non-money: 'trillions of searches on Google every year' [10-K FY2025, Item 1]; the market value of the company's own shares; 'processed more than one trillion tokens' [Q2 2026 call, p.5]; 'AI is quickly reshaping the advertising industry' in a risk factor [10-K FY2025, Item 1A]; 'expand our addressable market opportunity' for TPU hardware [Q1 2026 call, p.6]; and 'this is an expansion of our total addressable market' [Q2 2026 call, p.22]. No cached source names a competitor's revenue either; the 10-K lists competitor types (general purpose search engines, online advertising platforms, providers of enterprise cloud services, AI model developers, social networks) without names or figures [10-K FY2025, Item 1].

      The test without a market number. Year-10 revenue (the twelve months to June 2036) on each written path with the years 6 to 10 fade to the 4.78% risk-free rate: bear about 1,021,000 (2.3 times the base year of 445,866), base about 1,473,000 (3.3 times), bull about 1,842,000 (4.1 times). Two yardsticks. First, the economy: the method takes the risk-free rate as the proxy for the nominal growth of the economy, and 4.78% a year compounds to about 1.6 times over ten years, so the base case has Alphabet's share of the economy roughly doubling and the bull case rising about two and a half times [Damodaran notes, story-to-numbers playbook, section 6]. Second, the largest companies: Damodaran counted 'only five companies in the world that reported annual revenues exceeding 400 billion USD' in January 2023 and warned that revenues of 'a trillion or more' would be 'revenues that no company in history has ever generated' [Damodaran notes, story-to-numbers playbook, section 2]. Alphabet already sits above that 400 billion mark; the base case crosses one trillion in year 5 and the bear case only in year 10. That is the honest weak point of the 'possible' test for every case, and the reason revenue growth is the input most worth the owner's attention. The sourced anchors that bound the near years are the Google Cloud order book of 513,900 at June 30, 2026, just over half of it expected as revenue within 24 months, and 811,000 of purchase commitments of which 200,700 falls due within a year [10-Q Q2 2026, Note 2] [10-Q Q2 2026, Item 2]: commitments of that size are consistent with management building for a business far larger than today's, which is what all three stories assume in different degrees.
  historical_revenue_cagr:
    value: 0.118
    source: "[10-K FY2023, Note 2] [10-K FY2025, Item 7]"
    reason: "Alphabet's own revenue grew about 11.8% a year over the five fiscal years 2021 to 2025. It is context for the scenario growth paths rather than the anchor for them, because the mix has changed: advertising was 81% of revenue in 2021 and 73% in 2025, against 71% in the base year (business.md section 2)."
    detail: |
      From the five-year table in business.md section 2: total revenue 257.6 billion in FY2021 and 402.8 billion in FY2025, which is four years of compounding. Taking 402.8 divided by 257.6, then the power of 1/4, then subtracting 1, gives 0.118 (computed). Sources as given by that table: FY2021 to FY2023 [10-K FY2023, Note 2]; FY2024 and FY2025 [10-K FY2025, Item 7]. Industry context from the cached datasets, dated 2026-01-05: Advertising five-year revenue growth 17.7% a year, Software (System & Application) 19.6%, Computer Services 27.1%, Total Market 12.8% [Damodaran histgr.xls, Advertising and Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/histgr.csv]. None of these is an anchor: Alphabet's Cloud unit was 7% of revenue in 2021 and is 17% in the base year, so the growth its old mix produced is not the yardstick for the new one.

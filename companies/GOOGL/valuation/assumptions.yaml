    revenue_growth:
      values: [0.20, 0.14, 0.10, 0.08, 0.07]
      reason: "Year one sits three points under the 23% pace just reported, and four moves make up the gap, each from something management or the 10-Q named: the currency swing and the tougher Search comparison take Search from 17% to 13%, a point further than the base case reads the same two items; the World Cup boost management named for YouTube does not repeat and the same currency swing reaches YouTube too, taking it from 13% to 10%; the pending court remedy in the advertising-technology case is read as landing on Network, which falls 5% rather than 1%; and Cloud goes from 82% to 60% rather than the base case's 72%, because this case reads 'we continue to be supply constrained' as capacity, not demand, setting Cloud's revenue for the year. Subscriptions stay at their reported 15% in year one because nothing in the sources moves them yet; the bear's own view shows from year two, when Search erodes to the low single digits as assistant answers take a growing share of questions, YouTube and subscriptions slow with it, and Cloud, once the first wave of customer AI projects is built, settles to the pace of an ordinary cloud business (business.md section 6, risks 1, 3 and 5). By year ten this company is a little over twice today's size, against more than three times in the base case."
      source: "[10-Q Q2 2026, Note 2] [10-Q Q2 2026, Note 10] [10-Q Q2 2026, Item 2] [Q2 2026 call, p.2] [Q2 2026 call, p.11] [Q2 2026 call, p.12] [Q2 2026 call, p.13] [Q2 2026 call, p.15] [Q2 2026 release, p.1] [10-K FY2025, Item 7]"
      detail: |
        End state first. In year 10 (the twelve months to June 2036) this case has Alphabet at about 1,021,000 of revenue, 2.3 times the base year of 445,866, with Cloud at about 273,000 by year 5, roughly the size of today's Search business, and Search itself at about 334,000 in year 5, growing 3% a year. That is the outcome the path below is backed out from: a company that has become an ordinary large technology business, growing with the economy by the end of the forecast. Comparison with the largest firms and the market: see the market-size diagnostic; no cached source gives a market or competitor figure.

        Segment build. Trailing revenue is the twelve months to June 30, 2026 (the 2025 full year with the newest half-year swapped in for the year-earlier half-year); latest growth is the June 2026 quarter against the same quarter of 2025 [10-K FY2025, Item 7] [10-Q Q2 2026, Note 2] [Q2 2026 release, p.1].

        | Line | Trailing revenue | Latest growth | Year 1 | Year 2 | Year 3 | Year 4 | Year 5 | Year 5 revenue |
        |---|---|---|---|---|---|---|---|---|
        | Google Search and other | 243,310 | 17% | 13% | 8% | 5% | 4% | 3% | 333,981 |
        | YouTube ads | 42,582 | 13% | 10% | 8% | 6% | 5% | 5% | 59,119 |
        | Google Network | 29,456 | -1% | -5% | -6% | -6% | -6% | -6% | 21,848 |
        | Google subscriptions, platforms and devices | 51,743 | 15% | 15% | 11% | 9% | 8% | 8% | 83,974 |
        | Google Cloud | 77,617 | 82% | 60% | 35% | 22% | 17% | 14% | 272,811 |
        | Other Bets | 1,507 | 2% | 10% | 10% | 10% | 10% | 10% | 2,427 |
        | Currency-protection gains and losses | -349 | n/a | held flat | held flat | held flat | held flat | held flat | -349 |
        | Whole company | 445,866 | 24% | 19.9% | 13.9% | 9.7% | 8.1% | 7.1% | 773,811 |

        The build gives 19.9, 13.9, 9.7, 8.1 and 7.1 per cent; the path is written as 20, 14, 10, 8 and 7, each the nearest whole point. Revenue on the written path: 535,039 in year one, then 609,945, 670,939, 724,614 and 775,337; the years 6 to 10 fade gives 826,168, 876,664, 926,353, 974,746 and 1,021,339.

        Year one against the run-rate. Reported growth was 23.1% in the first half of 2026 and 24.2% in the June quarter, and reported Search and other growth was 17% for the quarter and 18% for the half [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2] [Q2 2026 release, p.1]. Every line of any size that moves off its reported pace does so on a named item, and this case reads each item at its pessimistic end; where no item exists the line keeps its reported pace. Other Bets is the one exception: it is carried at 10% against a reported 2% with no item, as each case carries its own figure for it, and on 1,507 of revenue the difference is three hundredths of a point of company growth. Search, 17% to 13%: a one point currency tailwind in the June quarter becomes 'a slight FX headwind' in the third quarter, felt 'primarily in Search and YouTube Ads', and from the third quarter the company starts 'lapping an acceleration in Search performance that began in the third quarter last year' [Q2 2026 call, p.13]. Search grew 13.4% for calendar 2025 as a whole, so if the acceleration began in the third quarter the first half of 2025 grew slower than that and the second half faster, which makes the comparison from the third quarter of 2026 several points tougher than the one the first half of 2026 enjoyed [10-K FY2025, Item 7]; this case reads those two items in full and takes Search to 13%, where the base case takes it to 14% and the bull to 16%. YouTube, 13% to 10%: management said 'We experienced strong Ads growth related to the World Cup, particularly in YouTube Ads', and the same currency headwind falls 'primarily in Search and YouTube Ads', so this case removes the tournament's lift in full and the currency point on top, where the base case removes the tournament alone and lands at 12% [Q2 2026 call, p.11] [Q2 2026 call, p.13]. Network, down 1% to down 5%: the 10-Q says the company is 'awaiting a final judgment' on remedies in the advertising-technology case and that the government's proposal 'includes structural remedies that could have a material adverse effect on our business'; this case reads that judgment as landing inside year one on the publisher tools that carry Network revenue, where the base case takes the line to down 3% on its existing decline (business.md section 6, risk 3); the pending judgment is the sourced item, and its timing inside year one and the four-point size are this case's inference, since the 10-Q gives neither [10-Q Q2 2026, Note 10]. Subscriptions, platforms and devices: held at the reported 15%, the base case's figure, because the 10-Q names only general factors for this line ('changes in customer usage and demand, number of subscribers, and the timing of product launches') and the call names only strength (YouTube Music and Premium, Google One AI plans), so nothing sourced moves it in year one; the story's slowdown in this line begins in year two [10-Q Q2 2026, Item 2] [Q2 2026 call, p.12]. Cloud, 82% to 60%: management said 'we continue to be supply constrained' [Q2 2026 call, p.2], that 'given the supply constraint environment, we plan to expand the use of third-party capacity in Q3 as a bridging strategy while we build out more internal capacity' [Q2 2026 call, p.13], and that 'we're still in a supply-constrained environment ... the demand still outpaces that investment' [Q2 2026 call, p.15]. The base case reads those words as demand that arrives when capacity does and takes Cloud to 72%; this case reads them as capacity, not demand, setting Cloud's revenue for the year, with the rented capacity a bridge rather than a step, so the shortage is relieved more slowly and the June 2027 quarter's Cloud revenue ends about two fifths above the June 2026 quarter's 24,768 rather than about half again. That is the reading, and it is the pessimistic one; the chip-system revenue whose 'vast majority' is due in 2027 is carried as in the base case, because it is signed [Q2 2026 call, p.13]. Together the lines give 19.9% for the company, written as 20%. This case's own view of the business is expressed in years two to five, not in year one.

        Order book check on years one and two: Cloud revenue of 124,187 then 167,653, or 291,840 together, against the just-over-half of the 513,900 order book the company expects to record as revenue within 24 months, about 257,000 [10-Q Q2 2026, Note 2] [Q2 2026 call, p.12]. So even this case sits only 35,000 above the contracted floor for the first two years, which is why the bear is a late-breaking one. Cloud in years four and five grows 17% and 14%, below the 26% to 36% Google Cloud managed in 2023 to 2025 and near the 12.3% expected five-year growth of Damodaran's Software (System & Application) row, which is what 'an ordinary cloud business' means here [10-K FY2025, Note 15] [Damodaran histgr.xls, Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/histgr.csv].

        Steps down of more than three points, and what drives each: Search 13% to 8%, because from year two assistant answers take a growing share of questions and carry cheaper ads (business.md section 6, risk 1); Search 8% to 5%, the same erosion continuing as the assistant habit spreads; subscriptions 15% to 11%, because from year two the same assistant habit slows the sign-ups to Google One AI plans and YouTube Premium that drive this line, which is what the story's 'YouTube and subscriptions slow with it' means in numbers; Cloud 60% to 35%, because the 24-month conversion of the order book and the one-off arrival of chip-system revenue both sit inside years one and two; Cloud 35% to 22%, because the first wave of customer AI build-outs is finished and nothing has replaced it; Cloud 22% to 17%, capacity now exceeds demand and prices soften; and the whole-company steps from 19.7% to 13.9% and from 13.9% to 9.7%, which are those Cloud and Search steps combined.

        Context, not an anchor: the company's own five-year growth was 11.8% a year and 2022 and 2023 grew 9.8% and 8.7%, but with advertising at 81% of revenue in 2021 rather than 71% today [10-K FY2023, Item 8] [10-K FY2025, Item 7]. This case does not fade toward that record; it fades toward the end state its story implies, and the two happen to be close because the story is one in which the new engine stalls.

        Where this sits against management's words: at odds with 'AI continues to drive an expansionary moment' for Search and with 'very early innings' for enterprise AI, and in line only with the cautions management itself gave, the currency headwind and the tougher Search comparison [Q2 2026 call, p.3] [Q2 2026 call, p.13] [Q2 2026 call, p.14].

        The owner's saved values were 0.13, 0.12 and 0.12 for years three to five; this draft lands at 0.10, 0.08 and 0.07 because the segment build only reaches the owner's path if Search holds about 8% and Cloud about 25% to 27% in years three to five, and that is the base story with the growth dial turned down two to four points, not a different outcome. The bear's difference from the base has to live in years three to five, because the order book fixes years one and two, and it is what gives the 25% weight on this case any meaning. Year two lands at 0.14 against the 0.13 of the previous draft, which the owner left unchanged, because the build gives 13.9%.
    operating_margin:
      values: [0.33, 0.31, 0.28, 0.28, 0.27]
      reason: "Margins fall about six points, back to the lows of 2022 and 2023, because the depreciation from data centres already ordered climbs whether the revenue comes or not, and with growth in single digits there is no extra scale to absorb it (outlook.md section 4; business.md section 6). Energy, rented capacity, the low-margin chip hardware and a slowly rising price for search defaults all push the same way, so the offsets that hold the base case's margin flat are almost absent here. The target of 27% is reached in year five and sits six points below Damodaran's software industry average and a point above Alphabet's own 2022 low."
      source: "[10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2] [Q2 2026 call, p.11] [Q2 2026 call, p.13] [10-K FY2025, Item 8] [10-K FY2025, Note 1] [10-K FY2023, Item 8] [Damodaran margin.xls, Software (System & Application) and Advertising, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/margin.csv]"
      detail: |
        Where 27% sits. Inside the same distribution the base case uses (see the base margin detail for the full table): six points below Damodaran's Software (System & Application) row of 33.0% and far above his Advertising row of 10.1%, whose members are agencies and networks that sell other people's media [Damodaran margin.xls, Software (System & Application) and Advertising, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/margin.csv]; level with Alphabet's own FY2023 (27%) and a point above FY2022 (26%), its two worst years of the last five, which were earned with capital spending at only 10 to 11 per cent of revenue [10-K FY2023, Item 8]; three points below Damodaran's own 30% target for Alphabet in February 2024 [Damodaran notes, horizon and terminal, section 3d]. Growth spending inside operating expense, named before the path is set: research and development is 15.5% of revenue (68,974), of which the shared frontier-model research reported as Alphabet-level activities lost about 21,500 in the base year, 4.8% of revenue, and Other Bets lost about 8,900, 2.0% [10-K FY2025, Note 15] [10-Q Q2 2026, Note 15]. In this case that spending is not cut, because the company keeps chasing the frontier while the revenue disappoints.

        Starting point: the twelve-month margin is 33.1% and the first half of 2026 ran at 35.0% [10-Q Q2 2026, Item 1] [10-K FY2025, Item 8].

        The bridge, in points of revenue. Depreciation of property and equipment is the drag; the money paid for search distribution and the slower growth of every other cost are the offsets, and this case gives them little room.

        | Share of revenue | Trailing | Year 1 | Year 2 | Year 3 | Year 4 | Year 5 |
        |---|---|---|---|---|---|---|
        | Payments for traffic (distribution deals and partner sites) | 14.1 | 13.1 | 12.3 | 11.8 | 11.4 | 11.0 |
        | Depreciation of property and equipment | 5.7 | 7.4 | 10.7 | 13.7 | 14.9 | 16.2 |
        | Everything else | 47.1 | 46.7 | 46.4 | 46.0 | 45.8 | 45.6 |
        | Operating margin | 33.1 | 32.7 | 30.6 | 28.5 | 27.9 | 27.3 |

        Depreciation comes from this case's spending plan (see the sales-to-capital detail) and from the lives the company gives: servers and network equipment generally six years, data-centre and office buildings seven to 40 years, with about 60 per cent of technical-infrastructure spending going into servers and 40 per cent into data centres and networking equipment [10-K FY2025, Note 1] [Q2 2026 call, p.11]; the schedule adds about 11 cents of yearly depreciation for each dollar spent the year before, calibrated on the company's own record (depreciation rose 5,825 in 2025 on 52,535 of 2024 spending) [10-K FY2025, Item 8]. Payments for traffic are held at 20.0% of advertising revenue rising to 20.5% by year five, because this case assumes a distribution partner extracts more (business.md section 6, risk 4); the share of total revenue still falls because advertising shrinks from 70.7% to 53.6% of the company. Everything else, meaning every cost except those payments and depreciation, grows one point a year slower than revenue, easing to half a point by year five, against a like-for-like gap of 1.6 points in the June quarter (1.1 points once the legal charges in both years are removed) and 3.0 points in the first half of 2026; this case gives the company almost no operating leverage because energy, rented third-party capacity and the low-margin chip-system hardware all grow faster than sales [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2] [Q2 2026 call, p.13].

        The bridge gives 32.7, 30.6, 28.5, 27.9 and 27.3 per cent on the revenue the written growth path produces (each row of the table is rounded on its own, so a column can add to 99.9 or 100.1); the path is written as 33, 31, 28, 28 and 27, each the nearest whole point. Acquired-intangible amortisation runs about 0.2% of revenue and does not move the path [10-Q Q2 2026, Note 9]. The margin is held at 27% in years six to ten by rule; in this case's spending plan depreciation keeps climbing past 20% of revenue in those years, so holding 27% already assumes the company stops chasing the frontier and lets research and marketing shrink as a share of sales.

        The owner left this cell as drafted at the last save (33, 31, 29, 28, 27); this draft writes 28 for year three because the bridge gives 28.5%, the one change.
    sales_to_capital:
      value: 1.0
      value_late: 0.5
      reason: "Years one and two are set in money below, so this ratio drives years three to five: at 1.0 each dollar of net new investment brings in one dollar of new revenue, below four of the five years of Alphabet's own record once acquisitions and working capital are counted and the one-year lag is allowed for, and midway between the middle of that record (1.21) and the 0.82 the average US company manages, which is the bear in one number. Only 2022, when heavy acquisitions met the slow revenue year that followed, was lower at 0.90, but taken over the five years together this case reinvests at 0.56 dollars of new revenue per dollar, less than in any year of the record, which is what the story means by less than at any time in its history. From year six it falls to 0.5, because a business earning only its cost of capital has to reinvest more than half its profit to grow with the economy, and the late ratio is set so that year ten already spends at nearly that rate rather than jumping to it in the terminal year."
      source: "[10-K FY2023, Item 8] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [Damodaran capex.xls, Total Market and Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/capex.csv] [Damodaran notes, story-to-numbers playbook, section 4] [Damodaran notes, horizon and terminal, section 4]"
      detail: |
        The three candidates, measured the way the model spends (money spent in one year buys the revenue added the next; reinvestment is capital spending less depreciation of property and equipment, plus acquisitions, plus the working capital the year tied up, because from year three the ratio produces every kind of reinvestment at once):

        | Candidate | Figure | Where it comes from |
        |---|---|---|
        | The company's own lagged record, money spent 2021 to 2025 | 1.36, 0.90, 1.73, 1.09, about 1.21 (median 1.21, average 1.26); on capital spending alone 1.75, 1.36, 2.10, 1.42, about 1.22 (median 1.42, average 1.57) | cash-flow statements [10-K FY2023, Item 8] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] |
        | Last year's marginal ratio (2025 spending against the revenue added in the first half of 2026, annualised) | about 1.21 (about 1.22 on capital spending alone) | same |
        | Same-year ratios during the surge, not the comparison | 0.74 in 2025, 0.38 in the first half of 2026 (0.75 and 0.64 on capital spending alone) | same; depressed by construction because the revenue the spending buys has not arrived, and the first half of 2026 carries 33,697 of acquisitions (mainly Wiz and Intersect) and 7,739 of chip-system inventory |
        | Industry average, Software (System & Application), the true competitor set for Cloud and the AI business | 1.54 | [Damodaran capex.xls, Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/capex.csv] |
        | Industry average, Advertising (agencies and networks; the engine's diagnostics row) | 3.85 | same file, Advertising row |
        | All US companies (Total Market) | 0.82 | same file, Total Market row |
        | Damodaran's own input for Alphabet, February 2024 | 1.20 for all ten years | [Damodaran notes, horizon and terminal, section 3d] |

        The lagged record in full, with every part of reinvestment shown:

        | Money spent in | Capital spending less depreciation | Acquisitions | Working capital tied up | All reinvestment | Revenue added the next year | Ratio on all reinvestment | Ratio on capital spending alone |
        |---|---|---|---|---|---|---|---|
        | 2021 | 14,367 | 2,618 | 1,523 | 18,508 | 25,199 | 1.36 | 1.75 |
        | 2022 | 18,010 | 6,969 | 2,235 | 27,214 | 24,558 | 0.90 | 1.36 |
        | 2023 | 20,305 | 495 | 3,845 | 24,645 | 42,624 | 1.73 | 2.10 |
        | 2024 | 37,224 | 2,931 | 8,406 | 48,561 | 52,818 | 1.09 | 1.42 |
        | 2025 | 70,311 | 1,592 | -618 | 71,285 | about 86,060 | about 1.21 | about 1.22 |

        Working capital tied up is the sum of the cash-flow statement's 'changes in assets and liabilities' lines with the sign reversed, so cash paid out counts as money invested; 2025 released 618 because a 12,939 rise in accrued expenses and other liabilities outweighed the cash tied up in receivables, other assets and taxes. On all reinvestment the record's median is 1.21 and its average 1.26; on capital spending alone, the measure the previous draft used, 1.42 and 1.57. The 2025 line annualises the 43,030 of revenue added in the first half of 2026 [10-K FY2023, Item 8] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1].

        Where this case lands and why. The early ratio of 1.0 sits below four of the five years of the record and midway between its middle (1.21) and the Total Market figure (0.82); the one lower year is 2022 (0.90), when 6,969 of acquisitions met the slow revenue year that followed, 2023's 8.7% [10-K FY2023, Item 8]. The story is a company that has lost its pricing power and must buy compute to hold share, which is what Damodaran's own worked example does for a firm facing rising competition, setting the ratio 'well below the industry average and the firm's marginal sales to capital ratio' because it 'will have to invest increasing amounts' [Damodaran notes, story-to-numbers playbook, section 4]; 1.0 sits below the marginal 1.21 and the software industry's 1.54 on the same logic. The story's claim that each dollar invested earns less revenue than at any time in the company's history is true of the case as a whole rather than of years three to five on their own: years one to five together charge 522,000 of net investment for the 291,000 of revenue added in years two to six, a ratio of 0.56, and years six to ten run at 0.5, both below every year of the record. The late ratio of 0.5 is set by consistency with the terminal year rather than by the record: a firm earning exactly its cost of capital of 8.78% and growing at the 4.78% risk-free rate must reinvest 4.78 divided by 8.78, or 54%, of its after-tax operating profit forever; at 0.5 the company reinvests about 47% of after-tax profit in year ten, so the step into the terminal year is about 10%, the normal notch Damodaran's own sheets show. At the owner's saved 0.8 the engine's dry run puts year-ten reinvestment at 61,025 against after-tax operating profit of 206,821, about 30%, and the terminal-year cash flow at 98,728 against 145,796 in year ten, a step of about minus 32%, which the engine reports for the bear rather than flags, but which means the late ratio and the terminal return disagree [Damodaran notes, horizon and terminal, section 4]. 0.5 sits below the most capital-heavy row in his table (Telecom Services, 0.60) [Damodaran capex.xls, Total Market and Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/capex.csv]; that is deliberate, and it is what a business selling compute at its cost of capital looks like.

        What the ratios imply for spending, with depreciation from the same schedule as the margin bridge:

        | Model year | Net investment | Depreciation it carries | Gross capital spending | Share of revenue |
        |---|---|---|---|---|
        | 1 | 188,452 | 39,801 | 229,652 | 43% |
        | 2 | 178,714 | 65,063 | 245,000 | 40% |
        | 3 | 53,675 | 92,013 | 145,688 | 22% |
        | 4 | 50,723 | 108,039 | 158,762 | 22% |
        | 5 | 50,831 | 125,502 | 176,334 | 23% |

        So spending falls hard in year three, when the committed machines have arrived and demand has not, and then climbs back toward 30% of revenue and beyond in years six to ten because the low late ratio forces it; that last shape is the bear in a sentence, the treadmill never stops. Years three to five add to about 481,000 against 610,300 of purchase commitments that fall due beyond the next twelve months, so even this case honours most of what is already signed [10-Q Q2 2026, Item 2]. The implied return on capital check from the engine's dry run: about 17% to 18% in years three to five and about 14.5% in year ten, against an 8.78% terminal cost of capital, and against a software sector earning roughly 48% on capital (after-tax margin 31.2% times sales to capital 1.54) [Damodaran margin.xls, Software (System & Application) and Advertising, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/margin.csv] [Damodaran capex.xls, Total Market and Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/capex.csv]; the terminal return then steps to the cost of capital by rule.

        The owner's saved values were 1.1 and 0.8; this draft lands at 1.0 and 0.5. Now that the record counts acquisitions and working capital, the owner's 1.1 sits at Alphabet's own 2024 figure (1.09), inside the record and above two of its five years, so it describes a company reinvesting about as well as it did in its second-weakest year; 1.0 sits below four of the five years and at the midpoint between the record's middle and the average US company, which is where a company that has to buy compute to hold its share belongs. The difference is worth about 9% of years three to five net investment; the late figure differs for the terminal-consistency reason above.

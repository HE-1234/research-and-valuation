      reason: "Starts at the 16.8% rate the company actually paid on 2025 profits and rises to the 25% long-run rate by the end. Two forces push it up: the international agreement setting a 15% floor on the tax a large company pays in each country, and the shrinking United States deduction for income earned from serving customers abroad. The same path is used in every case, because tax law does not depend on which story comes true."
      source: "[10-K FY2025, Item 7]"
      detail: |
        FY2025 effective rate 16.8%, up from 16.4% in 2024 'primarily due to a decrease in the US Federal Foreign Derived Intangible Income tax deduction, a non-deductible EC fine and legal settlement in the US' [10-K FY2025, Item 7]. The OECD minimum tax of 15% is being adopted country by country and 'as more countries enact these global minimum tax rules, our effective tax rate and cash tax payments could increase' [10-K FY2025, Item 7]. Where the start sits: Damodaran's Software (System & Application) row carries an aggregate rate of 18.5% and the Total Market 20.0% [Damodaran taxrate.xls, Software (System & Application), dataset dated 2026-01-05, cached tools/valuation/data/damodaran/taxrate.csv]; his own Alphabet workbook of February 2024 ran 13.9% to 25% [Damodaran notes, horizon and terminal, section 3d]. The engine holds 16.8% for years one to five and moves it to 25% in equal steps over years six to ten.

scenarios:
  bear:
    weight: 0.25
    story: |
      People get used to asking an assistant instead of searching, the answers beside those
      assistants carry fewer and cheaper ads, and Search growth slides into the low single digits
      within a few years while YouTube and subscriptions slow with it. The cloud order book still
      converts because it is signed, but once customers have built their first AI systems little
      new work arrives, chip-system sales prove a one-off wave, and Cloud settles back to the pace
      of an ordinary cloud business. The machines Alphabet has already committed to buy keep
      arriving, and with no moat to protect its prices it has to keep buying compute just to hold
      its share, so each dollar invested earns less revenue than at any time in its history.
      Margins fall back to the lows of 2022 and 2023, this time with far more machinery, energy
      and rented capacity to pay for. At the end the moat is assumed gone: the business grows with
      the economy, pays the full tax rate, and earns exactly its cost of capital and not a cent more.

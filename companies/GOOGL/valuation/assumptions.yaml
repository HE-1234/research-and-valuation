schema: 1
ticker: GOOGL
company: Alphabet Inc.
as_of_quarter: 2026-Q2
as_of_date: 2026-07-23
drafted: 2026-09-07
currency: USD
units: millions
horizon: 5

base_year:
  period: "Q3 2025 – Q2 2026 (trailing twelve months ending June 30, 2026)"
  revenue:
    value: 445866
    source: "[10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]"
    reason: "The base year is the twelve months to June 30, 2026, so the model starts from what Alphabet has just earned rather than from a calendar year (business.md §2). It is the 2025 annual figure with the newest half-year swapped in for the year-earlier half-year."
    detail: |
      Trailing twelve months = FY2025 revenue 402,836 + six months to June 30, 2026 of 229,692 − six months to June 30, 2025 of 186,662 = 445,866. All three figures come from the consolidated statements of income [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1].
  operating_income_gaap:
    value: 147628
    source: "[10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]"
    reason: "Operating profit for the same twelve months, exactly as reported, which works out at 33.1% of revenue (business.md §3). The legal charges in the one-time items list below are deliberately left inside it, because charges like them arrive most years."
    detail: |
      Income from operations, trailing twelve months = FY2025 129,039 + 6M 2026 80,466 − 6M 2025 61,877 = 147,628 [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]. 147,628 / 445,866 = 33.1% (computed).
  one_time_items:
    - name: "EC advertising-technology fine, Q3 2025 (recorded, not added back)"
      value: 0
      source: "[10-K FY2025, Item 7] [10-Q Q2 2026, Note 10]"
      reason: "A $3.5 billion fine from the September 2025 European Commission ad-technology decision sits inside the base year's costs and is left there. Brussels has fined Alphabet at intervals since 2017, so §18.4 rule 1 treats these fines as a recurring cost of running this business rather than a one-off (business.md §6)."
      detail: |
        The charge sits in trailing-twelve-month general and administrative expense [10-K FY2025, Item 7] [10-Q Q2 2026, Note 10]. The run of EC fines: Shopping 2017, Android 2018, AdSense 2019, ad-tech 2025. Set this cell's value to 3500 to add the charge back instead.
    - name: "PriceRunner damages award, Q2 2026 (recorded, not added back)"
      value: 0
      source: "[10-Q Q2 2026, Item 2] [10-Q Q2 2026, Note 10]"
      reason: "A Stockholm court ordered Alphabet to pay PriceRunner damages, and the $1.5 billion of principal was charged to Google Services costs in Q2 2026; it is left in the base year. Legal accruals like this recur at Alphabet and the award is under appeal, so it is not treated as one-off (business.md §6)."
      detail: |
        Principal damages of $1.5 billion were accrued in G&A (Google Services) in Q2 2026 after the ruling; a further $581 million of interest and costs went to other income, outside operating income [10-Q Q2 2026, Item 2] [10-Q Q2 2026, Note 10]. The recent run of legal charges: a $1.4 billion accrual in Q2 2025, the EC fine in Q3 2025, this award in Q2 2026. Set this cell's value to 1500 to add it back.
    - name: "Waymo valuation-based compensation charge, Q4 2025 (recorded, not added back)"
      value: 0
      source: "[10-K FY2025, Item 7]"
      reason: "A $2.1 billion employee compensation charge for Waymo, based on estimated stock valuation and mostly in R&D, was recognized in Q4 2025. Not added back because it is stock-based pay, which §18.4 rule 1 says always stays expensed."
    - name: "Office space impairment, Q1 2026 (recorded, not added back)"
      value: 0
      source: "[10-Q Q1 2026, Item 2]"
      reason: "$300 million of office space impairment charges in Q1 2026 sales and marketing expense. Not added back: office-exit charges recurred in 2023 ($1.8 billion, business.md §3) and again here, and the amount is 0.07% of TTM revenue."
  amortization_of_acquired_intangibles:
    value: 793
    source: "[10-Q Q2 2026, Note 9]"
    reason: "This is the yearly write-down of technology and customer lists bought in acquisitions. It stays as a cost under §18.4 rule 1 and is recorded here only as a memo; at 0.2–0.3% of revenue it is far too small to bend the margin paths, whether it runs off or not."
    detail: |
      Trailing twelve months = 545 for the six months to June 30, 2026 (Wiz and Intersect closed in March 2026) + 248 for the second half of 2025 = 793 [10-Q Q2 2026, Note 9]. The second half of 2025 is not disclosed in the cached filings (the FY2025 10-K carries no intangible-assets table and the Q3 2025 10-Q is not cached), so it is taken at the Q2 2025 quarterly run-rate of 124 × 2 = 248; our inference. Disclosed expected amortization: 747 for the rest of 2026, 1,304 in 2027, then 1,142, 1,096 and 1,055, i.e. about 0.2–0.3% of revenue. Memo row; stays deducted.
  stock_based_compensation:
    value: 28147
    source: "[10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]"
    reason: "Pay handed out as shares, 6.3% of revenue in the base year. §18.4 rule 1 keeps it inside operating profit because it is a real cost to existing owners; this cell is only a memo (business.md §4)."
    detail: |
      Cash-flow statement SBC expense, trailing twelve months = FY2025 24,953 + 6M 2026 14,708 − 6M 2025 11,514 = 28,147 [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]. 28,147 / 445,866 = 6.3% of revenue (computed). Memo row; never added back.
  rnd_expense:
    value: 68974
    source: "[10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]"
    reason: "What Alphabet spent on research and development in the base year, 15.5% of revenue. Memo row only: the switch that would treat research as an investment rather than a cost is off (§18.4 rule 1)."
    detail: |
      Research and development, trailing twelve months = FY2025 61,087 + 6M 2026 35,251 − 6M 2025 27,364 = 68,974 [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]. 68,974 / 445,866 = 15.5% of revenue (computed). Used only if capitalize_rnd is turned on.
  effective_tax_rate:
    value: 0.168
    source: "[10-K FY2025, Item 7] [10-Q Q2 2026, Note 14]"
    reason: "The model starts from Alphabet's FY2025 tax rate of 16.8%, the cleanest recent measure of tax on ordinary profits (business.md §4). Rates computed from the newest quarters look higher only because enormous paper gains on investment stakes carry tax at the full statutory rate, and those gains have nothing to do with the operating business."
    detail: |
      FY2025: provision 26,656 on pre-tax income 158,826 = 16.8%, a rate that already includes a non-deductible EC fine [10-K FY2025, Item 7]. Alternatives considered: the trailing-twelve-month rate on the same basis is 18.4% (55,064 / 299,269), and the Q2 and six-month 2026 rates were 19.1%; all of them are pushed up by $99.0 billion of unrealized equity gains carrying deferred tax at the statutory rate [10-Q Q2 2026, Note 14].
  invested_capital:
    value: 516207
    source: "[10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 4] [10-Q Q2 2026, Note 6]"
    reason: "The capital the business has been handed: what shareholders and lenders put in, less the cash it is sitting on. It is used only for the return-on-capital check, and it understates that return, because it still contains large investment stakes that are not operating assets (business.md §4)."
    detail: |
      At June 30, 2026: total stockholders' equity 640,480 + debt 100,164 (long-term 98,165 plus current portion 1,999) + operating lease liabilities 18,037 − cash, cash equivalents and marketable securities 242,474 = 516,207 [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 4] [10-Q Q2 2026, Note 6]. Excluding the 131,461 of non-marketable securities and the 14,126 of restricted SpaceX shares held in other non-current assets gives 370,620 and a correspondingly higher ROIC.
switches:
  addback_acquired_amortization: false
  capitalize_rnd: false
  rnd_amortization_years: 5
  rnd_history: []

bridge:
  cash_and_marketable_securities:
    value: 162474
    source: "[10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 3]"
    reason: "The cash and investments Alphabet could turn into money at short notice, which the model adds to the value of the business. The SpaceX shares inside the balance-sheet total are excluded here because they cannot be sold yet; they are listed separately below."
    detail: |
      Balance-sheet cash, cash equivalents and marketable securities of 242,474 less the 80,000 of SpaceX shares that carry short-term sale restrictions (Note 3, footnote 1) = 162,474 [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 3]. What remains is 55,911 of cash and equivalents plus 106,563 of other marketable securities: 99,500 of government bonds, corporate debt and mortgage-backed securities, and 7,063 of other marketable equity, all sellable at short notice.
  debt:
    value: 100164
    source: "[10-Q Q2 2026, Note 6] [10-Q Q2 2026, Item 1]"
    reason: "Every dollar of borrowing on the balance sheet, at the value the accounts carry it at, subtracted from the value of the business. No commercial paper is outstanding (business.md §4)."
    detail: |
      Long-term debt 98,165 plus the 1,999 current portion of long-term notes held in accrued expenses = 100,164 [10-Q Q2 2026, Note 6] [10-Q Q2 2026, Item 1]. Face value is 101,085; the 921 difference is unamortized discount and issuance costs, and the notes' estimated fair value was 94,900. The total includes 1,686 of other long-term debt; the 10-Q does not say whether the 1,300 drawn on credit facilities is part of it.
  operating_lease_liabilities:
    value: 18037
    source: "[10-Q Q2 2026, Note 4]"
    reason: "Rent Alphabet has already committed to on buildings and data centers it leases, treated as debt-like and subtracted from value. Data-center leases that are signed but have not started are not liabilities yet and belong to the reinvestment story instead."
    detail: |
      Current 3,446 (in accrued expenses) + non-current 14,591 = 18,037 [10-Q Q2 2026, Note 4]. The excluded signed-but-not-commenced leases carry 85,200 of future payments.
  non_operating_assets:
    - name: "SpaceX shares under short-term sale restrictions (inside marketable securities)"
      value: 80000
      source: "[10-Q Q2 2026, Note 3]"
      reason: "Shares in SpaceX that Alphabet holds inside its marketable securities at fair value, meaning the price they would fetch if sold today. They are kept out of the cash line because they cannot be sold yet, so they are added to the value of the business separately."
      detail: |
        Note 3 footnote 1 reads 'Includes $80.0 billion of Space Exploration Technologies Corp. (SpaceX) shares subject to short-term restrictions on the ability to sell.' [10-Q Q2 2026, Note 3]. The carrying value comes from the $99.0 billion revaluation of the equity portfolio in Q2 2026.
    - name: "Marketable equity securities in other non-current assets (includes $14.1B SpaceX shares restricted through Q3 2027)"
      value: 14126
      source: "[10-Q Q2 2026, Note 3]"
      reason: "A second block of SpaceX shares, held among other non-current assets, the accounting label for assets not expected to turn into cash within a year. It is carried at fair value, the price it would fetch today, and it sits outside the balance-sheet cash total, so it is added separately."
      detail: |
        Note 3 lists 14,126 of marketable equity securities within other non-current assets, footnoted as including $14.1 billion of SpaceX shares under long-term sale restrictions through the third quarter of 2027 [10-Q Q2 2026, Note 3]. This sits outside the 242,474 cash total.
    - name: "Non-marketable securities (private companies, including the unnamed private company; equity-method stakes)"
      value: 131461
      source: "[10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 3]"
      reason: "Stakes in private companies, added to value separately because they are not part of the advertising and cloud business (business.md §7). The figure is what the last funding rounds implied rather than a market price, so the owner may want to mark it down."
      detail: |
        Balance-sheet carrying value 131,461 = 124,259 held under the measurement alternative (of which 87,900 was re-marked to fair value in Q2 2026, primarily the private company the 10-Q does not name) + 7,202 of equity-method and other investments [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Note 3]. Excluded: the remaining 20,000 milestone-based funding commitment to that private company, an equity derivative carried as a 457 fair-value liability, because money paid out would buy more shares and so is not a claim on today's value.
  minority_interests:
    value: 7100
    source: "[10-Q Q2 2026, Note 7]"
    reason: "The book value of the slices of subsidiaries such as Waymo that outside investors own, subtracted because that share of the profits is not Alphabet's. Accountants call them noncontrolling interests, meaning stakes too small to control the subsidiary; 824 of the total is redeemable, meaning those holders can require Alphabet to buy them out."
    detail: |
      Total noncontrolling interests in consolidated subsidiaries were $7.1 billion at June 30, 2026, including 824 redeemable [10-Q Q2 2026, Note 7]. The 10-Q states the total in billions, so 7,100 is rounded.
  other_claims:
    - name: "6.25% mandatory convertible preferred stock (liquidation preference)"
      value: 19250
      source: "[10-Q Q2 2026, Note 11] [8-K 2026-06-05 (preferred)]"
      reason: "In June 2026 Alphabet sold preferred shares that get paid before ordinary shareholders and turn into ordinary shares in May 2029. They are subtracted here at the amount their holders are owed first, which is simpler and slightly more conservative than adding the future shares to the share count."
      detail: |
        Count: 385 million depositary shares (167.5 million per series plus the 25 million over-allotment option per series, exercised in full), each a 1/20th interest in a preferred share, = 19.25 million preferred shares × $1,000 liquidation preference = 19,250 [10-Q Q2 2026, Note 11] [8-K 2026-06-05 (preferred)]. The 10-Q rounds the count to 19 million and carries the shares at 18,023 in equity after issuance costs and a 1,000 capped-call premium. Holders receive 6.25% cumulative dividends, about 1,200 a year and roughly 3,000 of present value over the three years to conversion; that dividend stream is not separately valued here. Conversion on or about May 15, 2029 is at 2.2520–2.8160 (Series A) or 2.2740–2.8420 (Series B) common shares per preferred share. Alternative considered: add roughly 43–54 million shares to the count instead. The Q2 diluted count already includes 16 million shares from a partial-period if-converted treatment, a small overlap.
    - name: "Finance lease liabilities"
      value: 2590
      source: "[10-Q Q2 2026, Note 4]"
      reason: "Equipment and space Alphabet has effectively bought on credit through leases. Debt-like, and not counted in the debt or operating-lease lines above, so it is subtracted here."
      detail: |
        449 current + 2,141 non-current = 2,590 [10-Q Q2 2026, Note 4].
    - name: "Accrued legal and regulatory fines and settlements"
      value: 17356
      source: "[10-Q Q2 2026, Note 7] [10-Q Q2 2026, Item 2]"
      reason: "Fines already charged against past operating profit but not yet paid, 'primarily' EC fines; $5.2 billion of it (the Android fine plus interest) was paid in July 2026. Cash that will leave without buying anything, so it is treated like debt. Future fines are inside the forecast margins, because the one-time items listed in the base year are left inside operating profit."
    - name: "Data-center backstop credit derivatives, at fair value"
      value: 815
      source: "[10-Q Q2 2026, Note 3] [10-Q Q2 2026, Note 10]"
      reason: "Alphabet has promised to cover other companies' data-center payments if they default, and the liability it records for those promises is subtracted here. The worst case is far bigger than the recorded number, which is why the line is worth the owner's attention (business.md §6)."
      detail: |
        Recorded fair value 815; the notional (maximum) exposure is 43,785 [10-Q Q2 2026, Note 3] [10-Q Q2 2026, Note 10]. Not included: 7,600 of energy-equipment guarantees, whose fair value the 10-Q calls not material, and an estimated 24,100 of backstops still being finalized, which are not yet obligations.
  probability_of_failure:
    value: 0.0
    reason: "Zero: Alphabet holds far more spendable cash and securities than debt, earns a large operating profit every quarter, and has just shown it can raise money at will. Failure inside the five-year window is not a realistic case (business.md §4)."
    detail: |
      162,474 of unrestricted cash and securities against 100,164 of debt and 147,628 of trailing-twelve-month operating income; $56 billion of notes and $49.6 billion of equity were raised in the first half of 2026 alone.
  distress_proceeds:
    value: 0
    reason: "Not needed with probability of failure at zero."
  diluted_shares:
    value: 12309
    source: "[10-Q Q2 2026, Note 12]"
    reason: "The share count the per-share value is divided by: the latest quarter's average share count as the accountants compute it, including shares owed on employee awards and the new preferred. Shares sold in June 2026 count only for the part of the quarter they existed, which is why the period-end count is a little higher."
    detail: |
      Q2 2026 diluted weighted-average shares, consolidated: 12,309 million = 12,151 basic + 142 RSUs and other contingently issuable shares + 16 from the preferred under the if-converted method [10-Q Q2 2026, Note 12]. Period-end common shares outstanding were 12,230 million. The June sales were roughly 87 million shares: the 10-Q rounds them to 29 + 29 + 14 + 14 million, and the 8-K's 25.46 million per class plus the fully exercised 3.82 million over-allotment option per class and 28.57 million private-placement shares total 87.1 million [8-K 2026-06-04].
  dilution_note: "A $40.0 billion at-the-market program was set up in June 2026 and was unused at June 30; the CFO said it will run 'for some period of time' to cover tax on stock-based pay [Q2 2026 call, p.18] [10-Q Q2 2026, Item 2]. The preferred converts into about 43–54 million common shares in May 2029, partly offset by capped calls [10-Q Q2 2026, Note 11]. Buybacks that used to absorb employee stock issuance were zero in the first half of 2026 [10-Q Q2 2026, Note 11]."

market:
  price: auto
  risk_free_rate: auto
  equity_risk_premium: auto
  mature_market_erp: 0.045
  marginal_tax_rate: 0.25

cost_of_capital:
  method: build
  pinned_value: null
  build:
    damodaran_industry:
      value: "Advertising"
      reason: "Advertising is the industry group used for the risk measure, because ads are just over 70% of revenue and their economics drive the profit (business.md §2). Cloud is the fast-growing minority with different economics, so the owner may want the planner to test a software group as well."
      detail: |
        Advertising was 70.7% of trailing-twelve-month revenue: 315,348 of 445,866, being Search & other, YouTube ads and Network [10-K FY2025, Item 7] [10-Q Q2 2026, Note 2]. Google Cloud is 17.4% of revenue and growing about 80% a year, with economics closer to 'Software (System & Application)' or 'Computer Services'. 'Software (Internet)' is a reasonable whole-company alternative and the planner may compare both betas.
    unlevered_beta:
      value: 1.008
      source: "[Damodaran betas.xls, Advertising, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/betas.csv]"
      reason: "Damodaran's advertising-industry beta of about 1.0 means Alphabet's operating profits are assumed to swing roughly in line with the market's, which is what sets the cost of capital. Treating Alphabet as an internet-software company instead would raise that cost by about two and a half points, a test the owner can run."
      detail: |
        1.0080 is the cash-corrected unlevered beta of his 52-company US Advertising group [Damodaran betas.xls, Advertising, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/betas.csv]. The whole-company alternative 'Software (Internet)' is 1.591, worth about 2.4 points on the cost of capital; testable with --set.

    debt_to_equity_market:
      value: 0.0284
      source: "[10-Q Q2 2026, Note 6] [10-Q Q2 2026, Note 4] [10-Q Q2 2026, Note 12] [Yahoo price 338.46 on 2026-09-04]"
      reason: "Borrowing is under 3% of what the market says Alphabet's shares are worth, even after the 2025–2026 bond sales, so debt barely moves the cost of capital (business.md §4). This ratio is what levers the industry beta up."
      detail: |
        Debt 100,164 plus operating lease liabilities 18,037 = 118,201 (120,791 if finance leases are added), divided by market capitalisation of 4,166,104 (338.46 × 12,309 million diluted shares) = 0.0284 [10-Q Q2 2026, Note 6] [10-Q Q2 2026, Note 4] [10-Q Q2 2026, Note 12] [Yahoo price 338.46 on 2026-09-04].

    pretax_cost_of_debt:
      value: 0.048
      source: "[10-Q Q2 2026, Note 6] [10-K FY2025, Item 7]"
      reason: "4.8% is what long-dated dollar borrowing costs Alphabet today, taken from the coupon on its most recent large dollar bond sale. Dollar coupons are used because the model discounts dollar cash flows."
      detail: |
        The $20.0 billion of US-dollar notes issued in Q1 2026 carry a weighted-average coupon of 4.80% with a 15-year average maturity [10-Q Q2 2026, Note 6]. For comparison: the 2025 US-dollar notes were issued at 4.89% and 4.92%, and effective interest rates on the 2025–2026 dollar notes run 3.93%–5.84% [10-K FY2025, Item 7]. The euro, sterling, franc, Canadian-dollar and yen notes carry local-currency coupons of 1.06%–5.31% and are not comparable.
  terminal:
    method: mature
    value: null
    reason: "Default: after the forecast Alphabet is priced like a mature company, cost of capital = risk-free rate + the 4.5% mature-market premium."

diagnostics:
  final_year_market_size:
    value: null
    source: "[Q2 2026 call, p.22]"
    reason: "Left empty: no cached filing, release, slide or transcript puts a dollar size on global digital advertising or cloud spending, and §3 rule 1 forbids inventing one. Management said only that the AI shift 'is an expansion of our total addressable market'."
    detail: |
      For the 'is it possible' test the reviewer can compare year-5 revenue (base 833,179; bull 972,900) with trailing-twelve-month revenue of 445,866 and the Cloud backlog of 513,900 [10-Q Q2 2026, Note 2]. The management wording is from [Q2 2026 call, p.22].
  historical_revenue_cagr:
    value: 0.118
    source: "[10-K FY2023, Note 2] [10-K FY2025, Item 7]"
    reason: "Alphabet's own revenue grew about 11.8% a year over the five fiscal years 2021–2025, which is the yardstick the scenario growth paths should be judged against (business.md §2)."
    detail: |
      From the five-year table in business.md §2: total revenue 257.6 billion in FY2021 and 402.8 billion in FY2025, which is four years of compounding. (402.8 / 257.6) ^ (1/4) − 1 = 0.118 (computed). Sources as given by that table: FY2021–FY2023 [10-K FY2023, Note 2]; FY2024–FY2025 [10-K FY2025, Item 7].
  historical_operating_margin:
    value: 0.296
    source: "[10-K FY2023, Item 7] [10-K FY2023, Item 8] [10-K FY2025, Item 7] [10-K FY2025, Item 8]"
    reason: "Alphabet averaged a 29.6% operating margin over the same five fiscal years, so the base case's 30–33% assumes it holds a little above its own recent average (business.md §3)."
    detail: |
      GAAP operating margins from the five-year table in business.md §3: 31% in FY2021 (computed), 26% FY2022, 27% FY2023, 32% FY2024, 32% FY2025. Simple average = (31 + 26 + 27 + 32 + 32) / 5 = 29.6%. The 2022–2023 dip carried severance and office-exit charges ($2.1 billion and $1.8 billion in 2023). Sources as given by that table: FY2021–FY2023 [10-K FY2023, Item 7] [10-K FY2023, Item 8]; FY2024–FY2025 [10-K FY2025, Item 7] [10-K FY2025, Item 8].

scenarios:
  bear:
    weight: 0.25
    story: |
      People increasingly ask chat assistants instead of searching, and the ads next to those answers pay less, so Search growth slides into the low single digits within a few years. Alphabet keeps spending on the data centers it has already ordered, so capital spending still rises in 2027 as management promised, and the machines arrive and depreciate just as Cloud demand cools once customers have built their first AI systems; the heavy spending never earns its keep and is cut back only afterwards. Operating margins fall below the 2022–2023 lows, this time with far more machinery to pay for. At the end of the five years the moat is assumed gone and the business earns only its cost of capital.
    revenue_growth:
      values: [0.15, 0.09, 0.06, 0.04, 0.03]
      reason: "Year 1 still grows 15%, because the cloud orders already signed and the chip-system sales due in 2027 are largely locked in (outlook.md §3–§4). Growth then drops below even the 2022–2023 lows: AI answers eat into searches, cloud demand cools once customers have built their first AI systems, and the cost of Alphabet's search defaults creeps up (business.md §6, risks 1 and 5)."
      detail: |
        History as in the base case. Year 1 leans on the Cloud backlog of 513,900, just over half of it due within 24 months and largely contracted, plus TPU system sales landing in 2027 [10-Q Q2 2026, Note 2] [Q2 2026 call, p.12–13]. Search & other is assumed to slow sharply from 17%. Years 2–5 sit below the 2022–2023 troughs of 9.8% and 8.7% as the backlog is worked through, Cloud demand normalizes and the TAC rate rises [10-K FY2023, Item 8] [10-K FY2025, Item 7].
      source: "[10-Q Q2 2026, Note 2] [Q2 2026 call, p.12–13] [10-K FY2025, Item 7] [10-K FY2023, Item 8]"
    operating_margin:
      values: [0.31, 0.28, 0.26, 0.24, 0.23]
      reason: "Margins fall below the 2022 low, this time with far more machinery to pay for: depreciation on data centers already ordered keeps climbing while revenue barely grows, and energy, rented capacity and the price of search defaults all push the wrong way (outlook.md §4; business.md §5–§6). With growth of 3–9% a year there is no extra scale to offset any of it."
      detail: |
        Starting point: trailing-twelve-month GAAP margin 33.1%, against FY2022–2023 margins of 26–27% earned with capex at only 10–11% of revenue (business.md §3 table) [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [10-K FY2023, Item 8]. On this case's capex path (200,000 in 2026 and about 239,000 of committed spending in 2027, cut back only afterwards; see the reinvestment override row) depreciation of property and equipment rises from 5.7% of trailing revenue to about 9% in year 2 and 16% by year 5, because revenue grows slowly: a headwind of roughly 10 points. The depreciation schedule assumes 60% servers over six years and 40% data centers and network over 20 years, management's 60/40 split [Q2 2026 call, p.11] [Q2 2026 call, p.13–14]. Acquired-intangible amortization is 0.2% of revenue and immaterial to the path.
      source: "[10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [Q2 2026 call, p.11] [Q2 2026 call, p.13–14] [10-K FY2023, Item 8]"
    sales_to_capital:
      value: 0.6
      value_late: 0.9
      reason: "0.6 rising to 0.9 says each dollar of net new investment buys well under a dollar of new revenue: in this case the machines keep arriving and the revenue does not (business.md §6, risk 2). Years 1–2 are set in dollars in the reinvestment override row, so this ratio drives years 3–5 only."
      detail: |
        History as in the base case. What differs: the bear's 0.6 sits below even the latest same-year figure of 0.64, and 0.9 late assumes spending finally slows.
      source: "[10-K FY2023, Item 8] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1]"
    reinvestment_override:
      values: [173970, 187000, null, null, null]
      reason: "Years 1 and 2 are set in dollars rather than by ratio, because the spending is already committed: management has guided 2026 capital spending and said 2027 will rise significantly. The bear keeps that spending, so the machines arrive and then under-earn, and cuts back only from year 3 (outlook.md §4; business.md §6)."
      detail: |
        Working as in the base case. What differs: the bear keeps the committed spending, behind which sit $811.0 billion of purchase commitments and $85.2 billion of signed-but-not-started leases, so the machines arrive and then under-earn [10-Q Q2 2026, Item 2] [10-Q Q2 2026, Note 9]. Years 3–5 fall back to sales-to-capital, which implies gross capex cut to roughly 120–130B a year as demand disappoints; that cut is a scenario assumption, not guidance. Acquisitions and working capital are ignored.
      source: "[Q2 2026 call, p.11] [Q2 2026 call, p.13] [10-K FY2025, Item 8] [10-Q Q2 2026, Item 1] [10-Q Q2 2026, Item 2] [10-Q Q2 2026, Note 9]"
    tax_rate:
      start: 0.168
      terminal: 0.25
      reason: "Starts at the FY2025 effective rate of 16.8% and moves to the 25% marginal rate by the terminal year, as the model requires. Two forces point the rate up over time: the OECD agreement that sets a 15% floor on the tax a big company pays in each country, and the shrinking US deduction for income earned from serving customers abroad [10-K FY2025, Item 7]."

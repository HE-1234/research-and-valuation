      - item: FY2028 direction
        quote: We expect, in fact, 2028 to be a substantial growth from what we are forecasting in 2027.
        source: '[Q2 FY2026 call]'
        used_as: not numeric
      - item: Q3 chip revenue
        quote: We forecast semiconductor revenue of approximately $20.5 billion, up 124% year-on-year.
        source: '[Q2 FY2026 call]'
        used_as: near-term segment check, not a full-year target
      - item: Q3 software revenue
        quote: We expect Q3 infrastructure software revenue of approximately $8.9 billion, up 31% year-on-year.
        source: '[Q2 FY2026 call]'
        used_as: software year 1 check, annual completion is analyst judgment
      - item: Q3 older-chip revenue
        quote: in Q3 we forecast non-AI semiconductor revenue to be approximately $4.5 billion, up 12% year-on-year.
        source: '[Q2 FY2026 call]'
        used_as: older-chip year 1 check
      - item: Q3 gross margin
        quote: we expect Q3 consolidated gross margin to be down to approximately 74%.
        source: '[Q2 FY2026 call]'
        used_as: 'not numeric: non-GAAP mix check only'
      - item: FY2026 tax
        quote: We expect the non-GAAP tax rate for Q3 and fiscal year 2026 to be approximately 16%
        source: '[Q2 FY2026 call]'
        used_as: tax normalization context; no permanent 16% assumption
      - item: Q3 diluted shares
        quote: We expect the non-GAAP diluted share count in Q3 to be approximately 4.94 billion shares, excluding the impact of potential share repurchases.
        source: '[Q2 FY2026 call]'
        used_as: 'not numeric: latest reported GAAP diluted shares remain denominator'
      - item: OpenAI timing
        quote: we are on track for production late 26.
        source: '[Q2 FY2026 call]'
        used_as: not numeric
      - item: Meta delivery
        quote: we expect to deploy 3 gigawatts through the end of 2028.
        source: '[Q2 FY2026 call]'
        used_as: not numeric
      - item: Two other customers
        quote: we expect shipments to begin in late 2026 and accelerate into 2027.
        source: '[Q2 FY2026 call]'
        used_as: not numeric
      - item: Networking milestone
        quote: We will now be taping out our next-generation 200-terabit switch this quarter.
        source: '[Q2 FY2026 call]'
        used_as: not numeric
      - item: AI networking mix
        quote: closer to around 30%
        source: '[Q2 FY2026 call]'
        used_as: 'not numeric: direction only; no separate networking revenue build'
      - item: Platform ambition
        quote: deploy more than 20 gigawatts of compute capacity through 2028.
        source: '[Q2 FY2026 call]'
        used_as: 'not numeric: financing/platform capacity is not Broadcom chip revenue'
      - item: Software direction
        quote: we expect that to continue, I guess, for the next multiple quarters as this demand picks up.
        source: '[Q2 FY2026 call]'
        used_as: not numeric
      - item: Garbled half-year growth
        quote: In the second half of 2026, we expect AI semiconductor revenue to double from the first half
        source: '[Q2 FY2026 call]'
        used_as: 'not numeric: inconsistent machine-transcript arithmetic; use explicit fiscal target wording instead'
      - item: OpenAI deployment commitment
        quote: We have a contractual commitment to deploy 1.3 gigawatts in 2027 as part of the larger 10-gigawatt that 2029 agreement we announced last year.
        source: '[Q2 FY2026 call]'
        used_as: 'not numeric: verbatim machine-transcript wording; no GW-to-revenue conversion or additive backlog'
      - item: Meta initial order timing
        quote: An initial order for 1 gigawatt, which includes XPUs and our networking, has been received and will start delivery in the second half of 2027.
        source: '[Q2 FY2026 call]'
        used_as: 'not numeric: program context already within AI scenario path'
      - item: Two other customers purchase orders
        quote: To date, we have received purchase orders totaling $6 billion.
        source: '[Q2 FY2026 call]'
        used_as: 'not numeric: call wording only; not added on top of aggregate AI guidance or commitments'
      - item: Anthropic 2026 compute access
        quote: For Anthropic, as you know, for 2026, we are providing access to Broadcom for TPU-based compute of over 1 gigawatt.
        source: '[Q2 FY2026 call]'
        used_as: 'not numeric: preserve transcript wording; no chip-content/GW inference'
      - item: Anthropic 2027 compute access; discrepancy unresolved
        quote: In April, we entered into an agreement to enable Anthropic to access another 5 gigawatts of next-generation TPU-based compute beginning in 2027.
        source: '[Q2 FY2026 call]; [8-K April6]'
        used_as: 'not numeric: April filing states approximately 3.5 GW through Broadcom; call says another 5 GW with unexplained scope difference; neither amount is converted to additional revenue'

  method: build
  pinned_value: null
  build:
    damodaran_industry:
      value: Semiconductor
      reason: 'Semiconductors dominate the forward revenue mix, so that industry anchors shared business risk. Software is a stabilizing minority rather than a reason to assign separate arbitrary scenario rates. [10-Q Q2 FY2026] '
      source: '[10-Q Q2 FY2026]'
      detail: 'The base grows from 47,762/75,465=63.29% semiconductor TTM sales toward more than 80% in the final year. The selected industry has a useful fabless/hardware exposure but does not reproduce Broadcom’s software mix. A revenue-weighted software beta would require consistent separately sourced populations; use one clearly identified group here. Country shipment shares do not identify final operating-country risk: China shipment 17% is expressly not end-customer exposure, so no invented country-risk surcharge is added. [10-K FY2025; 10-Q Q2 FY2026]'
    unlevered_beta:
      value: 1.5046492754744247
      reason: Use the cached Semiconductor industry beta as the shared risk proxy because chips dominate the forecast mix. It is an industry average, not a company-specific measured beta. [Damodaran betas January 2026, Semiconductor]
      source: '[Damodaran betas January 2026, Semiconductor]'
      detail: "\nRunner dataset fill: cash-corrected unlevered beta 1.5046492754744247; betas.xls dated 2026-01-05, cached 2026-09-07. Exact row Semiconductor. Original URL and cache date: tools/valuation/data/damodaran/MANIFEST.md."
    debt_to_equity_market:
      value: 0.037223583906638956
      reason: Reported debt is about 3.7% of current market equity on the draft’s rental basis. The separately dated share price sets financing weights only. [Valuation market inputs September 2026; 10-Q Q2 FY2026]
      source: '[Valuation market inputs September 2026; 10-Q Q2 FY2026, balance sheet and Note 5]'
      detail: "Operating leases are excluded on both sides under the rent convention. This market input affects financing weights only; no operational choice was made to achieve a price-relative answer.\nRunner arithmetic: (64907 debt + 0 debt-like lease adjustment) / (357.61 USD per share x 4876 million diluted shares) = 0.037223583907. Yahoo price observed 2026-09-18 16:00 EDT; direct fetch without valuation. Current financing weights are distinct from the June 9 operating cutoff. This uses the draft's disclosed lease/debt accounting basis."
    pretax_cost_of_debt:
      value: 0.057
      reason: Use a rounded current borrowing-cost estimate by carrying forward the latest ten-year issuance spread over Treasuries. It is a supported proxy, not an observed current bond yield or an extra penalty for operating risk. [January 2026 debt issue; Treasury debt proxy]
      source: '[January 2026 debt issue]; [Treasury debt proxy]'
      detail: |
        Observed January 2026 ten-year note coupon 4.95% and same-tenor DGS10 on January 6/pricing and January 13/closing 4.18% imply a coupon-minus-Treasury proxy of 0.77 percentage points. Adding that proxy to the separately dated current DGS10 of 4.94% gives 5.71%, rounded to a 5.7% forecast cost of debt. Coupon differs from yield if issue price/fees matter, and the credit spread may have changed, so this is explicitly a financing judgment. [January 2026 debt issue; Treasury debt proxy]

        A roughly 0.5–1.25-point current spread would imply 5.44–6.19%;5.7% places the estimate near the recent same-tenor observation, consistent with cash generation and an unused revolver while retaining a positive credit spread. The range is an analyst uncertainty band, not a quoted market range. A current traded yield, new debt issue or evidence of changed credit risk should replace it; there is no scenario-specific surcharge for customer losses already in cash flow. [10-Q Q2 FY2026, Note6; Treasury debt proxy]
  terminal:
    method: mature
    value: null
    reason: Use the house mature-company convention of the current dollar risk-free rate plus a 4.5-point mature equity premium, shared by all scenarios. This is a normal-risk assumption, not a forecast of future bond yields. [Market inputs]
    detail: DGS10 on 2026-09-17 is 4.94%; mature ERP is the house 4.5%; current terminal WACC=9.44%. Separately dated current ERP4.09% is used in the initial build. Semiconductor cyclicality stays in operating cases; expected lost orders are not charged again as arbitrary WACC premiums. If long-run business risk cannot reasonably mature, use a separately justified hold/value treatment. [Market inputs; Uncertainty method]

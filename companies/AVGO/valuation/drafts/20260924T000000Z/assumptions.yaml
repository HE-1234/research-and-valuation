        | 7 / 2033 | 277,000 | 26,600 | 303,600 | 60,500 | 364,100 | 7.0253% |
        | 8 / 2034 | 293,000 | 27,400 | 320,400 | 63,000 | 383,400 | 5.3007% |
        | 9 / 2035 | 307,000 | 28,000 | 335,000 | 65,100 | 400,100 | 4.3558% |
        | 10 / 2036 | 320,000 | 28,600 | 348,600 | 67,000 | 415,600 | 3.8740% |

        Every segment sum is exact; growth ratios are stored to 10 decimals solely to reproduce the rounded revenue totals, with less than 0.01 of cumulative rounding. Years 6–10 are explicit because customer bargaining and the maturing product mix need a slower cost/growth path than holding year-five margins constant. No undisclosed chip quantity, price per gigawatt, new backlog or platform financing is added to sales.

        Year-five revenue 313,700; final-year revenue 415,600, with semiconductor 83.9% and software 16.1%. Against the broad 2036 non-memory ceiling 1,438,757, chips would be 24.2%; AI alone would be 36.2% of a similarly extrapolated logic ceiling 883,293. This large-share requirement is a plausibility test, not demonstrated market access. WSTS only forecasts through 2027;6% subsequent growth is an analyst assumption, and 3–9% alternatives materially change the denominator. [WSTS spring 2026]

        Software ends at 67,000, compared with Microsoft PBP’s observed FY2025 revenue 120,810 and 13.10% growth, and Cisco’s total 56,654 with 5.30% growth including more Splunk. Those broader businesses establish an order of magnitude and mature growth outcomes; they do not prove VMware’s addressable market. The proposed software path requires retention through successive renewals and slows to 2.92% in year 10. [Mature benchmark evidence; MSFT FY2025 10-K; CSCO FY2025 10-K]


        Current AI-chip leader scale check: NVIDIA reported FY2026 revenue 215,938 and Q1FY2027 revenue 81,615 against 44,062 a year earlier; reconstructed TTM=215,938+81,615-44,062=253,491. Its latest-quarter Data Center revenue is 75,200. These releases were published February 25 and May 20,2026, before the cutoff. This case’s final Broadcom consolidated revenue 415,600 is 1.64 times that observed NVIDIA TTM; final semiconductor revenue 348,600 is 1.38 times it. This is a present-scale comparison against a rapidly growing leader, not a forecast that NVIDIA stops growing or a claim of mature margins/market size. NVIDIA sells compute platforms, networking and systems alongside chips; Broadcom’s call describes its revenue as chips, so supply-chain scope differs. No future share is inferred from this ratio. [NVDA FY2026 release; NVDA Q1 FY2027 release; Q2 FY2026 call]


        Year-five demand check uses 2031, four years after the WSTS2027 observation, rather than the year-ten denominator. At the same 6% analyst continuation the non-memory ceiling is 1,075,123 and logic ceiling 660,048; year-five chip revenue 259,700 is 24.2% of the first and AI235,000 is 35.6% of the second. Year-five mix is 82.8% chips and 17.2% software; total 313,700. These are broad ceiling proportions, not market-share forecasts, and the 3–9% continuation uncertainty and product-scope limitations remain. [WSTS spring 2026]

        Software demand check starts with the existing 27,703 TTM software business rather than an invented market. Its large-enterprise/mainframe/VMware installed base provides recurring workloads; the call reports 17% ARR growth, while recognized Q2 sales grew 9% and Q3 guidance implies 31%. Upfront recognition of noncancelable multiyear licenses makes sales and annualized recurring demand different measures. Customer renewal/retention rates, customer counts and software ARR dollars are not disclosed, so none is fabricated. [10-K FY2025, Items1/7 and Note2; 10-Q Q2 FY2026, Note9; Q2 FY2026 call]

        For this case, a transparent operating range lets normalized spending across the existing franchise plus net new business compound 12%–17% for five years, then 3%–8% for five more. These are analyst scenario ranges anchored below or around the observed 17% ARR expansion, not retention disclosures or management guidance. They imply year-five equivalent software revenue 48,822–60,737 and year-ten 56,598–89,243; the selected 54,000/67,000 requires five-/ten-year CAGR14.28%/9.23%. Recognition can make individual years depart from the normalized path; the near-term guided quarter and subscription conversion support that timing, not perpetual 31% growth.

        The upside range requires broad renewal acceptance, more workloads on the platform and continuing new-customer or spending expansion through multiple cycles; it is demanding, rather than assured by existing contracts. These conditions are grounded in the disclosed switching role and recurring software franchise, while the filing also warns customers may reject subscription licensing or move workloads to public cloud. Persistent ARR growth below the case’s normalized range, weaker recognized sales after contract timing normalizes, customer migration or adverse contracting changes would invalidate the demand check. The band is a falsifiable expansion of the current business, not a precise 2036 TAM; absent renewal counts limit confidence. [10-K FY2025, Item1; 10-Q Q2 FY2026, Item1A; Q2 FY2026 call]

        Every company-growth decline greater than three percentage points is identified below. These are reasons for the analyst’s timing judgments, not newly sourced events. [Q2 FY2026 call; 8-K April6; QCOM FY2025 10-K]

        | Model years | Company growth | Growth in slowing components, destination year | Operating mechanism |
        | --- | --- | --- | --- |
        | 1→2 | 84.19%→40.65% | AI 58.82%; software 14.29% | The first ramp is already in the comparison base; this year adds AI programs to a much larger sales level instead of repeating the initial step from the smaller TTM base. |
        | 2→3 | 40.65%→23.79% | AI 29.63%; software 12.50% | The first large deployment wave stops dominating growth; follow-on orders and capacity absorption replace initial installations, and subscription conversion contributes less incremental software growth. |
        | 3→4 | 23.79%→17.15% | AI 20.00%; software 11.11% | This window extends beyond the call’s stated 2028 visibility: repeat design wins increasingly replace first deployments, buyers gain negotiating power, and software additions slow with its installed-base maturity. |
        | 4→5 | 17.15%→10.65% | AI 11.90%; software 8.00% | The window approaches the Google agreement’s up-to 2031 term; continued business must be won again rather than treated as conversion of today’s finite commitments, while software contract conversion is largely behind it. |

    detail: Cash at May 3 is 19,628; Treasury bills, deposits and money-market funds disclosed in Note 1 are already within this total. House bridge convention adds reported cash, without a separate invented minimum-cash reserve; operating funding is budgeted in reinvestment. Separate corporate investment balances remain unresolved below. [10-Q Q2 FY2026, balance sheet and Note 1]
  debt:
    value: 64907

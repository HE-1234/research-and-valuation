        The initial chip scale benefit raises segment profit modestly above the latest 61.84%, then competition reduces it to 55%; software falls from about 78.67% to 71% before unallocated charges. The final consolidated GAAP margin belongs in an approximate 45–53% range: above Qualcomm/Cisco, near Broadcom’s 52.51% FY2025 before-acquired-amortization sensitivity, and below Microsoft PBP’s 57.75%. Those comparisons retain R&D/SBC except where the segment definitions explicitly exclude them. This premium needs differentiated IP and recurring software; a sustained fall in chip gross margin or renewal economics would move it lower. [Mature benchmark evidence]

        Both drags and offsets matter: software’s shrinking revenue weight lowers aggregate profitability; custom compute has lower gross margins than networking; research, stock pay and supplier costs continue. Against that, the current chip business already demonstrates operating leverage and the charge for old acquisitions expires. Physical capex/depreciation uses the same cohort check as the investment detail; depreciation rises from the 603 TTM anchor to 3,848, and is already inside the chosen segment margins. These margins require revenue growth and price/mix to fund that extra depreciation, not its omission. A five-year physical life is an analyst midpoint within the disclosed 3–10-year equipment range; new buildings have longer lives and are not separately forecast. [Q2 FY2026 call; 10-K FY2025, Note 2; Valuation base evidence]

        The full disclosed/interpolated acquisition-amortization schedule, remaining-bucket uncertainty and matching net-investment treatment are in base_year.amortization_of_acquired_intangibles.detail. Shared GAAP/R&D/SBC/rent/acquisition definitions are in base_year.operating_income_gaap.detail. The year 6–10 margins are operating hypotheses; late net investment is unsupported, so these profit paths are not complete cash-flow forecasts.

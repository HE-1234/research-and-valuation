  bull:
    story: Custom AI chips win a much larger place in data centers, and Broadcom keeps winning successive designs from several large buyers. Networking leadership and software renewals allow both businesses to expand even after the first deployment wave. Sales initially grow faster than engineering and compensation costs, while later competition takes back part of that gain. Suppliers and customers help fund the ramp, although Broadcom still invests in inventory, equipment and new designs. Those recurring relationships preserve stronger long-term returns after normal taxes, rather than making today’s contracts permanent.

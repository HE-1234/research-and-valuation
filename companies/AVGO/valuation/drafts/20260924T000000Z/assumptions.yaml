    detail: WSTS2027 non-memory products=35,712 discrete+46,436 optoelectronics+23,002 sensors+101,662 analog+121,966 micro+522,820 logic=851,598. Analyst continuation at 6% for 9 years gives 1,438,757 for 2036; a 3–9% continuation is an uncertainty range, not WSTS guidance. The engine divides consolidated sales by this ceiling, conservatively including software in the numerator; the actual chip-only proportion and logic-only AI check are shown below. No memory TAM or financing/GW multiplication enters demand. Microsoft PBP supplies a separate observed software-scale comparison, not an additive market size. [WSTS spring 2026; Mature benchmark evidence]
  historical_revenue_cagr:
    value: 0.23514383941859118
    reason: This is the four-year compound change across five reported annual observations and includes VMware. It is context rather than an organic forecast. [10-K FY2025; 10-K FY2023]
    source: '[10-K FY2025]; [10-K FY2023]'
    detail: (63,887/27,450)^(1/4)-1; FY2021 throughFY2025 gives four intervals, not five. The FY2024 acquisition break makes extrapolating this rate unreliable.
  historical_operating_margin:
    value: 0.3702349529905776

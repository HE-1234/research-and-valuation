  base:
    story: Broadcom supplies several generations of custom AI chips and networking equipment, while established software customers mostly renew. The initial expansion is rapid, then customers gain bargaining power and growth settles as this much larger business matures. Engineering costs grow more slowly than sales at first, but lower software mix and competition later offset much of the benefit from expiring acquisition charges. Research remains an expense, and the company funds inventory, customer contracts and equipment before collecting the next year’s sales. Repeated design wins and the cost of replacing infrastructure software preserve a moderate long-term advantage after taxes normalize.
    weight: 0.5
    revenue_growth:
      values: [0.6272444179, 0.259771987, 0.1861667744, 0.1264305177, 0.0851475568, 0.0682122158, 0.0538397329, 0.0459405941, 0.0352139341, 0.0299926847]
      reason: Several AI programs ship, but delivery timing and customer bargaining keep the central path below management’s near-term trajectory before growth slows. Software renewals and a modest recovery in older chips supply the smaller part of the increase in business.md §2 and outlook.md §3. [10-Q Q2 FY2026; Q2 FY2026 call]
      source: '[10-Q Q2 FY2026]; [Q2 FY2026 release]; [Q2 FY2026 call]; [WSTS spring 2026]'
      detail: |
        Observed starting point: TTM semiconductor 47,762 and software 27,703 sum to 75,465. Q2 revenue 22,187 grew 47.87% from 15,004; Q2 semiconductor 15,009 versus 8,408 grew 78.50%, while software 7,178 versus 6,596 grew 8.82%. The release’s next-quarter revenue 29,400 and AI16,000 imply substantial acceleration; the first model year is May 2026–May 2027, not FY2026. [10-Q Q2 FY2026, Note 9; Q2 FY2026 release]

        Consensus availability and fallback: no dated third-party consensus snapshot is present in the permitted pre-cutoff cache, so rule 10 cannot seed any year or profit metric from outside estimates. The base therefore uses the documented management fallback: the Q3 total-sales guide, fiscal-2026 AI floor and named deployment schedule are kept distinct from the reported TTM run-rate, then extended only through labelled analyst judgments below. Revenue is covered by that fallback; no consensus EBIT/operating-profit series is available, so the margin path begins with the reported segment/GAAP bridge rather than an invented estimate. A dated provider mean with fiscal periods, publication date, contributor count and GAAP definition would replace this fallback for its covered years. [Valuation evidence overview; Q2 FY2026 release; Q2 FY2026 call]

        Tested central hypothesis: Broadcom's disclosed customer programs convert into several generations of custom AI chips and networking sales, while most infrastructure-software spending survives renewal; after the first installation wave, buyer bargaining and a larger comparison base slow both growth and margins. This implies the selected chip/software revenue build, an early scale benefit followed by margin normalization, and continued inventory/contract/equipment funding rather than free growth. It is only a partial cash-flow hypothesis because the cache cannot support years 6–10 total funding; those investment cells stay null instead of assuming the operating story pays for itself. The hypothesis weakens if disclosed deployments slip, customers insource designs, software renewal economics deteriorate or supplier/contract assets consume more cash than the early budget. [10-Q Q2 FY2026; Q2 FY2026 call; Valuation base evidence]

        First-year AI of 72,000 is a rounded judgment: H2 FY2026 34,000 plus H1 FY2027 38,000, below management’s indicated fiscal path; older chips contribute 17,800 and software 33,000. Subsequent AI growth buys several customer generations, then falls as the installed base grows and buyers negotiate. A central first-year AI interval of roughly 65,000–80,000 and mature AI of 180,000–240,000 is more defensible than distinguishing nearby point estimates; the selected path occupies the middle. Annual software growth slows from about 19% to about 2%, rather than compounding the guided one-quarter 31% or Microsoft PBP’s recent 13% forever. Repeated guide delivery, stable software contract economics and continuing networking leadership would support it; customer insourcing, nonrenewal or unfunded deployments would reduce growth.

        Annual build in USD millions; AI/other-chip splits after the disclosed starting segment are analyst judgments, not audited subsegments:

        | Model year, ends about May | AI judgment | Other chips judgment | Semiconductor total | Software judgment | Company total | Growth |
        | --- | --- | --- | --- | --- | --- | --- |
        | 1 / 2027 | 72,000 | 17,800 | 89,800 | 33,000 | 122,800 | 62.7244% |
        | 2 / 2028 | 100,000 | 18,700 | 118,700 | 36,000 | 154,700 | 25.9772% |
        | 3 / 2029 | 125,000 | 19,500 | 144,500 | 39,000 | 183,500 | 18.6167% |
        | 4 / 2030 | 145,000 | 20,200 | 165,200 | 41,500 | 206,700 | 12.6431% |
        | 5 / 2031 | 160,000 | 20,800 | 180,800 | 43,500 | 224,300 | 8.5148% |
        | 6 / 2032 | 173,000 | 21,400 | 194,400 | 45,200 | 239,600 | 6.8212% |
        | 7 / 2033 | 184,000 | 21,900 | 205,900 | 46,600 | 252,500 | 5.3840% |
        | 8 / 2034 | 194,000 | 22,300 | 216,300 | 47,800 | 264,100 | 4.5941% |
        | 9 / 2035 | 202,000 | 22,600 | 224,600 | 48,800 | 273,400 | 3.5214% |
        | 10 / 2036 | 209,000 | 22,800 | 231,800 | 49,800 | 281,600 | 2.9993% |

        Every segment sum is exact; growth ratios are stored to 10 decimals solely to reproduce the rounded revenue totals, with less than 0.01 of cumulative rounding. Years 6–10 are explicit because customer bargaining and the maturing product mix need a slower cost/growth path than holding year-five margins constant. No undisclosed chip quantity, price per gigawatt, new backlog or platform financing is added to sales.

        Year-five revenue 224,300; final-year revenue 281,600, with semiconductor 82.3% and software 17.7%. Against the broad 2036 non-memory ceiling 1,438,757, chips would be 16.1%; AI alone would be 23.7% of a similarly extrapolated logic ceiling 883,293. This large-share requirement is a plausibility test, not demonstrated market access. WSTS only forecasts through 2027;6% subsequent growth is an analyst assumption, and 3–9% alternatives materially change the denominator. [WSTS spring 2026]

        Software ends at 49,800, compared with Microsoft PBP’s observed FY2025 revenue 120,810 and 13.10% growth, and Cisco’s total 56,654 with 5.30% growth including more Splunk. Those broader businesses establish an order of magnitude and mature growth outcomes; they do not prove VMware’s addressable market. The proposed software path requires retention through successive renewals and slows to 2.05% in year 10. [Mature benchmark evidence; MSFT FY2025 10-K; CSCO FY2025 10-K]


        Current AI-chip leader scale check: NVIDIA reported FY2026 revenue 215,938 and Q1FY2027 revenue 81,615 against 44,062 a year earlier; reconstructed TTM=215,938+81,615-44,062=253,491. Its latest-quarter Data Center revenue is 75,200. These releases were published February 25 and May 20,2026, before the cutoff. This case’s final Broadcom consolidated revenue 281,600 is 1.11 times that observed NVIDIA TTM; final semiconductor revenue 231,800 is 0.91 times it. This is a present-scale comparison against a rapidly growing leader, not a forecast that NVIDIA stops growing or a claim of mature margins/market size. NVIDIA sells compute platforms, networking and systems alongside chips; Broadcom’s call describes its revenue as chips, so supply-chain scope differs. No future share is inferred from this ratio. [NVDA FY2026 release; NVDA Q1 FY2027 release; Q2 FY2026 call]


        Year-five demand check uses 2031, four years after the WSTS2027 observation, rather than the year-ten denominator. At the same 6% analyst continuation the non-memory ceiling is 1,075,123 and logic ceiling 660,048; year-five chip revenue 180,800 is 16.8% of the first and AI160,000 is 24.2% of the second. Year-five mix is 80.6% chips and 19.4% software; total 224,300. These are broad ceiling proportions, not market-share forecasts, and the 3–9% continuation uncertainty and product-scope limitations remain. [WSTS spring 2026]

        Software demand check starts with the existing 27,703 TTM software business rather than an invented market. Its large-enterprise/mainframe/VMware installed base provides recurring workloads; the call reports 17% ARR growth, while recognized Q2 sales grew 9% and Q3 guidance implies 31%. Upfront recognition of noncancelable multiyear licenses makes sales and annualized recurring demand different measures. Customer renewal/retention rates, customer counts and software ARR dollars are not disclosed, so none is fabricated. [10-K FY2025, Items1/7 and Note2; 10-Q Q2 FY2026, Note9; Q2 FY2026 call]

        For this case, a transparent operating range lets normalized spending across the existing franchise plus net new business compound 7%–12% for five years, then 0%–5% for five more. These are analyst scenario ranges anchored below or around the observed 17% ARR expansion, not retention disclosures or management guidance. They imply year-five equivalent software revenue 38,855–48,822 and year-ten 38,855–62,311; the selected 43,500/49,800 requires five-/ten-year CAGR9.44%/6.04%. Recognition can make individual years depart from the normalized path; the near-term guided quarter and subscription conversion support that timing, not perpetual 31% growth.

        The central range assumes most critical workloads remain on the platform, but upgrade/new-customer spending slows as subscription conversion matures and customers compare alternatives. These conditions are grounded in the disclosed switching role and recurring software franchise, while the filing also warns customers may reject subscription licensing or move workloads to public cloud. Persistent ARR growth below the case’s normalized range, weaker recognized sales after contract timing normalizes, customer migration or adverse contracting changes would invalidate the demand check. The band is a falsifiable expansion of the current business, not a precise 2036 TAM; absent renewal counts limit confidence. [10-K FY2025, Item1; 10-Q Q2 FY2026, Item1A; Q2 FY2026 call]

        Every company-growth decline greater than three percentage points is identified below. These are reasons for the analyst’s timing judgments, not newly sourced events. [Q2 FY2026 call; 8-K April6; QCOM FY2025 10-K]

        | Model years | Company growth | Growth in slowing components, destination year | Operating mechanism |
        | --- | --- | --- | --- |
        | 1→2 | 62.72%→25.98% | AI 38.89%; software 9.09% | The first ramp is already in the comparison base; this year adds AI programs to a much larger sales level instead of repeating the initial step from the smaller TTM base. |
        | 2→3 | 25.98%→18.62% | AI 25.00%; software 8.33% | The first large deployment wave stops dominating growth; follow-on orders and capacity absorption replace initial installations, and subscription conversion contributes less incremental software growth. |
        | 3→4 | 18.62%→12.64% | AI 16.00%; software 6.41% | This window extends beyond the call’s stated 2028 visibility: repeat design wins increasingly replace first deployments, buyers gain negotiating power, and software additions slow with its installed-base maturity. |
        | 4→5 | 12.64%→8.51% | AI 10.34%; software 4.82% | The window approaches the Google agreement’s up-to 2031 term; continued business must be won again rather than treated as conversion of today’s finite commitments, while software contract conversion is largely behind it. |

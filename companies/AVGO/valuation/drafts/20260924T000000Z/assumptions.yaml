  management:
    story: Management’s stated AI revenue targets are achieved at their disclosed floor, with the next fiscal year weighted toward its second half. The analyst fills the periods and businesses for which management gave no annual target using the central operating case. The same central cost and capital assumptions keep research and stock compensation as expenses and fund growth before customers pay. The mature business retains the central case’s moderate advantage after taxes normalize; these later assumptions belong to the analyst, not management.
    computable: true
    reason: Management supplied multi-year AI revenue targets, so a management operating case is conceptually available. Late capital needs and unresolved bridge claims still prevent a completed valuation. [Q2 FY2026 call]
    revenue_growth:
      values: [0.710726827, 0.2881487219, 0.1888153939, 0.1284774911, 0.0860600628, 0.0685101114, 0.0544611819, 0.0465201465, 0.0353517676, 0.0300878972]
      reason: The first forward year blends the recorded fiscal AI target with a disclosed-floor interpretation of the following year’s target, using an explicit timing assumption. Later periods and businesses without annual guidance use labelled analyst completion rather than turning qualitative optimism into guidance. [Q2 FY2026 call]
      source: '[10-Q Q2 FY2026]; [Q2 FY2026 release]; [Q2 FY2026 call]; [WSTS spring 2026]'
      detail: |
        Observed starting point: TTM semiconductor 47,762 and software 27,703 sum to 75,465. Q2 revenue 22,187 grew 47.87% from 15,004; Q2 semiconductor 15,009 versus 8,408 grew 78.50%, while software 7,178 versus 6,596 grew 8.82%. The release’s next-quarter revenue 29,400 and AI16,000 imply substantial acceleration; the first model year is May 2026–May 2027, not FY2026. [10-Q Q2 FY2026, Note 9; Q2 FY2026 release]

        Recorded wording gives AI revenue of 56,000 in FY2026 and “in excess of” 100,000 in FY2027. The 100,000 figure is a conservative boundary of an open-ended target, not its midpoint or exact promise. H1 FY2026 reported AI is 8,400+10,800=19,200, so the fiscal target implies H2 36,800. Assume 40% of the 100,000 FY2027 floor arrives in H1, consistent with the back-half-loaded wording; model year one is therefore 36,800+40,000=76,800. At a 35–45% H1 fraction the same arithmetic gives 71,800–81,800. [Q2 FY2026 call; Q1 FY2026 release; Q2 FY2026 release]

        For model year two, FY2027 H2 is 60,000; an analyst completion assumes 25% fiscal AI growth in FY2028 and the same 40% first-half share, giving FY2028 H1 50,000 and total 110,000. The qualitative “substantial growth” statement is only recorded in guidance, not converted into that 25%; this is the independently chosen central AI growth assumption. Thereafter use the base AI growth rates from year two onward, applied to 110,000, with amounts rounded to the nearest 100. Software starts at 34,500, slightly below four times the 8,900 next-quarter guide, then follows central fading growth; older chips equal the base case. No annual total-company revenue guidance exists. Every year extends from May to May, roughly six months away from the fiscal-year labels; quarterly conversion remains a material approximation. [Q2 FY2026 call]

        The first-year timing range above is not a management range. A change to the published fiscal target or its back-half timing changes the mapped path; exact year-two-and-later numbers should be replaced when management gives actual annual targets.

        Annual build in USD millions; AI/other-chip splits after the disclosed starting segment are analyst judgments, not audited subsegments:

        | Model year, ends about May | AI judgment | Other chips judgment | Semiconductor total | Software judgment | Company total | Growth |
        | --- | --- | --- | --- | --- | --- | --- |
        | 1 / 2027 | 76,800 | 17,800 | 94,600 | 34,500 | 129,100 | 71.0727% |
        | 2 / 2028 | 110,000 | 18,700 | 128,700 | 37,600 | 166,300 | 28.8149% |
        | 3 / 2029 | 137,500 | 19,500 | 157,000 | 40,700 | 197,700 | 18.8815% |
        | 4 / 2030 | 159,500 | 20,200 | 179,700 | 43,400 | 223,100 | 12.8477% |
        | 5 / 2031 | 176,000 | 20,800 | 196,800 | 45,500 | 242,300 | 8.6060% |
        | 6 / 2032 | 190,300 | 21,400 | 211,700 | 47,200 | 258,900 | 6.8510% |
        | 7 / 2033 | 202,400 | 21,900 | 224,300 | 48,700 | 273,000 | 5.4461% |
        | 8 / 2034 | 213,400 | 22,300 | 235,700 | 50,000 | 285,700 | 4.6520% |
        | 9 / 2035 | 222,200 | 22,600 | 244,800 | 51,000 | 295,800 | 3.5352% |
        | 10 / 2036 | 229,900 | 22,800 | 252,700 | 52,000 | 304,700 | 3.0088% |

        Every segment sum is exact; growth ratios are stored to 10 decimals solely to reproduce the rounded revenue totals, with less than 0.01 of cumulative rounding. Years 6–10 are explicit because customer bargaining and the maturing product mix need a slower cost/growth path than holding year-five margins constant. No undisclosed chip quantity, price per gigawatt, new backlog or platform financing is added to sales.

        Year-five revenue 242,300; final-year revenue 304,700, with semiconductor 82.9% and software 17.1%. Against the broad 2036 non-memory ceiling 1,438,757, chips would be 17.6%; AI alone would be 26.0% of a similarly extrapolated logic ceiling 883,293. This large-share requirement is a plausibility test, not demonstrated market access. WSTS only forecasts through 2027;6% subsequent growth is an analyst assumption, and 3–9% alternatives materially change the denominator. [WSTS spring 2026]

        Software ends at 52,000, compared with Microsoft PBP’s observed FY2025 revenue 120,810 and 13.10% growth, and Cisco’s total 56,654 with 5.30% growth including more Splunk. Those broader businesses establish an order of magnitude and mature growth outcomes; they do not prove VMware’s addressable market. The proposed software path requires retention through successive renewals and slows to 1.96% in year 10. [Mature benchmark evidence; MSFT FY2025 10-K; CSCO FY2025 10-K]


        Current AI-chip leader scale check: NVIDIA reported FY2026 revenue 215,938 and Q1FY2027 revenue 81,615 against 44,062 a year earlier; reconstructed TTM=215,938+81,615-44,062=253,491. Its latest-quarter Data Center revenue is 75,200. These releases were published February 25 and May 20,2026, before the cutoff. This case’s final Broadcom consolidated revenue 304,700 is 1.20 times that observed NVIDIA TTM; final semiconductor revenue 252,700 is 1.00 times it. This is a present-scale comparison against a rapidly growing leader, not a forecast that NVIDIA stops growing or a claim of mature margins/market size. NVIDIA sells compute platforms, networking and systems alongside chips; Broadcom’s call describes its revenue as chips, so supply-chain scope differs. No future share is inferred from this ratio. [NVDA FY2026 release; NVDA Q1 FY2027 release; Q2 FY2026 call]


        Year-five demand check uses 2031, four years after the WSTS2027 observation, rather than the year-ten denominator. At the same 6% analyst continuation the non-memory ceiling is 1,075,123 and logic ceiling 660,048; year-five chip revenue 196,800 is 18.3% of the first and AI176,000 is 26.7% of the second. Year-five mix is 81.2% chips and 18.8% software; total 242,300. These are broad ceiling proportions, not market-share forecasts, and the 3–9% continuation uncertainty and product-scope limitations remain. [WSTS spring 2026]

        Software demand check starts with the existing 27,703 TTM software business rather than an invented market. Its large-enterprise/mainframe/VMware installed base provides recurring workloads; the call reports 17% ARR growth, while recognized Q2 sales grew 9% and Q3 guidance implies 31%. Upfront recognition of noncancelable multiyear licenses makes sales and annualized recurring demand different measures. Customer renewal/retention rates, customer counts and software ARR dollars are not disclosed, so none is fabricated. [10-K FY2025, Items1/7 and Note2; 10-Q Q2 FY2026, Note9; Q2 FY2026 call]

        For this case, a transparent operating range lets normalized spending across the existing franchise plus net new business compound 7%–12% for five years, then 0%–5% for five more. These are analyst scenario ranges anchored below or around the observed 17% ARR expansion, not retention disclosures or management guidance. They imply year-five equivalent software revenue 38,855–48,822 and year-ten 38,855–62,311; the selected 45,500/52,000 requires five-/ten-year CAGR10.43%/6.50%. Recognition can make individual years depart from the normalized path; the near-term guided quarter and subscription conversion support that timing, not perpetual 31% growth.

        The central range assumes most critical workloads remain on the platform, but upgrade/new-customer spending slows as subscription conversion matures and customers compare alternatives. These conditions are grounded in the disclosed switching role and recurring software franchise, while the filing also warns customers may reject subscription licensing or move workloads to public cloud. Persistent ARR growth below the case’s normalized range, weaker recognized sales after contract timing normalizes, customer migration or adverse contracting changes would invalidate the demand check. The band is a falsifiable expansion of the current business, not a precise 2036 TAM; absent renewal counts limit confidence. [10-K FY2025, Item1; 10-Q Q2 FY2026, Item1A; Q2 FY2026 call]

        Every company-growth decline greater than three percentage points is identified below. These are reasons for the analyst’s timing judgments, not newly sourced events. [Q2 FY2026 call; 8-K April6; QCOM FY2025 10-K]

        | Model years | Company growth | Growth in slowing components, destination year | Operating mechanism |
        | --- | --- | --- | --- |
        | 1→2 | 71.07%→28.81% | AI 43.23%; software 8.99% | The first ramp is already in the comparison base; this year adds AI programs to a much larger sales level instead of repeating the initial step from the smaller TTM base. The disclosed FY2027 floor/second-half conversion now overlaps the first analyst-completed FY2028 half; this timing bridge is not a second full year of management guidance. |
        | 2→3 | 28.81%→18.88% | AI 25.00%; software 8.24% | The first large deployment wave stops dominating growth; follow-on orders and capacity absorption replace initial installations, and subscription conversion contributes less incremental software growth. |
        | 3→4 | 18.88%→12.85% | AI 16.00%; software 6.63% | This window extends beyond the call’s stated 2028 visibility: repeat design wins increasingly replace first deployments, buyers gain negotiating power, and software additions slow with its installed-base maturity. |
        | 4→5 | 12.85%→8.61% | AI 10.34%; software 4.84% | The window approaches the Google agreement’s up-to 2031 term; continued business must be won again rather than treated as conversion of today’s finite commitments, while software contract conversion is largely behind it. |

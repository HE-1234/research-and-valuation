    source: '[10-Q Q2 FY2026]'
    detail: Principal 66,720 less unamortized discounts/issuance costs 1,813 =64,907; disclosed fair value is 62,505. These are alternative measures, not additional claims. The book convention differs from principal by 1,813 and fair value by 2,402; a computation should preserve this explicit convention rather than mix denominators. [10-Q Q2 FY2026, Note 6]
  operating_lease_liabilities:
    value: 0
    reason: Ordinary leases stay as rent in operating costs, so no separate lease-debt deduction is made. This is an accounting-treatment zero, not a claim that no leases exist. [10-K FY2025]
    source: '[10-K FY2025]'
    detail: FY2025 liability 1,325 and ROU asset 1,318 are reported; a May 3 stock update is unavailable. Expense 182, cash payments 277 and new ROU assets 220 establish ongoing operating cash costs. Keeping both rent and rental funding in operations matches the peer basis and avoids subtracting lease debt while retaining the full rent cost. The missing current stock does not require a fabricated carry-forward liability. This treatment applies only to ordinary leases, not the separate 29,000 maximum customer backstop. [10-K FY2025, Note 6; Valuation base evidence]
  non_operating_assets:
    - name: Corporate investments outside reported cash equivalents — carrying value unresolved
      value: null
      reason: Investment purchases and sales establish that holdings exist but do not establish their current carrying balance. Keep this claim on assets unresolved until a dated stock amount or a supported immateriality bound is available. [10-Q Q2 FY2026]
      source: '[10-Q Q2 FY2026]'
      detail: H1 purchases 137 and sales 283 are flows; 283-137 is not an ending balance. Pension assets belong to retirement plans and are not corporate investments to add here. Income from investments is outside EBIT, so any separately established carrying balance belongs in this bridge once. [10-Q Q2 FY2026, cash-flow statement; Valuation base evidence]
  minority_interests:
    value: 0
    reason: No separate minority-interest balance is reported in the latest balance sheet. [10-Q Q2 FY2026]
    source: '[10-Q Q2 FY2026]'
    detail: Total equity including noncontrolling interests and stockholders equity both equal 87,691 in the reviewed statements/companyfacts. Zero means no separately reported material claim, not proof that every subsidiary is wholly owned. [10-Q Q2 FY2026; SEC bridge facts precutoff]
  other_claims:
    - name: June 8 customer-lease backstop — present claim value unsupported
      value: null
      reason: The contractual maximum is not the present value of this contingent claim, and the necessary deployment, default and recovery evidence is missing. This material gap blocks a completed equity valuation while the operating forecast remains reviewable. [10-Q Q2 FY2026]
      source: '[10-Q Q2 FY2026]; [Apollo platform release June 9]; [Apollo financing release June 9]'
      detail: The guarantee concerns five-year customer leases and grows as racks deploy; the maximum is 29,000. No eligible source supplies fair value, fee, draw schedule, default probability or recoveries. Zero, the maximum as certain debt and Broadcom-wide failure probability are all unsupported substitutes. An independently supported shared present value could enter this cell; scenario-specific losses would need a supported approximation or a different model capability. Financing 35,000 and platform 20 GW do not establish revenue or loss. [10-Q Q2 FY2026, Note 11; Apollo platform release June 9; Apollo financing release June 9]
    - name: Existing uncertain-tax claim, undiscounted carrying amount
      value: 1662
      reason: Deduct the separately disclosed unsettled tax claim once rather than folding old disputes into future normal operating taxes. Its payment timing remains uncertain. [10-Q Q2 FY2026]
      source: '[10-Q Q2 FY2026]'
      detail: The disclosed 1,662 includes unrecognized benefits and accrued interest/penalties; management cannot reliably estimate cash-settlement timing. Use the undiscounted amount as an explicit conservative carrying-value convention; forecast tax rates concern future earnings only. A resolved audit or reliable settlement date would replace this convention. [10-Q Q2 FY2026, Note 10]
    - name: Underfunded pension plans, gross deficit carry-forward
      value: 96
      reason: Carry forward the last disclosed gross pension deficit without using inaccessible surpluses elsewhere to cancel it. This is a small dated proxy requiring replacement when the next plan disclosure arrives. [10-K FY2025]
      source: '[10-K FY2025]'
      detail: FY2025 underfunded plans 96; overfunded plans 57; aggregate deficit 39. No May 3 update is disclosed. Gross 96 avoids treating inaccessible plan surpluses as corporate cash; plausible difference from net treatment is 57, small beside debt and operating capital. Forecast operating costs retain service costs but not an assumed second payment of this frozen legacy funding deficit. [10-K FY2025, pension disclosures; Valuation base evidence]
  probability_of_failure:
    value: 0
    reason: Model Broadcom as a going concern without a separate whole-company failure overlay. Customer nonpayment belongs in the unresolved backstop claim and operating downside, rather than being mislabeled as failure of Broadcom. [10-Q Q2 FY2026]
    source: '[10-Q Q2 FY2026]'
    detail: Observed cash 19,628, TTM operating cash 33,622, unused revolver 7,500 and FY2027 principal 493 provide financing capacity; no default probability is disclosed. Zero is a modelling choice for this operating forecast, not a measured absence of risk. A liquidity shortfall, covenant breach or inability to refinance would require a separate failure model and recoveries. [10-Q Q2 FY2026, Note 6; Valuation base evidence]
  distress_proceeds:
    value: 0
    reason: Unused while the whole-company failure probability is zero; this is not an estimate of liquidation proceeds.
    source: '[Analyst judgment]'
  diluted_shares:
    value: 4876
    reason: Use the latest quarter’s diluted weighted-average shares, which already include disclosed award dilution. [10-Q Q2 FY2026]
    source: '[10-Q Q2 FY2026]'
    detail: 4,747 basic shares +129 dilutive awards =4,876; period-end 4,758 and H1 average 4,882 answer different questions. [10-Q Q2 FY2026, Note 5]
  dilution_note: The quarter’s denominator already includes 129 million award shares;183 million RSUs outstanding and 20,106 of unrecognized future compensation overlap those measures and must not simply be added or deducted again; future SBC stays expensed. [10-Q Q2 FY2026, Notes 5 and 7]

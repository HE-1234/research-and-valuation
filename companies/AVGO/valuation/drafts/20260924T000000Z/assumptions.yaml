    detail: Average of FY2021–2025 ratios:31.0346%,42.8425%,45.247%,26.1042%,39.8892%; unweighted by sales. A pre-acquired-amortization sensitivity is shown separately in the peer evidence and is not relabeled GAAP.
scenarios:
  bear:
    story: The announced AI buildout still creates a large first step in sales, but customers then delay projects and move more chip design in house. Software renewals become harder, and price concessions outweigh the benefit of spreading engineering costs over more sales. Broadcom keeps paying for research and inventory while old acquisition charges expire, and cannot recover all working capital when growth stalls. Its competitive advantage eventually disappears, and normal taxes replace today’s unusual tax benefits.
    weight: 0.25
    revenue_growth:
      values: [0.4311270125, 0.0583333333, -0.0174978128, -0.0080142476, 0.0197486535, 0.0220070423, 0.0215331611, 0.021079258, 0.0206440958, 0.0202265372]
      reason: Existing commitments still lift the first forward year, but subsequent projects stall and customers do more design themselves; software pricing also loses force. This downside follows the concentration and inventory risks in business.md §6 while preserving the already visible ramp. [10-Q Q2 FY2026; Q2 FY2026 call]
      source: '[10-Q Q2 FY2026]; [Q2 FY2026 release]; [Q2 FY2026 call]; [WSTS spring 2026]'
      detail: |
        Observed starting point: TTM semiconductor 47,762 and software 27,703 sum to 75,465. Q2 revenue 22,187 grew 47.87% from 15,004; Q2 semiconductor 15,009 versus 8,408 grew 78.50%, while software 7,178 versus 6,596 grew 8.82%. The release’s next-quarter revenue 29,400 and AI16,000 imply substantial acceleration; the first model year is May 2026–May 2027, not FY2026. [10-Q Q2 FY2026, Note 9; Q2 FY2026 release]

        First-year AI of 60,000 is an analyst assumption of 30,000 in H2 FY2026 and 30,000 in H1 FY2027, below the 36,800 H2 amount implied by management’s fiscal target; older chips add 17,000 and software 31,000. Year-two AI rises only slightly and then contracts for two years; neither a specific lost customer nor an invented unit price is claimed. The defensible downside band is roughly 50,000–70,000 first-year AI and 60,000–90,000 at maturity, with software broadly flat after the initial contract conversion. The chosen middle of that downside range reflects delays and substitution rather than Broadcom failing as a firm. A guide cut, a second supplier replacing a large program, or declining software renewals would support this case; on-time conversion of the disclosed fiscal targets would weaken it.

        Annual build in USD millions; AI/other-chip splits after the disclosed starting segment are analyst judgments, not audited subsegments:

        | Model year, ends about May | AI judgment | Other chips judgment | Semiconductor total | Software judgment | Company total | Growth |
        | --- | --- | --- | --- | --- | --- | --- |
        | 1 / 2027 | 60,000 | 17,000 | 77,000 | 31,000 | 108,000 | 43.1127% |
        | 2 / 2028 | 65,000 | 17,300 | 82,300 | 32,000 | 114,300 | 5.8333% |
        | 3 / 2029 | 63,000 | 17,300 | 80,300 | 32,000 | 112,300 | -1.7498% |
        | 4 / 2030 | 62,000 | 17,400 | 79,400 | 32,000 | 111,400 | -0.8014% |
        | 5 / 2031 | 64,000 | 17,600 | 81,600 | 32,000 | 113,600 | 1.9749% |
        | 6 / 2032 | 66,000 | 17,800 | 83,800 | 32,300 | 116,100 | 2.2007% |
        | 7 / 2033 | 68,000 | 18,000 | 86,000 | 32,600 | 118,600 | 2.1533% |
        | 8 / 2034 | 70,000 | 18,200 | 88,200 | 32,900 | 121,100 | 2.1079% |
        | 9 / 2035 | 72,000 | 18,400 | 90,400 | 33,200 | 123,600 | 2.0644% |
        | 10 / 2036 | 74,000 | 18,600 | 92,600 | 33,500 | 126,100 | 2.0227% |

        Every segment sum is exact; growth ratios are stored to 10 decimals solely to reproduce the rounded revenue totals, with less than 0.01 of cumulative rounding. Years 6–10 are explicit because customer bargaining and the maturing product mix need a slower cost/growth path than holding year-five margins constant. No undisclosed chip quantity, price per gigawatt, new backlog or platform financing is added to sales.

        Year-five revenue 113,600; final-year revenue 126,100, with semiconductor 73.4% and software 26.6%. Against the broad 2036 non-memory ceiling 1,438,757, chips would be 6.4%; AI alone would be 8.4% of a similarly extrapolated logic ceiling 883,293. This large-share requirement is a plausibility test, not demonstrated market access. WSTS only forecasts through 2027;6% subsequent growth is an analyst assumption, and 3–9% alternatives materially change the denominator. [WSTS spring 2026]

        Software ends at 33,500, compared with Microsoft PBP’s observed FY2025 revenue 120,810 and 13.10% growth, and Cisco’s total 56,654 with 5.30% growth including more Splunk. Those broader businesses establish an order of magnitude and mature growth outcomes; they do not prove VMware’s addressable market. The proposed software path requires retention through successive renewals and slows to 0.90% in year 10. [Mature benchmark evidence; MSFT FY2025 10-K; CSCO FY2025 10-K]


        Current AI-chip leader scale check: NVIDIA reported FY2026 revenue 215,938 and Q1FY2027 revenue 81,615 against 44,062 a year earlier; reconstructed TTM=215,938+81,615-44,062=253,491. Its latest-quarter Data Center revenue is 75,200. These releases were published February 25 and May 20,2026, before the cutoff. This case’s final Broadcom consolidated revenue 126,100 is 0.50 times that observed NVIDIA TTM; final semiconductor revenue 92,600 is 0.37 times it. This is a present-scale comparison against a rapidly growing leader, not a forecast that NVIDIA stops growing or a claim of mature margins/market size. NVIDIA sells compute platforms, networking and systems alongside chips; Broadcom’s call describes its revenue as chips, so supply-chain scope differs. No future share is inferred from this ratio. [NVDA FY2026 release; NVDA Q1 FY2027 release; Q2 FY2026 call]


        Year-five demand check uses 2031, four years after the WSTS2027 observation, rather than the year-ten denominator. At the same 6% analyst continuation the non-memory ceiling is 1,075,123 and logic ceiling 660,048; year-five chip revenue 81,600 is 7.6% of the first and AI64,000 is 9.7% of the second. Year-five mix is 71.8% chips and 28.2% software; total 113,600. These are broad ceiling proportions, not market-share forecasts, and the 3–9% continuation uncertainty and product-scope limitations remain. [WSTS spring 2026]

        Software demand check starts with the existing 27,703 TTM software business rather than an invented market. Its large-enterprise/mainframe/VMware installed base provides recurring workloads; the call reports 17% ARR growth, while recognized Q2 sales grew 9% and Q3 guidance implies 31%. Upfront recognition of noncancelable multiyear licenses makes sales and annualized recurring demand different measures. Customer renewal/retention rates, customer counts and software ARR dollars are not disclosed, so none is fabricated. [10-K FY2025, Items1/7 and Note2; 10-Q Q2 FY2026, Note9; Q2 FY2026 call]

        For this case, a transparent operating range lets normalized spending across the existing franchise plus net new business compound 0%–5% for five years, then-1%–3% for five more. These are analyst scenario ranges anchored below or around the observed 17% ARR expansion, not retention disclosures or management guidance. They imply year-five equivalent software revenue 27,703–35,357 and year-ten 26,345–40,988; the selected 32,000/33,500 requires five-/ten-year CAGR2.93%/1.92%. Recognition can make individual years depart from the normalized path; the near-term guided quarter and subscription conversion support that timing, not perpetual 31% growth.

        The downside range assumes lost workloads and renewal concessions largely offset upgrades and new customers, with little net franchise expansion. These conditions are grounded in the disclosed switching role and recurring software franchise, while the filing also warns customers may reject subscription licensing or move workloads to public cloud. Persistent ARR growth below the case’s normalized range, weaker recognized sales after contract timing normalizes, customer migration or adverse contracting changes would invalidate the demand check. The band is a falsifiable expansion of the current business, not a precise 2036 TAM; absent renewal counts limit confidence. [10-K FY2025, Item1; 10-Q Q2 FY2026, Item1A; Q2 FY2026 call]

        Every company-growth decline greater than three percentage points is identified below. These are reasons for the analyst’s timing judgments, not newly sourced events. [Q2 FY2026 call; 8-K April6; QCOM FY2025 10-K]

        | Model years | Company growth | Growth in slowing components, destination year | Operating mechanism |
        | --- | --- | --- | --- |
        | 1→2 | 43.11%→5.83% | AI 8.33%; software 3.23% | The first ramp is already in the comparison base; this year adds AI programs to a much larger sales level instead of repeating the initial step from the smaller TTM base. Customers delay additional deployments and require concessions; AI adds only 5,000. |
        | 2→3 | 5.83%→-1.75% | AI -3.08%; software 0.00% | The downside assumes customer self-design and deployment pauses reduce AI sales from 65,000 to 63,000, with flat software after initial contract conversion; no actual named cancellation is asserted. |

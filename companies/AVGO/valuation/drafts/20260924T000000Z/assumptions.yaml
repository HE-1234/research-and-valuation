      detail: |
        Observed lagged history uses investment in year t against sales added in t+1, consistent with the selected one-year lag. The GAAP proxy is capex minus physical depreciation, plus a cash-flow proxy for noncash current operating capital, plus net cash acquisitions/disposals, minus acquired amortization. [Valuation base evidence]

        | FY investment | GAAP net proxy | Following FY sales increase | Lag-1 result |
        | --- | --- | --- | --- |
        | 2021 | -5,704 | 5,753 | Unusable negative denominator |
        | 2022 | -3,000 | 2,616 | Unusable negative denominator |
        | 2023 | -2,386 | 15,755 | Unusable; VMware revenue appears next year |
        | 2024 | 15,828 cash-only; 77,616 full-consideration illustration | 12,313 | 0.778 x cash-only; 0.159 x full-consideration illustration |
        | 2025 | -3,431 | Not yet observable | No FY2026 result at cutoff |

        The pre-acquired-amortization cash proxy gives 1.925 x for FY2022, 18.298 x for FY2023 and 0.491 x for FY2024; the latter two are acquisition-distorted. The current-capital proxy includes mixed tax/interest lines; including all long-term cash-flow changes would change FY2025 net investment from -3,431 to +187. No one of these is a clean marginal growth-capital estimate. VMware’s stock-funded consideration is not omitted merely because it was absent from cash investing. [Valuation base evidence; 10-K FY2025; 10-K FY2023]

        Mature stock sales/book capital is 0.490 x Broadcom, 0.963 x Cisco, 1.712 x Qualcomm and 0.833 x Microsoft consolidated. The screen retains goodwill and R&D expense, treats operating leases as rent, and includes Microsoft finance leases; Microsoft PBP and Qualcomm QCT standalone capital are not disclosed. These are accumulated-capital measures, not next-year incremental sales/investment. The early forecast ratios may exceed them because no new large goodwill purchase is assumed and current R&D remains fully expensed; there is no claim that past goodwill can be recovered. [Mature benchmark evidence]

        Supported provisional construction for years 1–5 only: growth-capital budget=max(next-year sales increase,0)/selected ratio. Add a maintenance allowance of 0.5% of current-year sales, then floor this pre-amortization net budget at gross physical capex less physical depreciation. Net investment equals that budget minus this year’s acquired amortization. Ratios are therefore contextual budget parameters; the displayed annual overrides, not an unadjusted ratio, determine final net investment. A contraction does not mechanically release working capital. The lower bear ratio buys more inventory/contract capital per dollar of future sales, while the bull assumes more supplier/customer support.

        Physical check: gross capex is an analyst assumption of 1.5% of sales versus 1.0–1.6% in FY2021–FY2025 and TTM 860. Start physical depreciation at TTM 603, retire that legacy run-rate evenly over five years, and depreciate each new annual capex cohort over five years with a half-year convention. Five years lies within the disclosed 3–10-year equipment lives; 15–40-year buildings are a small but unseparated component, so this is a check, not a reported asset rollforward. Future segment margins below include this depreciation burden. The rest of the budget is working capital, contract assets and supply-chain funding, not capitalized R&D or the separately unvalued customer-lease guarantee. [10-K FY2025, Note 2; Valuation base evidence]

        The ordinary investment range is uncertain: sustained net pre-amortization funding around 30–70% of the following sales increment is defensible for these cases against the FY2025 current-capital use of 4,882 and next-year uncertainty; exact ratios are not empirically estimable from acquisition-distorted history. The 128,110 purchase commitments and 164,600 committed contracts support budgeting material funding, but neither is automatically debt nor all cash paid at once. Payment terms, contract-asset disclosures and inventories growing persistently faster than shipments would change these choices. [10-Q Q2 FY2026, Notes 2 and 10]

        Late funding limitation, after independent review: this early organic-growth budget does not establish a complete mature cash-flow model. The initial ten-year extrapolation implied a base year-10 net investment of 5,632 followed by 18,247 in the terminal year; bull 7,745 followed by 23,972; management 6,094 followed by 19,706; bear 2,732 followed by 7,380. Growth, margins and taxes changed little at that boundary. Missing internally developed research assets and amortization of old acquisitions explain some high book returns, but affect both years and do not explain the sudden extra annual funding. [Pass1 operating diagnostics]

        The researched peer/industry range is not enough to choose a late marginal ratio here: the low own-company stock ratio contains past acquisitions, whereas the proposed organic growth budget retains R&D expense and assumes no major deal. Replacing the budget with a ratio reverse-engineered from 18% or 22% terminal return would simply impose the desired endpoint. Adding unannounced acquisitions, changing the selected premium to pass a warning, or treating contingent guarantees as automatic working capital would invent support. Late capital efficiency and years 6–10 net-investment overrides therefore remain null; a null override falls through to a null late ratio, so no complete cash-flow scenario is presented.

        This is a missing economic bridge for a future judgment, not a claim that an exact future ratio must be reported by management. Resolution needs a coherent source-grounded operating model linking customer/supplier payment terms, contract-asset conversion, inventory/commitment funding, equipment replacement and recurring IP spending to the mature margin/mix; alternatively, a complete matched R&D capitalization and consistently adjusted comparators could establish a different capital basis. That work must justify both the mature investment requirement and the intervening path. The existing first-five-year budgets and mature 18%/22% return hypotheses remain reviewable, but neither proves the missing bridge. [Accounting and reinvestment method; Business-drivers method]

        Broad industry context remains separate from the matched peer screen: January 5,2026 LTM sales/invested capital is 1.2067 x for 66 Semiconductor firms and 1.5382 x for 309 Software (System & Application) firms. The dataset has investment/R&D adjustments and broad aggregate populations, not a distribution of comparable AVGO incremental projects. These stock ratios cannot repair the missing late bridge by themselves, and are not multiplied by unrelated margins to invent observed industry ROIC. [Damodaran capital data]

        This case retains early ratio 2.5 as a provisional five-year organic-funding judgment. The previous late ratio 2.0 is withdrawn, not silently retained as a default; it did not reconcile the mature investment requirement. Original case range considered: Early 2.0–3.0 x and late 1.5–2.5 x;2.5/2.0 is a central organic-growth budget, better than stock capital turnover but well below the corrupted 18 x acquisition-period ratio.

    value: 55000
    source: "[Q1 FY2027 call]"
    reason: "The only sized addressable market in the sources: the CEO said the data-center custom silicon market Marvell targets is 'a $55 billion TAM' for fiscal 2029, of which Marvell aims for a 20% share (Q&A with Vivek Arya; third-party machine transcript, wording not corrected). It covers only one of the three data-center product groups (not interconnect or switching) and refers to FY2029, not model year 5 (FY2032), so it understates the year-5 market; management promised a fuller long-range sizing at the October 6, 2026 Investor Day, after which the owner may replace it [Q2 FY2027 call]."

scenarios:
  bear:
    weight: 0.25
    story: |
      The AI building boom cools within two years, and the handful of cloud giants that make up most of Marvell's sales cut orders at short notice, as they did in 2023. One of them moves a custom chip program in-house or to a rival, and a competitor beats Marvell to the next speed step in interconnect. Revenue stops growing after the first year, slips a little in year two and falls by about a tenth in year three, while the fixed research bill and the doubled stock pay stay, so margins fall back toward where they were before the AI boom. Marvell keeps buying companies to fill the gap, so each dollar of new sales costs more capital than it has recently.
    revenue_growth:
      values: [0.45, -0.05, -0.10, 0.03, 0.05]
      reason: "Year 1 is mostly locked by guidance: FY2027 at roughly 12 billion implies a second half of about 6,843 (Q3 guided at 3,150), and a flat first half of FY2028 at that level gives a TTM of about 13,700, 45% above the 9,450 base (computed; outlook.md §4). Orders then slip 5% in year 2 and 10% in year 3 as the custom ramp stalls and cloud spending pauses, a repeat of FY2024 (revenue −7%, with data-center revenue also down that year; business.md §2 table, §6 risks 1–3), followed by a slow recovery. Year-5 revenue about 12.7 billion, 1.34× the base (computed)."
      source: "[Q2 FY2027 release; Q2 FY2027 call; 10-K FY2026, Item 7]"
    operating_margin:
      values: [0.23, 0.19, 0.12, 0.15, 0.17]
      reason: "Year 1: the second half of FY2027 at the guided cost lines (Q3: 53.4% gross margin less 1,015 of operating expenses on 3,150 = 21%; Q4 about 25% on higher revenue) plus a flat first half of FY2028 gives about 23% (computed) [Q2 FY2027 release]. Acquired amortization falls from 9.4 points of revenue to about 1 point by year 3 under the 10-Q schedule (385.3 for the rest of FY2027, 292.7 in FY2028, 139.6 in FY2029, plus 77–166 a year once the 997.0 of Celestial and XConn in-process R&D ships and amortizes over 6–13 years), which props margins up even here [10-Q Q2 FY2027, Note 5]. But stock pay of about 1.3 billion a year is 11 points on a 12 billion base and R&D is fixed, so the 12% in year 3 assumes, beyond that fixed-cost arithmetic (which alone gives about 17%), that custom-heavy mix and price cuts push GAAP gross margin toward 50% (it was 41% in FY2025) while operating expenses are not cut (business.md §3–§4) [Q2 FY2027 supplemental, p.5; 10-K FY2026, Item 7]."
      source: "[Q2 FY2027 release; 10-Q Q2 FY2027, Note 5; 10-K FY2026, Item 7; Q2 FY2027 supplemental, p.5]"
    # Historical sales-to-capital, USD millions (revenue change / net reinvestment). Net capex = capex − depreciation and amortization
    # (non-acquisition); WC = working-capital outflow (+) or inflow (−) as reported in the 10-K cash-flow narrative; acquisitions = cash paid.
    #   Year      ΔRevenue  Capex  D&A   Acq    Formula (capex−D&A+acq) → S/C   With WC → S/C        Sources
    #   FY2023     +1,457    206   305   112     13.6 → ~107                    663 → 2.2            [10-K FY2024, Item 7; Item 8]
    #   FY2024       −412    336   300     0     36.5 → n/m                     −21 → n/m (WC −58)   [10-K FY2024, Item 7; Item 8]
    #   FY2025       +260    285   304    10     −9.3 → n/m                    −138 → n/m (WC −129) [10-K FY2026, Item 7; Item 8]
    #   FY2026     +2,427    354   349     0      5.5 → ~441                  1,106 → 2.2            [10-K FY2026, Item 7; Item 8]
    #   H1 FY2027  +1,256*   282   189  1,271   1,364 → 0.9 (organic 94 → 13)   754 → 1.7 organic;  [10-Q Q2 FY2027, Item 1; Item 2; Note 14]
    #                                            plus 2,500 of stock for Celestial/XConn → 0.28 all-in
    #   * TTM revenue 9,450.3 less FY2026 8,194.6. FY2022 (Inphi and Innovium, 3,555 cash plus stock) cannot be computed: FY2021 revenue is not in the cache.
    sales_to_capital:
      value: 1.4
      value_late: 1.0
      reason: "On the formula revenue change / (capex − depreciation + acquisitions) Marvell's history is meaningless (FY2023 about 107, FY2026 about 441, FY2024–FY2025 negative) because net capex is near zero; adding the working-capital outflows the 10-Ks report gives 2.2 in FY2023, 2.2 in FY2026 and 1.7 in H1 FY2027, and counting the Celestial and XConn price (1,271 cash plus 2.5 billion in stock) drops FY2027 below 0.6 (year-by-year arithmetic in the comment above; business.md §3–§4). Bear assumes growth has to be bought with deals again, as in FY2022 (3,555 cash for Inphi and Innovium) and FY2027, so 1.4 early and 1.0 late [10-K FY2024, Item 7; Item 8; 10-K FY2026, Item 7; Item 8; 10-Q Q2 FY2027, Item 1; Item 2]."
      source: "[10-K FY2024, Item 8; 10-K FY2026, Item 7; Item 8; 10-Q Q2 FY2027, Item 1; Note 14]"
    reinvestment_override:
      values: [970, 100, null, null, null]
      source: "[Q2 FY2027 call; 10-Q Q2 FY2027, Note 14; Item 1; 10-Q Q1 FY2027, Note 14; 10-K FY2024, Item 7]"
      reason: "Years 1 and 2 precede revenue declines, so the sales-to-capital rule would book cash releases of about 490 and 930, far beyond the 58 of working capital Marvell released on a 412 revenue fall in FY2024. Year 1 is therefore set to what is already committed: roughly 780 of the guided 1 billion of FY2027 capacity prepayments still to be paid after the first half (the prepayment balance rose 223.9 to 487.0 in Q2) plus net capex of about 190 at the first-half run rate (282.4 capex less 188.5 depreciation, doubled), about 970 in all (computed). Year 2 is set to 100, net capex partly offset by a small working-capital release, and years 3–5 revert to sales-to-capital."
    tax_rate:
      start: 0.13
      terminal: 0.25
      reason: "Starts at management's FY2028 non-GAAP tax rate (see base_year.effective_tax_rate) and moves to the 25% marginal rate in the terminal year."
    cost_of_capital_override: null
    terminal:
      growth:
        value: riskfree
        allow_above_riskfree: false
        reason: "Equals the fetched ten-year Treasury rate by rule (§18.4 rule 5); no company grows faster than the economy forever."
      roic_premium:
        value: 0.0
        allow_large_premium: false
        reason: "Bear: the moat is assumed gone, so terminal return on capital equals terminal cost of capital."
  base:
    weight: 0.50
    story: |
      Marvell delivers roughly what it has promised for the next two years: the custom chip ramp-up for its big cloud customers arrives, interconnect keeps leading, and revenue about doubles from the last twelve months' level within two years. After that the AI spending cycle matures, growth slows toward that of a normal chip company, and pricing pressure on custom chips keeps gross margins from rising. Operating margins improve sharply anyway, partly because the business grows over a fixed research bill and partly because the amortization from old acquisitions runs off; stock pay stays as a real cost. Reinvestment is mostly working capital and factory prepayments, with an acquisition now and then.
    revenue_growth:
      values: [0.55, 0.30, 0.18, 0.10, 0.06]
      reason: "Year 1 (TTM to Aug 2027) lands at about 14.6 billion, a little under the 15 billion midpoint between management's FY2027 'roughly $12 billion' and FY2028 'approximately $18 billion' (outlook.md §4), a haircut for slippage in the custom ramp; year 2 (TTM to Aug 2028) at about 19.0 billion means FY2028 is delivered roughly as guided but the FY2029 acceleration is muted. Years 3–5 fade toward the risk-free rate as cloud spending growth moderates, the assumption management itself used a quarter ago ('30%-plus range' for cloud capex, outlook.md §6), giving year-5 revenue of about 26.2 billion, 2.8× the base (computed). The base tracks guidance for two years rather than discounting it because management has met 10 of 12 graded claims and raised full-year guidance twice (scorecard.md)."
      source: "[Q2 FY2027 call; Q2 FY2027 release; Q1 FY2027 call]"
    operating_margin:
      values: [0.25, 0.29, 0.30, 0.30, 0.29]
      reason: "Bridge from management's non-GAAP target to GAAP: non-GAAP operating margin enters 38–40% in Q4 FY2027 and reaches the upper end through FY2028 (outlook.md §4); subtract stock pay of 7–9 points (1.3 billion run rate on 15–19 billion of revenue, kept as a cost) and acquired amortization of about 3.6 points in year 1 (385.3 for the rest of FY2027 plus half of FY2028's 292.7) falling to 1–2 points from year 2 (half of 292.7 plus half of FY2029's 139.6, plus 77–166 a year once the 997.0 of Celestial and XConn in-process R&D ships and amortizes over 6–13 years), which gives about 25% in year 1 and 29–31% from year 2 (computed) [10-Q Q2 FY2027, Note 5; Q2 FY2027 supplemental, p.5]. Year 1 also reconciles bottom-up from the Q3 guide (GAAP margin 21%), Q4 (about 25%) and the first half of FY2028 (about 28%) [Q2 FY2027 release]. Held at 30% and trimmed to 29% in year 5 for the custom-mix gross-margin pressure the CFO named and the 'significant pricing pressures' the 10-K warns of (business.md §3; outlook.md §6) [10-K FY2026, Item 1A]."
      source: "[Q2 FY2027 call; Q2 FY2027 release; 10-Q Q2 FY2027, Note 5; Q2 FY2027 supplemental, p.5]"
    sales_to_capital:
      value: 1.8
      value_late: 1.2
      reason: "Organic history including working capital is 2.2 in the growth years FY2023 and FY2026 and 1.7 in H1 FY2027 once capacity prepayments began (table in the comment above the bear cell; business.md §3–§4). Base uses 1.8 for years 1–5 (working capital about 30% of revenue plus prepayments and net capex) and 1.2 for the fade years, when growth is assumed to be bought partly by acquisition as in FY2022 and FY2027. Celestial and XConn (4.0 billion of consideration, revenue 'not material' so far) are excluded from the early ratio because the spend is already in invested capital and any revenue from it sits in the growth path [10-K FY2024, Item 8; 10-Q Q2 FY2027, Note 4; Item 2]."
      source: "[10-K FY2024, Item 8; 10-K FY2026, Item 7; Item 8; 10-Q Q2 FY2027, Item 1; Note 4]"
    reinvestment_override:
      values: [null, null, null, null, null]
      reason: "No specific capex guidance; the FY2027 prepayment figure is only one component of reinvestment, so sales-to-capital is used throughout."
    tax_rate:
      start: 0.13
      terminal: 0.25
      reason: "Management's FY2028 non-GAAP tax rate (see base_year.effective_tax_rate), rising to the 25% marginal rate in the terminal year."
    cost_of_capital_override: null
    terminal:
      growth:
        value: riskfree
        allow_above_riskfree: false
        reason: "Equals the fetched ten-year Treasury rate by rule (§18.4 rule 5); no company grows faster than the economy forever."
      roic_premium:
        value: 0.03
        allow_large_premium: false
        reason: "Three points above terminal cost of capital: custom programs lock a customer in for a whole chip generation, interconnect wins each speed transition first, and Google is now tied in through a revenue-vesting warrant (business.md §5; Q2 FLAG). Kept below Damodaran's 4 points for Alphabet because ten customers are 82% of revenue and one distributor 44%, and the 10-K says customers 'may begin developing and making their own semiconductor solutions' (business.md §6)."
  bull:
    weight: 0.25
    story: |
      The Google agreement and the second large custom program make Marvell the default outside designer for cloud companies' own AI chips, and scale-up optics becomes a large new business on top of interconnect. Revenue grows to nearly four times today's level over five years, and operating margins rise above the current long-term target as research spending is spread over a far bigger base. Customers stay locked in for whole chip generations, so the business earns more than its cost of capital for longer than usual. Growth is funded from cash flow without major acquisitions.
    revenue_growth:
      values: [0.60, 0.42, 0.30, 0.18, 0.10]
      reason: "Year 1 at about 15.1 billion is the midpoint of management's FY2027 and FY2028 targets taken at face value; year 2 at about 21.5 billion reflects FY2028 hit and custom 'accelerate significantly in fiscal 2029' (outlook.md §3–§4). Years 3–5 credit part of the Google warrant arithmetic the CEO did not dispute ($120 billion of custom purchases over 6.5 years for full vesting; 'your math is not wrong', outlook.md §6) while still fading. Year-5 revenue about 36.2 billion, 3.8× the base (computed), below the $55 billion custom market alone for FY2029."
      source: "[Q2 FY2027 call; 8-K 2026-08-19; Q1 FY2027 call]"
    operating_margin:
      values: [0.26, 0.31, 0.34, 0.35, 0.35]
      reason: "Non-GAAP operating margin moves above the 38–40% target to the low-to-mid 40s, the direction the CFO signalled when promising to 'reset that long-term target model' at the October 2026 Investor Day (outlook.md §4), because R&D is fixed (business.md §3). Less stock pay falling toward 6 points of revenue as revenue outgrows headcount, and acquired amortization of about 1 point once the FY2027 roll-off is done (10-Q schedule: 292.7 in FY2028, 139.6 in FY2029, plus 77–166 a year when the 997.0 of Celestial and XConn in-process R&D starts amortizing over 6–13 years) [10-Q Q2 FY2027, Note 5]."
      source: "[Q2 FY2027 call; 10-Q Q2 FY2027, Note 5]"
    sales_to_capital:
      value: 2.2
      value_late: 1.5

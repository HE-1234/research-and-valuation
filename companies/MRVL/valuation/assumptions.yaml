    value: 1561.3
    source: "[10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]"
    reason: "FY2026 GAAP operating income 1,322.9 plus six months FY2027 of 799.1 minus six months FY2026 of 560.7 = 1,561.3, a 16.5% margin on TTM revenue (computed). Nothing is removed as one-time: restructuring of 25.3 and 86.8 of acquisition, divestiture and legal costs (30.1 of it Celestial deal fees) stay in, because Marvell has booked restructuring every year since FY2024 and closed acquisitions in four of the last six fiscal years, so both recur at intervals (§18.4 rule 1) [10-K FY2026, Note 4; 10-Q Q2 FY2027, Note 4; Note 8; Q2 FY2027 supplemental, p.8]. The 1,830.4 divestiture gain and the 433.7 earn-out revaluation sit below operating income, so nothing is removed for them either [10-K FY2026, Note 1; 10-Q Q2 FY2027, Note 6]."
  # No one-time items. Arithmetic behind the reason above: restructuring inside TTM operating income = 16.0 (FY2026) + 5.7 (H1 FY2027)
  # − (−3.6) (H1 FY2026) = 25.3; yearly series FY2024–FY2026 131.1, 711.8, 16.0 [10-K FY2026, Note 4; 10-Q Q2 FY2027, Note 8]. 'Other' non-GAAP
  # items inside TTM operating income (acquisition and divestiture costs, legal matters, investment gains) = COGS 1.9 + R&D 22.7 + SG&A 62.2
  # = 86.8 over Q3 FY2026–Q2 FY2027, of which 30.1 were Celestial transaction costs [Q2 FY2027 supplemental, p.8; 10-Q Q2 FY2027, Note 4].
  one_time_items: []
  amortization_of_acquired_intangibles:
    value: 892.7
    source: "[10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]"
    reason: "Cash-flow statement line 'Amortization of acquired intangible assets': FY2026 942.0 plus H1 FY2027 440.1 minus H1 FY2026 489.4 = 892.7, or 9.4 points of TTM revenue (computed). Memo row, stays deducted; the roll-off is built into the margin paths from the 10-Q schedule as of August 1, 2026: 385.3 for the rest of FY2027, 292.7 for FY2028, 139.6 for FY2029, 117.2 for FY2030 and 60.8 for FY2031 (the 10-K's January schedule read 814.0 / 284.8 / 131.8 / 109.5) [10-Q Q2 FY2027, Note 5; 10-K FY2026, Note 5]. On top of that, 997.0 of Celestial and XConn in-process R&D is not amortized until the products ship, then over 6 to 13 years, so a further 77 to 166 a year once it starts."
  stock_based_compensation:
    value: 828.9
    source: "[10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]"
    reason: "FY2026 590.8 plus H1 FY2027 533.8 minus H1 FY2026 295.7 = 828.9, or 8.8 points of TTM revenue (computed). Memo row, never added back. The run rate has roughly doubled: 326.2 in Q2 FY2027 against 153.6 a year earlier, with 190.1 of assumed Celestial awards still to be expensed [Q2 FY2027 supplemental, p.5; 10-Q Q2 FY2027, Note 10]."
  rnd_expense:
    value: 2441.9
    source: "[10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]"
    reason: "FY2026 2,075.2 plus H1 FY2027 1,393.4 minus H1 FY2026 1,026.7 = 2,441.9, or 25.8% of TTM revenue (computed). Memo row; used only if the capitalize_rnd switch is turned on."
  effective_tax_rate:
    value: 0.13
    source: "[Q2 FY2027 call; Q2 FY2027 release]"
    reason: "Marvell's GAAP tax line is not usable as a rate: FY2026 shows 12.4% but that year's pretax income was dominated by the 1.8 billion divestiture gain, and the six months of FY2027 show 25.8% (119.1 on 461.6) because the 433.7 earn-out charge is not tax-deductible [10-K FY2026, Note 12; 10-Q Q2 FY2027, Note 11]. We therefore use management's non-GAAP tax rate, its own estimate of tax on ongoing operating profit: 11% for FY2027 and 'approximately 13% in fiscal 2028', taking the higher FY2028 figure because model year 1 already runs into FY2028 and the rate rises with earnings [Q2 FY2027 call]."
  invested_capital:
    value: 19884.9
    source: "[10-Q Q2 FY2027, Item 1; Note 14]"
    reason: "Book equity 18,531.6 + debt 4,962.9 + operating lease liabilities 323.2 (59.3 current + 263.9 non-current) − cash 3,932.8 = 19,884.9 at August 1, 2026. About 13.9 billion of it is goodwill and 2.3 billion acquired intangibles, so the ROIC check will look low; it measures the return on everything ever paid for acquisitions, not on new R&D."

schema: 1
ticker: MRVL
company: Marvell Technology, Inc.
as_of_quarter: FY2027-Q2
as_of_date: 2026-08-28
drafted: 2026-09-09
currency: USD
units: millions
horizon: 10

base_year:
  period: "the twelve months ending August 1, 2026 (Q3 FY2026 to Q2 FY2027)"
  revenue:
    value: 9450.3
    source: "[10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]"
    reason: "The base year is the twelve months to August 1, 2026, so the model starts from the sales Marvell has just made rather than from a fiscal year that ended last January (business.md section 2). It is the last annual report with the newest six months swapped in for the year-earlier six months."
    detail: |
      Base year = FY2026 (10-K) + six months ended 2026-08-01 minus six months ended 2025-08-02 (10-Q Q2 FY2027): 8,194.6 + 5,157.1 minus 3,901.4 = 9,450.3 [10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]. Cross-check: the four quarters Q3 FY2026 to Q2 FY2027 in the eight-quarter table sum to 2,074.5 + 2,218.7 + 2,417.8 + 2,739.3 = 9,450.3 [Q2 FY2027 supplemental, p.5]. The year-earlier twelve months were 1,516.1 + 1,817.4 + 1,895.3 + 2,006.1 = 7,234.9, so the trailing year is up 31% and the latest quarter is up 37% [Q2 FY2027 supplemental, p.5].
  operating_income_gaap:
    value: 1561.3
    source: "[10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]"
    reason: "Operating profit for the same twelve months exactly as reported, which is 16.5% of revenue (business.md section 3). Nothing is stripped out as one-off: Marvell has booked restructuring every year since FY2024 and closed acquisitions in four of the last six fiscal years, so the method counts both as recurring. The divestiture gain and the earn-out revaluation sit below operating profit, so they never touch this line."
    detail: |
      Trailing twelve months = FY2026 GAAP operating income 1,322.9 + six months FY2027 of 799.1 minus six months FY2026 of 560.7 = 1,561.3 [10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]; 1,561.3 / 9,450.3 = 16.5% (computed). The FY2026 figure is the sum of the four quarters 270.6 + 290.1 + 357.8 + 404.4 [Q2 FY2027 supplemental, p.5].
      Left inside operating income, which is why the one-time items list is empty. Restructuring inside the trailing twelve months = 16.0 (FY2026) plus 5.7 (H1 FY2027) plus the 3.6 credit booked in H1 FY2026, which is taken back out, = 25.3; the yearly series FY2024 to FY2026 is 131.1, 711.8, 16.0 [10-K FY2026, Note 4; Q2 FY2027 release]. The 'other' non-GAAP items inside the trailing twelve months (acquisition and divestiture costs, legal matters, investment gains) = cost of goods sold 1.9 + research 22.7 + selling and administrative 62.2 = 86.8 over Q3 FY2026 to Q2 FY2027 [Q2 FY2027 supplemental, p.8].
      Below operating income and therefore untouched: the 1,830.4 divestiture gain and the 433.7 earn-out revaluation [10-K FY2026, Note 1; 10-Q Q2 FY2027, Note 6].
  one_time_items: []
  amortization_of_acquired_intangibles:
    value: 892.7
    source: "[10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]"
    reason: "The yearly write-down of technology and customer relationships bought in past acquisitions, worth 9.4 points of revenue in the base year. It stays as a cost by the method, but it falls away fast on a schedule already in the accounts, and every margin path below builds that roll-off in (business.md section 3)."
    detail: |
      Cash-flow statement line 'Amortization of acquired intangible assets', trailing twelve months = FY2026 942.0 + H1 FY2027 440.1 minus H1 FY2026 489.4 = 892.7; 892.7 / 9,450.3 = 9.4 points of revenue (computed) [10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]. Roll-off schedule as of August 1, 2026: 385.3 for the rest of FY2027, 292.7 for FY2028, 139.6 for FY2029, 117.2 for FY2030, 60.8 for FY2031 and 54.0 after that, total 1,049.6; the 10-K's January schedule read 814.0 / 284.8 / 131.8 / 109.5 [10-Q Q2 FY2027, Note 5; 10-K FY2026, Note 5]. On top of that the balance sheet carries 1,297.0 of acquired research not yet in use (951.0 from Celestial, 46.0 from XConn, 300.0 already on the books at January 31, 2026), which is not amortized until the products ship and then runs over useful lives of 6 to 13 years, a further 100 to 216 a year once all of it is running [10-Q Q2 FY2027, Note 5]. Memo row; stays deducted.
  stock_based_compensation:
    value: 828.9
    source: "[10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]"
    reason: "Pay handed out as shares, 8.8 points of revenue in the base year and running at roughly double last year's rate. The method keeps it inside operating profit because it is a real cost to existing owners; this cell is only a memo (business.md section 4)."
    detail: |
      Trailing twelve months = FY2026 590.8 + H1 FY2027 533.8 minus H1 FY2026 295.7 = 828.9; 828.9 / 9,450.3 = 8.8 points of revenue (computed) [10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]. Run rate: 326.2 in Q2 FY2027 against 153.6 a year earlier, with 190.1 of assumed Celestial awards still to be expensed [Q2 FY2027 supplemental, p.5; 10-Q Q2 FY2027, Note 10]. Five-year history as a share of revenue: 10.3% FY2022, 9.3% FY2023, 11.1% FY2024, 10.4% FY2025, 7.2% FY2026 (computed from business.md section 4). Memo row; never added back.
  rnd_expense:
    value: 2441.9
    source: "[10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]"
    reason: "What Marvell spent on chip design in the base year, 25.8% of revenue: the fixed bill that makes its profits swing so hard with volume, and the biggest piece of spending for future revenue inside today's costs (business.md section 3). Memo row only, since the switch that would treat research as an investment is off."
    detail: |
      Trailing twelve months = FY2026 2,075.2 + H1 FY2027 1,393.4 minus H1 FY2026 1,026.7 = 2,441.9; 2,441.9 / 9,450.3 = 25.8% (computed) [10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]. The US semiconductor industry spends 15.4% of sales on research, so about ten points of today's revenue is design spending running ahead of the sales it is meant to produce, which is the first offset in every margin path below [Damodaran margin.xls, Semiconductor, 2026-01-05]. The five-year history in the switches block, oldest first, is FY2022 to FY2026: 1,424.2, 1,784.3, 1,896.2, 1,950.4, 2,075.2 [10-K FY2024, Item 8; 10-K FY2026, Item 8].
  effective_tax_rate:
    value: 0.13
    source: "[Q2 FY2027 call; Q2 FY2027 release]"
    reason: "The model starts from management's own estimate of tax on ongoing profits, approximately 13% for FY2028, because the official rates Marvell reports are distorted by a huge divestiture gain in one year and a charge that gets no tax relief in the next (business.md section 4). The FY2028 figure is used rather than FY2027's 11% because model year 1 already runs into FY2028 and the rate rises with earnings."
    detail: |
      Why the reported rate is unusable: FY2026 shows 12.4%, but that year's pretax income was dominated by the 1.8 billion divestiture gain; the six months of FY2027 show 25.8% (119.1 on 461.6) because the 433.7 earn-out charge is not tax-deductible [10-K FY2026, Note 12; 10-Q Q2 FY2027, Note 11]. Management guides a non-GAAP tax rate of 11% for FY2027 and 'approximately 13% in fiscal 2028' [Q2 FY2027 call; Q2 FY2027 release]. The US semiconductor industry's average effective rate among profitable companies is 15.8% [Damodaran taxrate.xls, Semiconductor, 2026-01-05].
  invested_capital:
    value: 19884.9
    source: "[10-Q Q2 FY2027, Item 1; Note 14]"
    reason: "The capital the business has been handed: what shareholders and lenders put in, less its cash. It is used only for the return-on-capital check, and it reads low because most of it is the price paid for past acquisitions rather than money behind today's chip designs (business.md section 4)."
    detail: |
      At August 1, 2026: book equity 18,531.6 + debt 4,962.9 + operating lease liabilities 323.2 (59.3 current + 263.9 non-current) minus cash 3,932.8 = 19,884.9 [10-Q Q2 FY2027, Item 1; Note 14]. Goodwill is 13,873.9 and acquired intangibles 2,346.6 of that [10-Q Q2 FY2027, Item 1]. After-tax operating profit of 1,358.3 (1,561.3 at the 13% rate) is a 6.8% return on the whole figure and a 22.6% return on the 6,011.0 left once goodwill is set aside (computed); both figures are used in the terminal cells below.
switches:
  addback_acquired_amortization: false
  capitalize_rnd: false
  rnd_amortization_years: 5
  rnd_history: [1424.2, 1784.3, 1896.2, 1950.4, 2075.2]
  reinvestment_lag: 1

bridge:
  cash_and_marketable_securities:
    value: 3932.8
    source: "[10-Q Q2 FY2027, Item 1]"
    reason: "The money Marvell can spend at once, added to the value of the business. There is no separate investments line to add: the balance sheet and the management discussion show only cash and cash equivalents."
    detail: |
      Cash and cash equivalents 3,932.8 at August 1, 2026; the management discussion describes only 'cash and cash equivalents' of 3.9 billion [10-Q Q2 FY2027, Item 1; Item 2]. Time deposits of 194.0 are already inside cash equivalents [10-Q Q2 FY2027, Note 6].
  debt:
    value: 4962.9
    source: "[10-Q Q2 FY2027, Note 7]"
    reason: "All of Marvell's borrowing at the value the accounts carry it at, subtracted from the value of the business: eight series of unsecured bonds, with no bank loans left and the revolving credit line untouched (business.md section 7)."
    detail: |
      Net carrying amount at August 1, 2026 = face value 4,999.9 less 37.0 of unamortized discount and issuance cost = 4,962.9 [10-Q Q2 FY2027, Note 7]. The last term loan was repaid in FY2026 and the 1.5 billion revolver is undrawn [10-Q Q2 FY2027, Note 7]. Left out as operating items: technology-license payment obligations of 220.0 (96.2 + 123.8) [10-Q Q2 FY2027, Note 14].
  operating_lease_liabilities:
    value: 323.2
    source: "[10-Q Q2 FY2027, Note 14]"
    reason: "Rent Marvell has already committed to on the offices and labs it leases, treated as debt-like and subtracted from value."
    detail: |
      Lease liabilities current 59.3 plus non-current 263.9 = 323.2 at August 1, 2026 [10-Q Q2 FY2027, Note 14].
  non_operating_assets:
    - name: "Forward stock purchase contract (cash-settled hedge of the Celestial earn-out)"
      value: 131.0
      source: "[10-Q Q2 FY2027, Note 6]"
      reason: "A twelve-month contract Marvell bought in April 2026 to hedge the shares it may owe on the Celestial earn-out: it pays out in cash if the share price rises, offsetting the part of the earn-out that is settled in shares. It is an asset, so it is added to the value of the business."
      detail: |
        Notional 300.0, meaning the contract is written on that much stock even though no shares change hands; it is carried at 131.0 of fair value inside prepaid expenses [10-Q Q2 FY2027, Note 6]. It partly offsets the earn-out claim listed below.
    - name: "Marketable equity investments"
      value: 25.5
      source: "[10-Q Q2 FY2027, Note 6]"
      reason: "Shares in listed companies held among Marvell's longer-term assets and valued at the quoted market price, which accountants call a Level 1 measurement. Added to value separately because they are not part of the chip business."
    - name: "Non-marketable equity investments"
      value: 156.2
      source: "[10-Q Q2 FY2027, Note 14]"
      reason: "Stakes in private companies, added to value separately because they are not part of the chip business. They are carried at what Marvell paid, less any write-down where the value has clearly fallen, so the figure is softer than it looks."
  minority_interests:
    value: 0
    source: "[10-Q Q2 FY2027, Item 1]"
    reason: "The balance sheet shows no non-controlling interest line."
  other_claims:
    - name: "Celestial AI contingent consideration (earn-out) liability"
      value: 749.5
      source: "[10-Q Q2 FY2027, Note 6; Note 14]"
      reason: "Marvell owes the former owners of Celestial AI extra payments if that business hits revenue targets, and the promise has more than doubled in value since the deal closed. It is subtracted at its carrying value, and the part payable in shares is counted here rather than in the share count, so it is not double-counted."
      detail: |
        Fair value 749.5 at August 1, 2026, up from 315.8 at closing; payable in up to 233.0 of cash plus about 22.4 million shares if Celestial hits revenue milestones through FY2029 [10-Q Q2 FY2027, Note 6; Note 14].
  probability_of_failure:
    value: 0.0
    reason: "Zero, as the method sets it for a large profitable company: Marvell holds 3.9 billion of cash against investment-grade bonds with nothing to repay before FY2029, its operations produced 1.2 billion of cash in six months, and its 1.5 billion credit line is untouched (business.md section 4). Failure risk therefore stays out of the cost of capital as well."
    detail: |
      3,932.8 of cash against 4,999.9 face value of notes with nothing due before FY2029; 1,244.3 of operating cash flow in the six months to August 1, 2026; an undrawn 1.5 billion revolver [10-Q Q2 FY2027, Note 7; Item 1; Item 2].
  distress_proceeds:
    value: 0
    reason: "Not needed with the probability of failure at zero."
  diluted_shares:
    value: 921.2
    source: "[10-Q Q2 FY2027, Item 1; Note 12]"
    reason: "The share count the per-share value is divided by: the latest quarter's average as the accountants compute it, including shares owed on employee awards and vested customer warrants, and the NVIDIA preferred shares counted as if already swapped for ordinary shares. Management guides the same count for the next quarter."
    detail: |
      Q2 FY2027 diluted weighted-average shares 921.2 = 875.6 basic common + 21.8 NVIDIA convertible preferred counted as if converted + 23.8 from stock awards and vested customer warrants [10-Q Q2 FY2027, Item 1; Note 12]. Management guides 921 million for Q3 [Q2 FY2027 release].
  dilution_note: "Not in the 921.2: the August 2026 Google warrant for up to 58,970,907 shares at 206.58 USD each (1,360,867 time-based shares vesting quarterly in year one, about 340,217 a quarter, and 57,610,040 performance shares in 240 tranches of about 240,042, one per 500 million USD of custom-product revenue from Q3 FY2027 through FY2033; arithmetic from outlook.md section 5, claim 12), two earlier customer warrants for 4.2 million shares at 87.77 USD (1.2 million vested) and 1.0 million at 87.00 USD, the 22.4 to 24.4 million Celestial earn-out shares already valued in the other claims above, and stock pay running at 326.2 a quarter (190.1 of Celestial awards still to expense), against which management 'intend[s] to continue repurchasing shares to manage dilution' [8-K 2026-08-19; 10-Q Q2 FY2027, Note 3; Note 10; Note 15; Q2 FY2027 supplemental, p.5; Q2 FY2027 call]."

market:
  price: auto
  risk_free_rate: auto
  equity_risk_premium: auto
  mature_market_erp: 0.045
  marginal_tax_rate: 0.25

cost_of_capital:
  method: build
  pinned_value: null
  build:
    damodaran_industry:
      value: "Semiconductor"
      reason: "Marvell is a fabless chip designer, meaning it designs chips and pays outside factories to make them, and all its revenue is chips sold into data-center and communications equipment (business.md sections 1 and 2). The rate this builds is checked against Damodaran's own semiconductor row and his band of US costs of capital in the terminal cell below."
    unlevered_beta:
      value: 1.505
      source: "[Damodaran betas.xls, Semiconductor, dataset dated 2026-01-05, cached tools/valuation/data/damodaran/betas.csv]"
      reason: "Damodaran's 66-company US semiconductor group has an unlevered beta, corrected for cash, of 1.5046. A beta above 1 means chip earnings swing more than the market's, which is what Marvell's own history shows (business.md section 3)."
    debt_to_equity_market:
      value: 0.0255
      source: "[10-Q Q2 FY2027, Note 7; Note 14] [Yahoo price 225.41 on 2026-09-08 16:00 EDT; runner re-check 2026-09-09]"
      reason: "Marvell carries very little debt next to what the market says its shares are worth, so borrowing barely moves the cost of capital (business.md section 4). This ratio is what levers the industry beta up; the runner refreshes it with the price of the day."
      detail: |
        Debt 4,962.9 plus operating leases 323.2 = 5,286.1, divided by market capitalisation of 207,648 (225.41 times 921.2 diluted shares) = 0.0255 [10-Q Q2 FY2027, Note 7; Note 14] [Yahoo price 225.41 on 2026-09-08 16:00 EDT, the price the engine fetched when the runner re-checked this cell on 2026-09-09]. The industry's own market debt-to-equity is 0.026, so Marvell is typical [Damodaran betas.xls, Semiconductor, 2026-01-05].
    pretax_cost_of_debt:
      value: 0.053
      source: "[10-Q Q2 FY2027, Note 7]"
      reason: "5.3% is what ten-year money costs Marvell today, taken from the coupon on its most recent bond sale, which is the rate new borrowing would carry. The average coupon across all eight series is lower because older bonds were sold when rates were lower."
      detail: |
        The most recent issue is the 5.300% Senior Notes due 2036, sold April 15, 2026, with an effective rate of 5.358% [10-Q Q2 FY2027, Note 7]. The face-weighted average coupon on all eight series is 4.55% (computed). The industry row uses a 5.29% pre-tax cost of debt [Damodaran wacc.xls, Semiconductor, 2026-01-05].
  terminal:
    method: mature
    value: null
    reason: "Default: after year 10 the firm is discounted at the risk-free rate plus the mature-market premium of 4.5 points, so no company-specific edge is assumed in perpetuity. The built rate for the explicit years sits in the upper part of Damodaran's US band and next to his semiconductor row, and it carries neither failure risk nor a view on management (both are handled elsewhere in this file)."
    detail: |
      The build at the market data the runner re-verified on 2026-09-09 (bond rate 4.78%, equity risk premium 4.09%): levered beta 1.505 times (1 + 0.75 times 0.0255) = 1.534; cost of equity 4.78% + 1.534 times 4.09% = 11.05%; cost of capital 97.5% of that plus 2.5% of 5.3% after tax = 10.88% (computed). Damodaran's semiconductor row reads 10.55% and his whole-market row 6.96% [Damodaran wacc.xls, Semiconductor and Total Market, 2026-01-05]; his published US band runs from about 6% at the tenth percentile to about 12% at the ninetieth with the median near 8%, so Marvell sits in the upper part of the band, where a cyclical chip designer with a beta of 1.5 belongs, and next to its own industry. The terminal rate is the bond rate plus 4.5 points, about 9.28% at today's rates, reached by a straight-line fade over years 6 to 10. The rate is shared by all three cases: the cases differ in the business, not in the market's price of risk.

diagnostics:
  final_year_market_size:
    value: 126100
    source: "[Q1 FY2027 call] [Damodaran histgr.xls, Semiconductor, 2026-01-05]"
    reason: "An inference, not a management figure: the only market management has sized is a 55 billion custom data-center silicon market for fiscal 2029, and this cell carries it forward seven and a half years to the last model year at the 11.7% a year that analysts expect the US semiconductor industry to grow. It covers only Marvell's custom line, so the engine's share reading overstates the company's true share; each case's growth notes give the custom-only comparison."
    detail: |
      The sourced figure. Asked to confirm the fiscal 2029 custom target, the chief executive said: 'It was a 55 billion TAM. 20% on that is 11 billion. So call it in that range' (dollar signs in the quote written as words; the June 2025 sizing, raised from a market that implied about 8 billion at a 20% share when it was set in April 2024) [Q1 FY2027 call]. No other market is sized anywhere in the cached filings, releases, slides, supplementals or transcripts: the scale-up interconnect and switching markets are called 'a massive new TAM' and each scale-up switch engagement 'a multibillion-dollar lifetime revenue opportunity', the pluggable data-center-interconnect market is projected 'to grow significantly', and nothing is said about the size of the optical DSP, switch, storage or communications markets [Q2 FY2027 call; Q1 FY2027 call; Q2 FY2027 notes]. Searched: every file in sources/FY2027-Q1 and sources/FY2027-Q2 for 'TAM', 'addressable', 'market opportunity' and 'billion market'.
      The carry-forward. Fiscal 2029 runs from about February 2028 to January 2029, midpoint about August 2028; model year 10 is the twelve months to about August 2036, midpoint about February 2036; the gap is 7.5 years. At 11.7% a year, the growth analysts expect for the US semiconductor industry over the next five years, 55,000 times 1.117 to the power 7.5 = 126,113, written as 126,100 [Damodaran histgr.xls, Semiconductor, 'Expected Growth in Revenues - Next 5 years', 2026-01-05]. Alternatives: at the industry's own five-year history of 11.2% a year, 121,900; at 15% a year, 156,900; at the bond rate of 4.78%, 78,100 (computed). The industry rate is chosen because a custom AI-chip market seven years out is a maturing part of the chip industry, not a permanent outgrower of it, and because management itself raised the sizing by about a third in fourteen months, so the near-term rate is likely higher and the far-term rate lower than this average.
      What it covers. Custom processors and the companion chips sold to the same customers, which are 23% of Marvell's revenue today on the inference used in the segment builds. It does not cover optical interconnect, switching, storage or the communications end market, which are the other 77% of today's revenue, so the engine's comparison of total year-10 revenue with this figure reads as a share of a market Marvell only partly sells into. The custom-only readings: bear about 4,500 of custom revenue in year 10, a 3.6% share; base about 31,400, a 25% share against the 20% management targets for fiscal 2029; bull about 53,000, a 42% share, which is why the bull needs this market to grow faster than the industry (at 15% a year it would be a 34% share) (computed from each case's segment build).
  historical_revenue_cagr:
    value: 0.164
    source: "[10-K FY2024, Item 7; Item 8] [10-K FY2026, Item 7; Item 8]"
    reason: "Marvell's own revenue grew about 16.4% a year over the five fiscal years FY2022 to FY2026, shown as context and not as an anchor: data center was 40% of revenue for most of that period and is 79% now, so the old mix tells little about the new one (business.md sections 2 and 3). Almost all of the growth came in the last of those years, when the AI orders arrived."
    detail: |
      From the five-year table in business.md section 3: revenue 4,462.4 in FY2022 and 8,194.6 in FY2026, which is four years of compounding. Taking 8,194.6 divided by 4,462.4, then the power of 1/4, then subtracting 1, gives 0.164 (computed). The path was uneven: 5,919.6 (FY2023), 5,507.7 (FY2024), 5,767.3 (FY2025), then 8,194.6, a 42% jump in FY2026. The US semiconductor industry grew 11.2% a year over its last five years and analysts expect 40.9% over the next two and 11.7% a year over the next five [Damodaran histgr.xls, Semiconductor, 2026-01-05]. Sources as given by the business.md table: FY2022 to FY2023 [10-K FY2024, Item 7; Item 8]; FY2024 to FY2026 [10-K FY2026, Item 7; Item 8].
  historical_operating_margin:
    value: -0.021
    source: "[10-K FY2024, Item 7; Item 8] [10-K FY2026, Item 7; Item 8]"
    reason: "Averaged over the same five fiscal years, Marvell's reported operating margin was slightly negative, so every case here assumes a business that looks nothing like its own recent history (business.md sections 3 and 4). The red ink came mostly from writing down the price of past acquisitions and from share-based pay rather than from the chips themselves, which is why the margin paths are built from a bridge rather than from this average."
    detail: |
      Reported operating margins from the five-year table in business.md section 3, with losses in brackets: (7.8)% FY2022, 4.0% FY2023, (10.3)% FY2024, (12.5)% FY2025, 16.1% FY2026. Simple average: minus 7.8 plus 4.0 minus 10.3 minus 12.5 plus 16.1, divided by 5, is minus 2.1% (computed). Only FY2026 was clearly profitable as reported, and FY2026's adjusted operating margin was 35.3% (business.md section 3) [Q1 FY2027 supplemental, p.8]. Sources as given by that table: FY2022 to FY2023 [10-K FY2024, Item 7; Item 8]; FY2024 to FY2026 [10-K FY2026, Item 7; Item 8].

scenarios:
  bear:
    weight: 0.25
    story: |
      The AI building boom cools once the years management has already put numbers on are behind it,
      and Marvell turns out to be a parts supplier rather than a partner: the cloud giants keep the chip
      designs that matter in-house, the flagship custom processor is not renewed for its next generation,
      and the Google agreement vests only its early slices, so custom silicon shrinks back to the smaller
      companion chips. Optics stays a good business, but a rival is first to the next speed step, so it
      grows with cloud spending rather than faster than it; the factory deposits already promised are
      paid up front, and then sales fall for a stretch in the middle of the decade. Marvell at the end of
      the forecast is a merchant chip company, one that sells standard parts to anyone rather than designs
      made for one customer, about twice today's size and earning about a quarter of sales as profit,
      because the design bill and share-based pay stay fixed while sales do not, and it pays tax at the
      low rate management guides until it is taxed like any mature company. To refill its roadmap it
      goes back to buying small companies, so each new dollar of sales costs about as much capital as it
      does for an average chip company, and nothing above the cost of capital survives into the long run.
    story_to_numbers:
      - says: "The AI building boom cools once the years management has already put numbers on are behind it"
        drives: "revenue growth, years 1 and 2 (the guided quarter and the two guided years taken at the bottom of their ranges)"
        number: "0.43, 0.21"
        source: "[Q2 FY2027 release; Q2 FY2027 call]"
      - says: "the flagship custom processor is not renewed for its next generation, and the Google agreement vests only its early slices, so custom silicon shrinks back to the smaller companion chips"
        drives: "revenue growth, years 3 and 4 (the custom line of the segment build falls from fiscal 2030)"
        number: "-0.04, -0.10"
        source: "[10-K FY2026, Item 1A; 8-K 2026-08-19]"
      - says: "a rival is first to the next speed step, so it grows with cloud spending rather than faster than it"
        drives: "revenue growth, year 5 and the fade years (interconnect at a normal chip-industry pace)"
        number: "0.05"
        source: "[Q1 FY2027 call]"
      - says: "Marvell at the end of the forecast is a merchant chip company, one that sells standard parts to anyone rather than designs made for one customer, about twice today's size"
        drives: "the end state the growth path is backed out from (year-10 revenue against the market size and the sector)"
        number: "about 18,800 of revenue in year 10 against a custom market of about 126,100"

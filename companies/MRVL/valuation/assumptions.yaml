  revenue:
    value: 9450.3
    source: "[10-K FY2026, Item 8; 10-Q Q2 FY2027, Item 1]"
    reason: "FY2026 net revenue 8,194.6 plus six months ended Aug 1, 2026 of 5,157.1 minus six months ended Aug 2, 2025 of 3,901.4 = 9,450.3. Cross-check: the four quarters Q3 FY2026 to Q2 FY2027 in the eight-quarter table sum to 2,074.5 + 2,218.7 + 2,417.8 + 2,739.3 = 9,450.3 [Q2 FY2027 supplemental, p.5]."

          points for the strongest chip franchise he has valued, and this case does not claim more than
          that, because even here the customers own the architecture and 'may begin developing and making
          their own semiconductor solutions'; the method's ceiling of twelve was considered and not taken
          for that reason [10-K FY2026, Item 1A].
          Transition into perpetuity: the perpetual reinvestment charge is about 24% of after-tax
          operating profit against about 14% in the last modelled year, so cash flow steps down about 7%
          into the terminal year, and the terminal return of about 20.3% sits just above half of year
          10's 40%, a margin of a quarter of a point that moves with the bond rate; the owner should
          expect the engine's cliff note to appear if the bond rate falls (computed; dry run).
  management:
    computable: false
    story: |
      Management's numbers on record: roughly 12 billion of revenue this fiscal year and approximately
      18 billion next, data center up about 60% this year and more than 60% next, custom more than
      doubling in fiscal 2028 and over 10 billion in fiscal 2029, operating expenses growing at half the
      rate of revenue next year, an adjusted operating margin entering 38% to 40% this quarter and reaching
      the upper end of that range through fiscal 2028, gross margin holding in a 57.5% to 58.5% range,
      about 1 billion of capacity prepayments this year and a tax rate of about 13% next year. Nothing
      numeric reaches beyond fiscal 2029, so the case cannot be computed; the October 6, 2026 Investor Day
      promises revenue 'out until the end of the decade' and a reset of the margin model. The base case
      tracks these figures for two years and then judges the rest; the bull takes them at the top of their
      ranges and the bear at the bottom.
    reason: "Management has met the requirement of at least one multi-year revenue or margin target, giving revenue figures for two years and a margin target, but it has given nothing numeric beyond FY2028, which is only model year 2, except a custom target for FY2029 that covers one product line. Years 3 to 5 would therefore be guesswork rather than filling in between guided points, so this case is left uncomputable. Dollar signs inside the quotations below are written as USD because the app reads a dollar sign as a formula."
    detail: |
      The guided points: FY2027 revenue roughly 12 billion, FY2028 approximately 18 billion, custom over 10 billion in FY2029, and a non-GAAP operating margin at the upper end of 38% to 40% in FY2028 [Q2 FY2027 call; Q1 FY2027 call]. Because FY2028 is model year 2, years 3 to 5 would be extrapolation rather than interpolation between guided points. Official (GAAP) margins beyond the Q3 guide also need a share-based-pay assumption management does not give, and sales to capital is not guided at all. The October 6, 2026 Investor Day promises revenue 'out until the end of the decade' and a new margin model, after which the owner can complete this case. Where the computed cases sit against these promises: the base case meets both revenue figures and passes the custom target; the bull beats them; the bear falls short of both.
    guidance:
      - {item: "Q3 FY2027 revenue", quote: "Net revenue is expected to be USD 3.150 billion +/- 5%.", source: "[Q2 FY2027 release]", used_as: "revenue growth year 1 (anchors the second half of FY2027 inside the year-1 window)"}
      - {item: "Q3 FY2027 GAAP gross margin", quote: "GAAP gross margin is expected to be 52.9% to 53.9%.", source: "[Q2 FY2027 release]", used_as: "operating margin year 1 (midpoint 53.4%)"}
      - {item: "Q3 FY2027 non-GAAP gross margin", quote: "Non-GAAP gross margin is expected to be 57.5% to 58.5%.", source: "[Q2 FY2027 release]", used_as: "not numeric (non-GAAP; GAAP figure used instead)"}
      - {item: "Q3 FY2027 GAAP operating expenses", quote: "GAAP operating expenses are expected to be approximately USD 1.015 billion.", source: "[Q2 FY2027 release]", used_as: "operating margin year 1"}
      - {item: "Q3 FY2027 non-GAAP operating expenses", quote: "Non-GAAP operating expenses are expected to be approximately USD 655 million.", source: "[Q2 FY2027 release]", used_as: "not numeric (non-GAAP)"}
      - {item: "Q3 FY2027 share count", quote: "Diluted weighted-average shares outstanding are expected to be 921 million.", source: "[Q2 FY2027 release]", used_as: "not numeric (confirms the diluted share count)"}
      - {item: "Q3 FY2027 GAAP EPS", quote: "GAAP diluted net income per share is expected to be USD 0.53 +/- USD 0.05 per share.", source: "[Q2 FY2027 release]", used_as: "not numeric (below the operating line)"}
      - {item: "Q3 FY2027 non-GAAP EPS", quote: "Non-GAAP diluted net income per share is expected to be USD 1.10 +/- USD 0.05 per share.", source: "[Q2 FY2027 release]", used_as: "not numeric (non-GAAP, below the operating line)"}
      - {item: "Q3 FY2027 data center", quote: "data center revenue forecasted to grow more than 20% sequentially and roughly 75% year-over-year.", source: "[Q2 FY2027 call]", used_as: "not numeric (segment)"}
      - {item: "Q3 FY2027 communications and other", quote: "we expect revenue to decline in the low to mid-teens percentage range both sequentially and year-over-year, followed by a solid sequential recovery in the fourth quarter.", source: "[Q2 FY2027 call]", used_as: "not numeric (segment)"}
      - {item: "Q3 FY2027 non-GAAP tax rate", quote: "We expect a non-GAAP tax rate of 11%.", source: "[Q2 FY2027 call]", used_as: "not numeric (FY2027 rate; superseded by the FY2028 rate used as the starting tax rate)"}
      - {item: "Q3 FY2027 gross-margin driver", quote: "the forecasted acceleration of our custom business creating ... the sequential headwind in the fiscal third quarter", source: "[Q2 FY2027 call]", used_as: "not numeric (the machine transcript first garbles 'headwind' as 'headroom' and then corrects itself; the corrected phrase is quoted, as in outlook.md section 4)"}
      - {item: "Q4 FY2027 gross margin", quote: "We currently expect to maintain gross margin in this range in the fourth fiscal quarter.", source: "[Q2 FY2027 call]", used_as: "not numeric"}
      - {item: "Q4 FY2027 non-GAAP operating margin", quote: "non-GAAP operating margin likely to enter our 38% to 40% long-term target range in Q4 of this fiscal year.", source: "[Q2 FY2027 call]", used_as: "not numeric (non-GAAP; converting to GAAP needs a stock-pay assumption management does not give)"}
      - {item: "FY2027 revenue", quote: "we now expect overall Marvell revenue in fiscal 2027 to grow approximately 45% year-over-year to roughly USD 12 billion, up from our prior outlook of approximately USD 11.5 billion just 1 quarter ago.", source: "[Q2 FY2027 call]", used_as: "revenue growth year 1 (interpolation anchor)"}
      - {item: "FY2027 data center", quote: "which we now expect to grow by approximately 60% this fiscal year, up from our prior expectation of approximately 50%.", source: "[Q2 FY2027 call]", used_as: "not numeric (segment)"}
      - {item: "FY2027 communications and other", quote: "we currently expect fiscal 2027 growth to approach our 10% target.", source: "[Q2 FY2027 call]", used_as: "not numeric (segment)"}
      - {item: "FY2027 non-GAAP operating expenses", quote: "For fiscal 2027, we expect non-GAAP operating expenses of approximately USD 2.55 billion, slightly above our prior expectation of USD 2.45 billion", source: "[Q2 FY2027 call]", used_as: "not numeric (non-GAAP)"}
      - {item: "FY2027 capacity prepayments", quote: "We remain on pace to make approximately USD 1 billion of capacity prepayments to suppliers in fiscal 2027.", source: "[Q2 FY2027 call]", used_as: "not numeric (one component of reinvestment; no capex or working-capital guidance to complete net reinvestment)"}
      - {item: "Capacity deposits schedule", quote: "we committed to pay deposits totaling USD 870.0 million, payable in quarterly installments from the second quarter of fiscal 2027 through the second quarter of fiscal 2028.", source: "[10-Q Q1 FY2027, Note 9]", used_as: "not numeric (timing of the prepayments inside the year-1 window)"}
      - {item: "FY2028 revenue", quote: "we now expect fiscal 2028 revenue of approximately USD 18 billion, up USD 1.5 billion from the USD 16.5 billion outlook we provided just 1 quarter ago.", source: "[Q2 FY2027 call]", used_as: "revenue growth year 1 (interpolation anchor) and year 2 (nearest-year mapping)"}
      - {item: "FY2028 data center", quote: "we now expect Marvell's Data Center revenue to grow more than 60% year-over-year in fiscal 2028", source: "[Q2 FY2027 call]", used_as: "not numeric (segment)"}
      - {item: "FY2028 custom", quote: "We remain confident that this business will more than double year-over-year in fiscal 2028 and accelerate significantly in fiscal 2029.", source: "[Q2 FY2027 call]", used_as: "not numeric (segment; the FY2029 phrase is qualitative)"}
      - {item: "FY2028 operating expenses", quote: "We currently expect non-GAAP operating expenses to grow at roughly half the rate of revenue growth in percentage terms.", source: "[Q2 FY2027 call]", used_as: "not numeric"}
      - {item: "FY2028 non-GAAP operating margin", quote: "to achieve the upper end of our target non-GAAP operating model of 38% to 40% as we progress through the year", source: "[Q2 FY2027 call]", used_as: "not numeric (non-GAAP; GAAP conversion needs stock pay, not guided)"}
      - {item: "FY2028 non-GAAP tax rate", quote: "we expect non-GAAP tax rate of approximately 13% in fiscal 2028.", source: "[Q2 FY2027 call]", used_as: "the starting tax rate (all cases)"}
      - {item: "FY2028 gross margin", quote: "My preliminary view is gross margins next year are going to be in a similar range, same range as we're exiting this year.", source: "[Q2 FY2027 call]", used_as: "not numeric"}
      - {item: "Long-term model", quote: "we're going to reset that long-term target model here in the coming weeks at the Analyst Day.", source: "[Q2 FY2027 call]", used_as: "not numeric"}
      - {item: "Google warrant arithmetic (FY2029 and beyond)", quote: "you should assume starting in FY '29 and beyond whatever you've modeled previously prior to the warrant for custom numbers definitely goes higher", source: "[Q2 FY2027 call]", used_as: "not numeric"}
      - {item: "Custom FY2029 upside", quote: "clearly, there's a lot of upside bias in those numbers in fiscal '29 and beyond in custom.", source: "[Q2 FY2027 call]", used_as: "not numeric (informs the base-case fiscal 2029 custom figure)"}
      - {item: "Scale-out switching FY2027", quote: "Within scale-out switching, our business remains on track to more than double this year", source: "[Q2 FY2027 call; Q2 FY2027 slides, p.18]", used_as: "not numeric (segment; Q1 form was 'exceed USD 600 million, doubling from fiscal 2026', tracking to 'more than USD 1 billion in annualized revenue in fiscal 2028' [Q1 FY2027 call])"}
      - {item: "Interconnect FY2027 (Q1 target, not restated in Q2)", quote: "we have increased our fiscal 27 revenue growth expectations for this business to more than 70% year over year", source: "[Q1 FY2027 call; Q1 FY2027 slides, p.7]", used_as: "not numeric (segment; scorecard.md grades it Partial)"}
      - {item: "Custom FY2027 (Q1 target, not restated in Q2)", quote: "Custom revenue remains on track to grow more than 20% year over year in fiscal 27", source: "[Q1 FY2027 call; Q1 FY2027 slides, p.14]", used_as: "not numeric (segment)"}
      - {item: "Custom FY2029 target and market", quote: "We remain confident in achieving our target model for our custom business to deliver on over USD 10 billion in revenue in fiscal 29.", source: "[Q1 FY2027 call]", used_as: "not numeric (segment target; the 'USD 55 billion TAM' behind it feeds the final-year market size in the diagnostics)"}
      - {item: "DCI modules", quote: "Giving us line of sight to a USD 1 billion annualized revenue during fiscal 28. This would represent approximately double the revenue we achieved in fiscal 26 when the business generated roughly USD 500 million in revenue.", source: "[Q1 FY2027 call]", used_as: "not numeric (segment anchor inside the interconnect residual)"}
      - {item: "Scale-up optics FY2028 (Q1 figure, superseded)", quote: "scale up optics which you know, we are effectively calling at this point to be about USD 300 million", source: "[Q1 FY2027 call]", used_as: "not numeric (Q2: 'much larger than we thought just a quarter ago', no new figure)"}
      - {item: "Cloud capex planning assumption FY2028 (Q1, dropped in Q2)", quote: "we are planning for the rate of cloud CapEx growth to moderate into the 30%-plus range", source: "[Q1 FY2027 call]", used_as: "not numeric (informs the base-case step down in year 3)"}
      - {item: "Communications FY2028 (Q1)", quote: "we continue to expect low single digit percentage revenue growth in fiscal 28, consistent with our prior view.", source: "[Q1 FY2027 call]", used_as: "not numeric (segment)"}
    revenue_growth:
      values: [0.587, 0.20, null, null, null]
      reason: "Management's two revenue figures turned into growth rates. Its fiscal years do not line up with the twelve-month windows this model uses, so year 1 takes the midpoint of the two guided years and year 2 takes the later one, both approximations noted below; years 3 to 5 have no company-level guidance of any kind."
      source: "[Q2 FY2027 call; Q2 FY2027 slides, p.8]"
      detail: |
        Year 1 covers the six months after fiscal 2027 ends and the six months before fiscal 2028 ends,
        so the midpoint of 'roughly 12 billion' and 'approximately 18 billion' is used: 15,000 divided
        by 9,450.3 less one is 0.587 (computed) [Q2 FY2027 call; Q2 FY2027 slides, p.8]. Year 2 takes
        fiscal 2028's 18,000 as the nearest guided point: 18,000 over 15,000 less one is 0.20. That
        understates year 2, because the window also holds the first half of fiscal 2029, which
        management says will 'accelerate significantly' in custom without giving a company figure
        [Q2 FY2027 call]. The other guided item that could be turned into a number is the custom target
        of 'over 10 billion in revenue in fiscal 29', but it covers one product line, so it cannot fill
        a company revenue line on its own [Q1 FY2027 call].
    operating_margin:
      values: [0.212, null, null, null, null]
      reason: "One quarter's guidance stretched over a whole year, which is the only official margin management's own numbers support. Years 2 to 5 are left empty because turning the later adjusted target into an official margin needs a share-based-pay figure management does not give."
      source: "[Q2 FY2027 release]"
      detail: |
        Year 1 = the guided third-quarter gross margin midpoint of 53.4% less guided operating expenses
        of 1,015 on revenue of 3,150, which is 32.2% of revenue, giving 21.2% (computed)
        [Q2 FY2027 release]. It understates the window, because the fourth quarter and fiscal 2028 carry
        the 38% to 40% adjusted target and much lower acquisition write-downs [Q2 FY2027 call].
    sales_to_capital:
      value: null
      value_late: null
      reason: "Not guided. The only spending figure management gives is 'approximately 1 billion of capacity prepayments' for this fiscal year, and that is one part of investment; without capital-spending and working-capital guidance it cannot be turned into a ratio."
      source: "[Q2 FY2027 call]"
    reinvestment_override:
      values: [null, null, null, null, null]
      reason: "The prepayment figure alone is not a net investment number, and nothing else about spending is guided, so this case has no reinvestment line and cannot be computed."
      source: "[Q2 FY2027 call]"
    tax_rate:
      start: 0.13
      terminal: 0.25
      reason: "Management's own estimate of tax on continuing profits for fiscal 2028, approximately 13%, against 11% for this year, with the terminal year at the rate the model uses for a mature company. That estimate is the rate left once one-off items are stripped out."
      source: "[Q2 FY2027 call]"
    cost_of_capital_override: null
    terminal:
      growth:
        value: null
        allow_above_riskfree: false
        reason: "Management gives no long-run growth rate."
      roic_premium:
        value: null
        allow_large_premium: false
        reason: "Management gives no return-on-capital target."

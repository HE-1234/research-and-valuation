        reason: "Eleven points above the cost of capital, so the perpetual return is around 20% at today's rates: in this case the lock-in described in business.md section 5 proves durable, the warrant keeps the largest custom customer buying into the 2030s, and Marvell holds the leading position in both the optics and the switches that sit next to the processors. It is still below what the business earns today on the capital behind its designs and about half of what it earns in year 10, and it matches the eleven points Damodaran gave Nvidia, the strongest chip franchise he has valued, which is as far as a case that still rests on the customers' own chip designs should go."
        detail: |
